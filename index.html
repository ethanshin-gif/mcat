rugs", "term": "Methadone", "d": ["Long acting opioid, used to help opioid addiction recovery."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Hallucinogen", "d": ["Perception altering drugs with upper-like symptoms. Theorized to interact with neurotransmitters like serotonin."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Lysergic Acid Diethylamide (LSD)", "d": ["Hallucinogen."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Marijuana", "d": ["Drug with downer-like symptoms. Active chemical is tetrahydrocannabinol (THC), which increases dopamine, decreases GABA."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Mesolimbic Reward Pathway", "d": ["1 of 4 dopaminergic pathways. Associated with drugs, gambling, love.", "• Nucleus Accumbens (NAc)", "• Medial Forebrain Bundle (MFB)", "• Ventral Tegmental Area (VTA)"]}, {"ch": 4, "sec": "4.5 Attention", "term": "Attention", "d": ["Concentrate on 1 aspect of a sensory environment."]}, {"ch": 4, "sec": "4.5 Attention", "term": "Sensorium", "d": ["Total sensory input available to the consciousness in a given moment."]}, {"ch": 4, "sec": "4.5 Attention", "term": "Selective Attention", "d": ["Focusing on 1 part of the sensorium, ignoring the rest."]}, {"ch": 4, "sec": "4.5 Attention", "term": "Cocktail Party Phenomenon", "d": ["Ability to focus on 1 conversation while ignoring other stimuli, but still being able to recognize your name being spoken elsewhere."]}, {"ch": 4, "sec": "4.5 Attention", "term": "Dichotic Listening Tests", "d": ["Tests selective attention by using auditory stimuli in both ears. May involve shadowing."]}, {"ch": 4, "sec": "4.5 Attention", "term": "Shadowing", "d": ["Repeating a message you heard."]}, {"ch": 4, "sec": "4.5 Attention", "term": "Divided Attention", "d": ["Ability to perform multiple tasks simultaneously, usually involving automatic processing rather than controlled processing."]}, {"ch": 4, "sec": "4.6 Language", "term": "5 Components of Language", "d": ["Phonology, Morphology, Semantics, Syntax, Pragmatics (PMSSP)"]}, {"ch": 4, "sec": "4.6 Language", "term": "Phonology", "d": ["Sound of a language."]}, {"ch": 4, "sec": "4.6 Language", "term": "Phonemes", "d": ["Speech sound."]}, {"ch": 4, "sec": "4.6 Language", "term": "Categorical Perception", "d": ["Distinguishing of similar-sounding phonemes."]}, {"ch": 4, "sec": "4.6 Language", "term": "Morphology", "d": ["Structure of words."]}, {"ch": 4, "sec": "4.6 Language", "term": "Morphemes", "d": ["Building blocks of words. Prefixes, suffixes."]}, {"ch": 4, "sec": "4.6 Language", "term": "Semantics", "d": ["Association of meaning with a word."]}, {"ch": 4, "sec": "4.6 Language", "term": "Syntax", "d": ["How words are put together into sentences, word order."]}, {"ch": 4, "sec": "4.6 Language", "term": "Pragmatics", "d": ["Dependence of a language on context. Stranger vs friend."]}, {"ch": 4, "sec": "4.6 Language", "term": "Prosody", "d": ["Tone of voice."]}, {"ch": 4, "sec": "4.6 Language", "term": "Language Development", "d": ["• 12 Months – First words", "• 18 Months – Naming Explosion", "• 18m - 20m – Word combining", "• 2/3 Years – Sentences"]}, {"ch": 4, "sec": "4.6 Language", "term": "Babbling", "d": ["Precursor to language. Meaningless speech."]}, {"ch": 4, "sec": "4.6 Language", "term": "Naming Explosion", "d": ["At ~18 months, children learn dozens of words."]}, {"ch": 4, "sec": "4.6 Language", "term": "Overextension", "d": ["During naming explosion, children incorrectly use a word too broadly to describe a similar thing."]}, {"ch": 4, "sec": "4.6 Language", "term": "Errors of Growth", "d": ["Grammatical error during a child’s language development."]}, {"ch": 4, "sec": "4.6 Language", "term": "Nativist / Biological Theory", "d": ["Noam Chomsky. Humans have a biological predisposition to learning language."]}, {"ch": 4, "sec": "4.6 Language", "term": "Transformational Grammar", "d": ["The same idea can be expressed in different grammatical forms."]}, {"ch": 4, "sec": "4.6 Language", "term": "Language Acquisition Device (LAD)", "d": ["Theoretical brain pathway in babies that gives them innate language learning abilities."]}, {"ch": 4, "sec": "4.6 Language", "term": "Critical Period", "d": ["Language can only be learned from 2-13 years."]}, {"ch": 4, "sec": "4.6 Language", "term": "Sensitive Period", "d": ["Language is best learned from 2-13 years."]}, {"ch": 4, "sec": "4.6 Language", "term": "Learning / Behaviorist Theory", "d": ["BF Skinner. Humans learn language like they learn everything else, it’s not particularly innate. Operant conditioning + reinforcement."]}, {"ch": 4, "sec": "4.6 Language", "term": "Social Interactionist Theory", "d": ["Humans language acquisition is driven by the desire to communicate and be social."]}, {"ch": 4, "sec": "4.6 Language", "term": "Linguistic Relativity / Whorfian Hypothesis", "d": ["Our perception of reality is determined by language."]}, {"ch": 4, "sec": "4.6 Language", "term": "Arcuate Fasciculus", "d": ["Bundle of axons that connect Broca’s Area + Wernicke’s Area."]}, {"ch": 4, "sec": "4.6 Language", "term": "Aphasia", "d": ["Impairment of language production or comprehension."]}, {"ch": 4, "sec": "4.6 Language", "term": "Broca’s / Expressive Aphasia", "d": ["Impaired speech production."]}, {"ch": 4, "sec": "4.6 Language", "term": "Wernicke’s / Receptive Aphasia", "d": ["Impaired speech comprehension."]}, {"ch": 4, "sec": "4.6 Language", "term": "Conduction Aphasia", "d": ["You cannot repeat what was just said, but you can understand and independently say it. Damaged arcuate fasciculus."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Motivation", "d": ["Driving force behind actions."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Appetite", "d": ["Desire to fulfill a physical need."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Extrinsic Motivation", "d": ["Motivation to get a reward or avoid a punishment."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Intrinsic Motivation", "d": ["Motivation to do something for its inherent satisfaction."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Instincts", "d": ["Innate patterns of behavior. Primitive reflexes."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Instinct Theory", "d": ["Behavior is motivated by innate instinct."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Arousal", "d": ["Psychological + Physiological state of being awake and reacting to stimuli."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Arousal Theory", "d": ["Behavior is motivated by the desire to maintain a level of arousal."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Yerkes-Dodson Law", "d": ["Bell-shaped curve describing arousal, performance. Performance is best when arousal is not too low or too high, and instead in the middle. Counterintuitively, simple tasks require more arousal than complex tasks."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Drives", "d": ["State of discomfort/tension that motivates behavior."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Primary Drives", "d": ["Drives that motivate us to sustain our bodies."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Homeostasis", "d": ["Usually controlled by negative feedback loop."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Secondary Drives", "d": ["Drives that motivate behavior separate from basic biological needs."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Drive Reduction Theory", "d": ["We are motivated to do things that eliminate the state of discomfort/tension."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Primary Needs", "d": ["Biological needs of food, water, sleep, shelter."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Secondary Needs", "d": ["Mental states or desires."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Needs", "d": ["Long-lasting feelings that require relief, and tend to drive behavior."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Maslow’s Hierarchy of Needs", "d": ["Hierarchy of needs, segregated into 5 groups.", "• Physiological", "• Safety", "• Love/Belonging", "• Esteem"]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Self-Actualization", "d": ["Maslow’s Hierarchy; the need to realize your full potential."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Self-determination Theory (SDT)", "d": ["You feel most intrinsically motivated when 3 needs are met. Autonomy, Competence, Relatedness."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Autonomy", "d": ["SDT; the need to be in control of your actions or ideas."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Competence", "d": ["SDT; the need to feel capable."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Relatedness", "d": ["SDT; the need for relationships."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Incentive Theory", "d": ["Behavior is motivated by rewards and punishment (extrinsic motivation), not intrinsic motivation."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Expectancy-Value Theory", "d": ["Motivation depends on how much you believe you can succeed (expectancy) + value of the task (value)."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Opponent-Process Theory", "d": ["The brain automatically creates an opposite emotion to balance any strong emotion you feel. The opposite emotion lasts longer, which leads to tolerance + addiction + withdrawals."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Tolerance", "d": ["Decreased in perceived drug effect over time."]}, {"ch": 5, "sec": "5.1 Motivation", "term": "Sexual Motivation", "d": ["Hormone concentration is strongly correlated with sexual desire."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "3 Elements of Emotion", "d": ["Physiological + Behavioral + Cognitive Response"]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Physiological Response", "d": ["3 elements of emotion; heart rate + breathing, etc. Autonomic nervous system."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Behavioral Response", "d": ["3 elements of emotion; facial expressions + body language."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Cognitive Response", "d": ["3 elements of emotion; subjective thoughts."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "7 Universal Emotions", "d": ["Happiness, Sadness, Contempt, Surprise, Fear, Disgust, Anger"]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Facial-Feedback Effect / Hypothesis", "d": ["Your facial expressions can affect how you feel. Weak and strong versions."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Evolutionary Perspective", "d": ["Emotions are a product of evolution via natural selection."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "James-Lange Theory of Emotion", "d": ["Nervous system arousal, then conscious emotion, then action."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Cannon-Bard Theory of Emotion", "d": ["Nervous system arousal and conscious emotion, then action."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Schachter-Singer / Cognitive Arousal / 2 Factor / Theory of Emotion", "d": ["Nervous system arousal, then cognitive appraisal of that arousal, then conscious emotion."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Limbic System", "d": ["Forebrain structures involved in emotion + memory. Underneath cerebrum, on both sides of thalamus. Amygdala + Thalamus + Hypothalamus + Hippocampus + Fornix + Septal Nuclei + Parts of Cerebral Cortex."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Amygdala", "d": ["Processes the environment and stimuli + Signals to the cortex. Fear (aggressive + defensive), facial expressions."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Emotional Memory", "d": ["Implicit memories storing the emotions about an event, usually in the amygdala. Explicit memories storing the actual events themselves are hippocampus-related."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Thalamus", "d": ["Forebrain structure that relays signals from the rest of the body. No smell."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Hypothalamus", "d": ["Forebrain structure for homeostasis (metabolism, temperature, water). Turns emotions into physiological response via hormone release."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Hippocampus", "d": ["Stores short term → long term explicit memories. Contextualizes emotions."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Prefrontal Cortex", "d": ["Frontal lobe, supervises other brain regions. Decision-making and impulse control. Association area."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Dorsal Prefrontal Cortex", "d": ["Attention + Cognition."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Ventral Prefrontal Cortex", "d": ["Emotion experiencing."]}, {"ch": 5, "sec": "5.2 Emotion", "term": "Ventromedial Prefrontal Cortex", "d": ["Decision-making, controls amygdala’s emotions by reducing/increasing its signal to the rest of the cortex."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Cognitive Appraisal", "d": ["Subjective appraisal of a stress-inducing situation."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Primary Appraisal", "d": ["Appraisal of the environment and possible threat."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Secondary Appraisal", "d": ["Appraisal of your ability to handle the threat."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Harm", "d": ["Damage caused by the threat."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Threat", "d": ["Potential future damage caused by the threat."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Challenge", "d": ["Possibility of overcoming the threat."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Reappraisal", "d": ["Cognitive appraisal that happens after an initial appraisal."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Stressor", "d": ["Anything that causes a stress response. Ranges from environmental factors to social expectations."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Distress", "d": ["When a stressor is perceived as negative, a threat. A school shooter."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Eustress", "d": ["When a stressor is perceived as positive, a challenge. Getting married."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Social Readjustment Rating Scale", "d": ["A scale measuring stress."]}, {"ch": 5, "sec": "5.3 Stress", "term": "General Adaptation Syndrome", "d": ["Hans Selye. The body’s 3 stage response to a stressor."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Alarm", "d": ["Initial reaction to a stressor. Activated sympathetic nervous system, ACTH + Cortisol + Epinephrine + Norepinephrine."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Resistance", "d": ["Continuous release of hormones (cortisol) to maintain an elevated stress response. May include SNS. Can be short, but also very long during chronic stress."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Exhaustion", "d": ["The body can no longer maintain the elevated sympathetic nervous system response. Vulnerability."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Diathesis-Stress Model", "d": ["Psychological disorders come from genetic predisposition (diathesis) and stressors (stress). Schizophrenia, depression."]}, {"ch": 5, "sec": "5.3 Stress", "term": "Coping", "d": ["Can be good (exercise, breathing, spiritual) or bad (drugs, alcohol)."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Self-Concept", "d": ["The way you see yourself"]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Self-Schema", "d": ["A specific label you give to yourself."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Identity", "d": ["The components of your self-concept, related to the groups you belong to."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Gender Identity", "d": ["The way you see yourself on a masculinity/feminity scale."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Androgyny", "d": ["To be both highly masculine + highly feminine."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Undifferentiated", "d": ["To be neither masculine + feminine."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Theory of Gender Schema", "d": ["Brain creates male and female schema, and forces everything to fit in those 2. Persistence of gender roles."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Ethnic Identity", "d": ["Part of your identity associated with your membership to an ethnic group."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Nationality", "d": ["One’s legal and political membership to a nation."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Hierarchy of Salience", "d": ["The ranking of identities making up your self-concept, based on probability of invocation."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Self-Identification", "d": ["Your ability to recognize yourself."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Self-Discrepancy Theory", "d": ["Humans have 3 selves. Differences between these selves lead to negative feelings."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Actual Self", "d": ["The kind of person you think you are."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Ideal Self", "d": ["The kind of person you want to be."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Ought Self", "d": ["The kind of person you believe you should be."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Self-Esteem", "d": ["How much you think of yourself. Less differences in the 3 selves lead to higher self-esteem."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Self-Efficacy", "d": ["How much you believe in your ability to succeed."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Learned Helplessness", "d": ["A perceived lack of control over an outcome. Related to clinical depression."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Locus of Control", "d": ["How much control one believes they have over their life. Internal means you believe you control your fate."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Social Comparison Theory", "d": ["Individuals evaluate themselves by comparison to others."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Upward Social Comparison", "d": ["Individuals compare themselves to people they see as better."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Lateral Social Comparison", "d": ["Individuals compare themselves to people they see as similar."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Downward Social Comparison", "d": ["Individuals compare themselves to people they see as worse."]}, {"ch": 6, "sec": "6.1 Self Concept and Identity", "term": "Metacognition", "d": ["The awareness of your own thoughts and emotions. Thinking about thinking."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Libido", "d": ["Sex drive."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Fixation", "d": ["One becomes psychologically stuck at a psychosexual stage due to under- or overgratification."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Neurosis", "d": ["Mental stress or disorder usually resulting from fixation. Carries into adulthood."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Freud Psychosexual Development", "d": ["• Oral Stage – 0-1 years. Gratification comes from the mouth, sucking and biting.", "• Anal Stage – 1-3 years. Gratification comes from pooping and pissing correctly.", "• Phallic / Oedipal Stage – 3-5 years. Oedipal and Electra conflict. Penis envy.", "• Oedipal Conflict – Male child envies father’s relationship with mother. Resolved when the child identifies with his father.", "• Electra Conflict – Female child envies mother’s relationship with father. Resolved when the child identifies with his mother.", "• Sublimates – One turns unacceptable impulses into productive activities. Healthy defense mechanism.", "• Penis Envy – Female child envies that male children have penises.", "• Latency Stage – 6 years-puberty. Social skills, learning, friendships, etc.", "• Genital Stage – Puberty onwards. Development of sexual/romantic relationships."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Oral Stage", "d": ["0-1 years. Gratification comes from the mouth, sucking and biting."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Anal Stage", "d": ["1-3 years. Gratification comes from pooping and pissing correctly."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Phallic / Oedipal Stage", "d": ["3-5 years. Oedipal and Electra conflict. Penis envy."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Oedipal Conflict", "d": ["Male child envies father’s relationship with mother. Resolved when the child identifies with his father."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Electra Conflict", "d": ["Female child envies mother’s relationship with father. Resolved when the child identifies with his mother."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Sublimates", "d": ["One turns unacceptable impulses into productive activities. Healthy defense mechanism."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Penis Envy", "d": ["Female child envies that male children have penises."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Latency Stage", "d": ["6 years-puberty. Social skills, learning, friendships, etc."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Genital Stage", "d": ["Puberty onwards. Development of sexual/romantic relationships."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Erikson’s Theory of Psychosocial Development", "d": ["Personality develops from the resolution of specific conflicts."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Trust vs Mistrust", "d": ["0-1 year. Baby decides to trust or not trust their caretaker. Can I trust the world?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Autonomy vs Shame/Doubt", "d": ["1-3 years. Child learn independence, which will lead to either autonomy or shame/doubt. Is it okay to be me?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Initiative vs Guilt", "d": ["3-6 years. Child learns to take initiative, play, explore. Is it okay for me to do certain things?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Industry vs Inferiority", "d": ["6-12 years. Child learns competence, working hard, achievement. Can I make it in the world?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Identity vs Role Confusion", "d": ["12-18 years. Teenager forms identity. Who am I and what can I be?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Intimacy vs Isolation", "d": ["18-40. Adult learns loving or romantic relationships. Can I love?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Generativity vs Stagnation", "d": ["40-65 years. Adult contributes to society, raises kids. Can I make my life count?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Integrity vs Despair", "d": ["65+ years. Adult looks back on their life. Is it okay to have been me?"]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Kohlberg’s Theory of Moral Reasoning", "d": ["People progress through 3 levels of moral thinking, each with 2 levels."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Preconventional Morality", "d": ["Kohlberg’s Theory; preadolescent thinking emphasizing consequences."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Obedience", "d": ["Preconventional; avoid punishment."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Self-Interest / Instrumental Relativist Stage", "d": ["Preconventional; gain rewards."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Conventional Morality", "d": ["Kohlberg’s Theory; adolescent and adult thinking emphasizing relationship to others."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Conformity", "d": ["Conventional; seek approval of others."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Law and Order", "d": ["Conventional; maintain social order."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Postconventional Morality", "d": ["Kohlberg’s Theory; adult thinking not everyone is capable of, emphasizing morals."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Social Contract", "d": ["Postconventional; greater good and individual rights."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Universal Human Ethics", "d": ["Postconventional; abstract principles."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Role-Taking", "d": ["Ability to understand the perspective of someone else."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Theory of Mind", "d": ["Ability to understand that other people have their own thoughts and emotions, etc."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Looking-Glass Self", "d": ["We develop our own image based on how we think other people view us."]}, {"ch": 6, "sec": "6.2 Formation of Identity", "term": "Reference Group", "d": ["A group we use as a standard to compare ourselves to."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Personality", "d": ["Relatively stable set of feelings, thoughts, traits, behaviors that are characteristic of an individual. Theories of personality can be divided into 4.", "• Psychoanalytic / Psychodynamic", "• Humanistic / Phenomenological", "• Type and Trait", "• Behaviorist"]}, {"ch": 6, "sec": "6.3 Personality", "term": "Psychoanalytic / Psychodynamic Theories of Personality", "d": ["4 theories of personality; assume internal states that determine personality. Freud."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Freud’s Structural Model of the Mind", "d": ["The mind consists of 3 entities: Id, Ego, Superego."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Id", "d": ["Primal part of the mind; urge to survive and reproduce. Freud."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Pleasure Principle", "d": ["Achieving immediate gratification to relieve pent-up tension."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Primary Process", "d": ["Id makes one act in a way to achieve immediate gratification, as described by the pleasure principle."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Wish Fulfillment", "d": ["Mental imagery relieves tension, and gives immediate gratification. Dreams, fantasy."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Ego", "d": ["Logical part of the mind; moderates conflict between id’s desire and superego’s moral."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Reality Principle", "d": ["Delay gratification to achieve things in a realistic, acceptable way."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Secondary Process", "d": ["Ego makes one act logically and plan to achieve delayed gratification, as described by the reality principle."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Superego", "d": ["Perfectionist part of the mind; judges actions according to an ideal moral standard."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Conscience", "d": ["Superego part that makes one feel guilty for doing something wrong."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Ego-Ideal", "d": ["Superego part that makes one feel pride for meeting some ideal standard."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Conscious", "d": ["Thoughts we have conscious access to."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Preconscious", "d": ["Thoughts we aren’t aware of."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Unconscious", "d": ["Thoughts we have repressed."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Instinct (Freud)", "d": ["Innate psychological representation of a biological need."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Eros", "d": ["Instincts that promote life, like eating and drinking."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Thanatos", "d": ["Death instincts, unconscious wish for death. Trauma victims reenacting."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Defense Mechanism", "d": ["Ego’s way to relieve the inherent anxiety caused by the clash between superego and id. All of them (1) distort reality (2) operate unconsciously."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Repression", "d": ["Defense mechanism; ego unconsciously blocks undesired thoughts/urges."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Suppression", "d": ["Defense mechanism*; ego consciously blocks undesired thoughts/urges."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Regression", "d": ["Defense mechanism; reversion to an earlier developmental stage."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Reaction Formation", "d": ["Defense mechanism; ego unconsciously suppresses an urge by producing the opposite urge. Celebrity hate."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Projection", "d": ["Defense mechanism; project own feelings onto others."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Rorschach Inkblot Test", "d": ["Interpret inkblot, which reveals unconscious feelings hidden by projection."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Thematic Apperception Test", "d": ["Show someone pictures, and ask them to make up a story. Theorized to reveal unconscious feelings."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Rationalization", "d": ["Defense mechanism; justify an unacceptable thought with a logical-sounding excuse."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Displacement", "d": ["Defense mechanism; redirect emotions/urges from the original thing to another thing, usually safer."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Sublimation", "d": ["Defense mechanism; transform unacceptable urges into acceptable behaviors."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Jung’s Ego", "d": ["Jung defined ego as the conscious mind."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Personal Unconscious", "d": ["Unconscious of one person."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Collective Unconscious", "d": ["Collective unconscious of humanity, early ancestors."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Archetypes", "d": ["Universal symbols or themes that exist in the collective unconscious."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Persona", "d": ["Archetype; part of our personality we present to the world."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Anima / Animus", "d": ["Archetype; gender-inappropriate parts of our personality. Man’s inner woman + Woman’s inner man."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Shadow", "d": ["Archetype; responsible for unconscious bad thoughts."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Self", "d": ["Intersection between conscious, personal unconscious, collective unconscious. Strives for unity."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Word Association Testing", "d": ["Say the first word that comes to mind after hearing a word. Theorized to reveal parts of the unconscious.", "Jung’s Dichotomies of Personality."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Extraversion vs Introversion", "d": ["Jung’s dichotomies of personality; orientation to the outer (E) vs inner world (I)."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Sensing vs Intuiting", "d": ["Jung’s dichotomies of personality; working with info objectively (S) vs abstractly (I)."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Thinking vs Feeling", "d": ["Jung’s dichotomies of personality; using logic (T) vs personal beliefs (F)."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Myers-Briggs Type Inventory (MBTI)", "d": ["Personality test, partly built from Jung’s dichotomies of personality. Type theory."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Judging vs Perceiving", "d": ["Preference of order (J) vs spontaneity (P)."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Inferiority Complex", "d": ["Alfred Adler. One’s sense of incompleteness or inferiority, which drives personality."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Creative Self", "d": ["Adler; people actively create their own, unique personalities."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Style of Life", "d": ["Adler; the unique way/pattern someone approaches life."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Fictional Finalism", "d": ["Adler; people are more motivated by their expectations for the future than the past."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Neurotic Needs", "d": ["Karen Horney; an excessive need directed towards reducing negative feelings, and making life better, coping. Consist of (1) moving towards (2) moving against (3) moving away from people."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Basic Anxiety", "d": ["Horney; vulnerability caused by inadequate caretaking."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Basic Hostility", "d": ["Horney; anger caused by rejection or neglect."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Object Relations Theory", "d": ["Early relationships with caretakers influence future social interactions."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Humanistic / Phenomenological Theorists", "d": ["Focus on the value of individuals, person-centered."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Gestalt Therapy", "d": ["Focuses on the complete (holistic) person, rather than reducing them to individual behaviors."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Force Field Theory", "d": ["Kurt Lewin; the current state of one’s mind is the sum of opposing forces/influences acting on them."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Peak Experience", "d": ["Maslow; profoundly moving experiences that have important, long-lasting effects on an individual."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Personal Construct Psychology", "d": ["George Kelly; an individual acts like a scientist by creating theories + constructs to predict the behavior of others."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Client-Centered / Person-Centered / Nondirective Therapy", "d": ["Carl Rogers; therapy model where client guides conversation, and has more autonomy."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Unconditional Positive Regard", "d": ["Rogers; therapy technique where therapists completely accept the client to make a positive environment."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Type Theorists", "d": ["Separate people into personality types."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Trait Theorists", "d": ["Personality is the sum of someone’s individual behaviors."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Humors", "d": ["Body fluids. Greeks believed an imbalance led to personality disorders."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Somatotypes", "d": ["William Sheldon; personalities based on body types. Short stocky people are jolly, tall people are aloof."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Type A", "d": ["Personality that is competitive and compulsive."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Type B", "d": ["Personality that is laid-back and relaxed."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Traits", "d": ["Hans, Sybil Eysenck; Groups of behaviors that usually occur together. Organized desk, schedule keeping, etc. fit in the trait of conscientiousness."]}, {"ch": 6, "sec": "6.3 Personality", "term": "PEN Model", "d": ["Hans, Sybil Eysenck; trait theory that divides personality into 3 parts."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Psychoticism", "d": ["PEN Model; measure of non-conformity + lack of empathy."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Extraversion", "d": ["PEN Model; measure of social tolerance/stimulation."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Neuroticism", "d": ["PEN Model; measure of emotional arousal during high stress situations."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Negative Affect", "d": ["One’s tendency to experience negative emotions. Related to neuroticism."]}, {"ch": 6, "sec": "6.3 Personality", "term": "5 Factor Model / Big 5", "d": ["Updated PEN Model.", "• Extraversion", "• Neuroticism"]}, {"ch": 6, "sec": "6.3 Personality", "term": "Openness", "d": ["Big 5; willingness to engage, try new things."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Conscientiousness", "d": ["Big 5; self and impulse control."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Agreeableness", "d": ["Big 5; concern with maintaining harmony in social interactions."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Gordon Allport’s Traits", "d": ["• Cardinal Traits – Allport; the important traits people organize their lives around. Not everyone develops one.", "• Central Traits – Allport; major traits of one’s personality.", "• Secondary Traits – Allport; minor traits of one’s personality."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Cardinal Traits", "d": ["Allport; the important traits people organize their lives around. Not everyone develops one."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Central Traits", "d": ["Allport; major traits of one’s personality."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Secondary Traits", "d": ["Allport; minor traits of one’s personality."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Functional Autonomy", "d": ["Allport; a behavior persists despite the satisfaction of the original drive. I used to eat bananas because I was constipated, but I still eat them because I like them."]}, {"ch": 6, "sec": "6.3 Personality", "term": "N-Ach", "d": ["McClelland; Trait characterized by the Need for ACHievement. Desire to master hard things."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Behaviorist Perspective", "d": ["BF Skinner; personality is merely behaviors that have been reinforced by operant conditioning."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Token Economies", "d": ["Behaviorist therapeutic system, where desired behaviors are reinforced with tokens. Operant conditioning."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Social Cognitive Perspective", "d": ["Albert Bandura; personality is both environment influencing behavior (behaviorist) + behavior influencing environment."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Reciprocal Determinism", "d": ["Bandura; one’s thoughts, behaviors, and environment interact to shape personality."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Biological Perspective", "d": ["Personality is a result of gene expression in the brain. Related to trait theorists / perspective; traits are a result of specific genes or differences."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Dispositional Approach", "d": ["Behavior is determined by personality."]}, {"ch": 6, "sec": "6.3 Personality", "term": "Situational Approach", "d": ["Behavior is determined by environment and context."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Maladaptive", "d": ["An aspect of one’s behavior that prevents them from functioning effectively."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Biomedical Approach", "d": ["Views psychological disorders as a medical disease. Focuses on symptom reduction."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Biopsychosocial Approach", "d": ["Psychological + Biological + Social components to a psychological disorder."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Direct Therapy", "d": ["Treatment that acts directly on the individual."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Indirect Therapy", "d": ["Treatment that empowers family/friends of the individual."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Diagnostic and Statistical Manual of Mental Disorders (DSM)", "d": ["Categorizes psychological disorders by symptoms, to help clinicians. DSM-5."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Psychopharmacology", "d": ["Treatment involving use of medication."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Psychotherapy", "d": ["Treatment involving a trained therapist."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Talk Therapy", "d": ["Psychotherapy involving conversation."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Behavioral Therapy", "d": ["Psychotherapy aiming to modify behavior."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Cognitive Behavioral Therapy (CBT)", "d": ["Therapy with both talk + behavioral components. Aims to change maladaptive thoughts (cognitive) to change maladaptive behavior (behavioral)."]}, {"ch": 7, "sec": "7.1 Understanding Psychological Disorders", "term": "Systematic Desensitization", "d": ["Gradual exposure to a phobia to desensitize them. Classical conditioning."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Psychotic Disorders", "d": ["(DSM) Symptoms include delusions, hallucinations, disorganized thought/behavior, catatonia, negative symptoms. Spectrum."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Positive Symptoms", "d": ["Behaviors or thoughts (symptoms) added to normal behavior."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Delusion", "d": ["Beliefs not in-line with reality, or not shared by others. Maintained despite contrary evidence"]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Delusion of Reference", "d": ["Belief that common or neutral environmental cues are directed towards them. TV people are talking to me."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Delusions of Persecution", "d": ["Belief that one is being deliberately interfered, threatened, or discriminated against."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Delusions of Grandeur", "d": ["Belief that one is remarkable in some significant way."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Thought Broadcasting", "d": ["Belief that one’s thoughts are broadcasted to the world."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Thought Withdrawal", "d": ["Belief that one’s thoughts are being removed."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Thought Insertion", "d": ["Belief that thoughts are being inserted into one’s head."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Hallucination", "d": ["Perceptions that occur without external stimuli."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Disorganized Thought", "d": ["Associations fall apart due to mental disorder. No train of thought, word salad."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Neologism", "d": ["New words created by people with schizophrenia."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Disorganized Behavior", "d": ["Inability to carry out daily activities due to mental disorder."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Catatonia", "d": ["Motor behaviors characteristic of schizophrenia."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Echolalia", "d": ["Repeating another’s words for no reason, mental disorder."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Echopraxia", "d": ["Imitating another’s actions for no reason, mental disorder."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Negative Symptoms", "d": ["Behaviors or thoughts missing from normal behavior.", "• Affect – Outward expression of your internal mood/emotion.", "• Blunting – Reduction of affect expression.", "• Emotional Flattening / Flat Effect – No signs of affect expression.", "• Inappropriate Affect – Mismatch of affect expression, inappropriate.", "• Avolition – Decreased engagement in goal-oriented actions."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Schizophrenia", "d": ["Classic psychotic disorder. Disconnect between an individual and reality. 6 months, including 1 month of positive symptoms."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Prodromal Phase", "d": ["Schizophrenia; deterioration in cognitive, social functioning."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Active Phase", "d": ["Schizophrenia; psychotic symptoms are displayed."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Residual / Recovery Phase", "d": ["Schizophrenia; mental clarity which may result in depression, after the active phase."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Schizotypal Personality Disorder", "d": ["Psychotic disorder; psychotic symptoms + personality disorder."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Delusion Disorder", "d": ["Psychotic disorder; delusions for at least a month."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Brief Psychotic Disorder", "d": ["Psychotic disorder; positive psychotic symptoms for at least a day, under 1 month."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Schizophreniform Disorder", "d": ["Psychotic disorder; schizophrenia symptoms for at least 1 month, under 6 months."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Schizoaffective Disorder", "d": ["Psychotic disorder; major mood episodes with psychotic symptoms."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Depressive Disorders", "d": ["Mental disorder, characterized by being sad. Symptoms are Sadness + SIG E CAPS.", "• Sadness", "• Sleep – Insomnia, Hypersomnia", "• Interest – Anhedonia", "• Guilt", "• Energy – Lower", "• Concentration – Lower", "• Appetite – Lower or higher", "• Psychomotor – Retardation, Agitation", "• Suicidal"]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Major Depressive Disorder (MDD)", "d": ["Characterized by major depressive episodes."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Major Depressive Episode", "d": ["2+ weeks with 5+ depressive disorder symptoms, 1 of which must be sadness or anhedonia. Interference of daily activities."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Persistent Depressive Disorder (PDD)", "d": ["Characterized by 2+ years of (majority) depressed mood."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Dysthymia", "d": ["Persistent Depressive Disorder (PDD)."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Disruptive Mood Dysregulation Disorder", "d": ["Depressive disorder; persistent emotional irritability in multiple environments. Mostly ages 6-10."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Premenstrual Dysphoric Disorder", "d": ["Depressive disorder; mood swings before menstruation, resolves after menstruation."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Seasonal Affective Disorder (SAD)", "d": ["Depressive disorder; depressive symptoms caused by dark winter months. Essentially MDD with seasonal onset."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Bright Light Therapy", "d": ["Expose a pt with SAD to bright light, a specific amount of time."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Postpartum Depression", "d": ["Depressive disorder; depressive symptoms caused by hormonal levels post pregnancy."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Bipolar and Related Disorder", "d": ["Mental disorder characterized by severe mood fluctuations."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Manic Symptoms", "d": ["Exaggerated elevation in mood, energy, activity. DIG FAST.", "• Distractibility", "• Irresponsibility", "• Activity / Agitation", "• Sleep – Less", "• Talkative"]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Grandiosity", "d": ["Unrealistic increase in self-esteem."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Flight of Thoughts", "d": ["Racing thoughts, rapid speech."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Hypomanic Episode", "d": ["4+ days with 3+ manic symptoms."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Manic Episode", "d": ["7+ days with 3+ manic symptoms, which impair social or work activities."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Bipolar 1 Disorder", "d": ["Characterized by manic episodes, and sometimes but not always depressive episodes."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Bipolar 2 Disorder", "d": ["Characterized by both depressive + hypomanic episodes."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Cyclothymic Disorder", "d": ["Characterized by hypomanic + depressive symptoms not severe enough to be called episodes, over the majority of 2 years."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Monoamine / Catecholamine Theory of Depression", "d": ["Too much norepinephrine + serotonin leads to mania, too little leads to depression."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Anxiety Disorder", "d": ["Mental disorder characterized by excessive fear that interferes with daily life."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Anxiety", "d": ["Fear of an upcoming or future event, sometimes healthy."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Phobia", "d": ["Most common anxiety disorder; irrational fear of something."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Specific Phobia", "d": ["Phobia of a specific thing, like spiders."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Separation Anxiety Disorder", "d": ["Excessive fear of separation from a caregiver or home, persisting beyond normal."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Social Anxiety Disorder", "d": ["Excessive fear of social situations and possible humiliation, negative perception. 6+ months of symptoms."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Selective Mutism", "d": ["Anxiety disorder; consistent inability to speak when speaking is expected."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Panic Disorder", "d": ["Anxiety disorder; recurring, unexpected panic attacks."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Panic Attack", "d": ["Sudden surge of fear accompanied by physiological + cognitive symptoms, like fear. Not a psychological disorder."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Expected Panic Attack", "d": ["Panic attacks usually occurring due to a trigger."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Unexpected Panic Attack", "d": ["Panic attacks occurring at random."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Agoraphobia", "d": ["Anxiety disorder; fear of being in places or situations hard to escape from."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Generalized Anxiety Disorder (GAD)", "d": ["Anxiety disorder about many different things for 6+ months. Common."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Obsessive-Compulsive Disorder (OCD)", "d": ["Mental disorder characterized by compulsions and obsessions that feed off each other."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Obsession", "d": ["Persistent, intrusive thoughts."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Compulsion", "d": ["Repetitive tasks that relieve tension, but may cause impairment."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Body Dysmorphic Disorder", "d": ["OCD-related disorder; unrealistic negative perception of one’s body.", "• Muscle Dysmorphia –"]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Preoccupation", "d": ["Continuous mindset stuck on something, usually your body."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Hoarding Disorder", "d": ["OCD-related disorder."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Trichotillomania", "d": ["OCD-related disorder; compulsion to pull hair out."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Excoriation Disorder", "d": ["OCD-related disorder; compulsion to pick at skin."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Posttraumatic Stress Disorder (PTSD)", "d": ["1+ month of symptoms."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Intrusion Symptoms", "d": ["PTSD; recurring reliving of the trauma."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Arousal Symptoms", "d": ["PTSD; irritability, anxiety, self-destructive, sleep disturbance."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Avoidance Symptoms", "d": ["PTSD; avoid anything related to the trauma."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Negative Cognitive Symptoms", "d": ["PTSD; forget traumatic memories, negative feelings."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Acute Stress Disorder", "d": ["PTSD symptoms for 3+ days, but less than 1 month."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Dissociative Disorder", "d": ["Mental disorder, where one escapes stress by dissociating from their identity, memories, or consciousness."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Dissociative Amnesia", "d": ["Dissociative disorder; dissociation from memories, usually due to trauma."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Dissociative Fugue", "d": ["Condition related to dissociative amnesia. Sudden travel away from home + Identity confusion. May assume a new identity."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Dissociative Identity Disorder (DID)", "d": ["Dissociative disorder; 2+ personalities that take control of one’s behavior + memory gaps. Two-face."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Depersonalization / Derealization Disorder", "d": ["Mental disorder where people feel detached from their mind/body or surroundings. Feeling of automation, cannot recognize your reflection."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Depersonalization", "d": ["One feels detached from their mind or body."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Derealization", "d": ["One feels detached from their surroundings."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Somatic Symptom Disorder", "d": ["Mental disorder characterized by bodily (somatic) symptoms that cause stress or impairment."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Illness Anxiety Disorder", "d": ["Anxiety or somatic symptom-related disorder."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Conversion / Functional Neurological Symptom Disorder", "d": ["Somatic symptom-related disorder; physiological or neurological symptoms with no medical cause. Usually after high stress or trauma, like mom going blind."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "La Belle Indifference", "d": ["Patient is unconcerned about conversion disorder symptoms."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Personality Disorder", "d": ["Mental disorder; pattern of behavior that causes impairment in 2 of the following. Cognition + Emotions + Interpersonal Functioning + Impulse Control,"]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Ego-Syntonic", "d": ["Someone with a personality disorder sees their behavior as normal."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Ego-Dystonic", "d": ["Someone with a personality disorder sees their behavior as bad."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "General Personality Disorder", "d": ["Personality disorder diagnosed when a patient meets the criteria, but doesn’t match any of the 10 defined ones."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Cluster A Personality Disorder", "d": ["10 personality disorders; behavior labeled odd by others."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Paranoid Personality Disorder", "d": ["Cluster A; distrust or suspicion of others."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Schizotypal Personality Disorder", "d": ["Cluster A; eccentric thinking, superstition."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Schizoid Personality Disorder", "d": ["Cluster A; detachment of social relationships, restricted emotional expression."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Cluster B Personality Disorder", "d": ["10 personality disorders; behavior labeled dramatic or erratic by others."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Antisocial Personality Disorder", "d": ["Cluster B; disregard and violation of other’s rights. More in men, serial killers."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Borderline Personality Disorder", "d": ["Cluster B; instability in relationships, fear of abandonment, self-harm."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Splitting", "d": ["Borderline personality disorder, everyone is either good or bad."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Histrionic Personality Disorder", "d": ["Cluster B; attention-seeking behavior."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Narcissistic Personality Disorder", "d": ["Cluster B; excessive self-importance, constant need for admiration or attention, entitlement. Fragile self-esteem."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Cluster C Personality Disorder", "d": ["10 personality disorders; behavior labeled anxious or fearful by others."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Avoidant Personality Disorder", "d": ["Cluster C; extremely shy, fear of rejection."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Dependent Personality Disorder", "d": ["Cluster C; continuous need for reassurance, usually by a caretaker or significant other."]}, {"ch": 7, "sec": "7.2 Types of Psychological Disorders", "term": "Obsessive-Compulsive Personality Disorder (OCPD)", "d": ["Cluster C; perfectionism and inflexibility. Unlike ego-dystonic OCD, OCPD is ego-syntonic."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Schizophrenia Basis", "d": ["• Dopamine-associated", "• Hypoxemia at birth", "• Marijuana during adolescence", "• Inherited."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Neuroleptic / Antipsychotics", "d": ["Medications that depress (reduce) nerve function."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Depressive Disorder Basis", "d": ["• High glucose metabolism in amygdala", "• Hippocampus atrophy or wasting after illness", "• High cortisol", "• Low norepinephrine, serotonin, dopamine via Monoamine Theory.", "• Less neurotransmitter production, not more degradation"]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Bipolar Disorder Basis", "d": ["• High norepinephrine, serotonin via Monoamine Theory", "• Inherited", "• Multiple Sclerosis"]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Alzheimer’s Disease Symptoms", "d": ["• Diffuse brain atrophy in CT/MRI", "• Flattened cerebral sulci", "• Enlarged cerebral ventricles", "• Less blood blow + metabolism in parietal lobes", "• Less metabolism in temporal lobes", "• Less ChAT / ACh levels", "• ChAT – Choline Acetyltransferase, ACh creating enzyme.", "• Neurofibrillary Tangles – Alzheimer’s; hyperphosphorylated tau-protein tangles.", "• Beta-Amyloid Plaques – Alzheimer’s; beta-amyloid protein plaques."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Neurofibrillary Tangles", "d": ["Alzheimer’s; hyperphosphorylated tau-protein tangles."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Beta-Amyloid Plaques", "d": ["Alzheimer’s; beta-amyloid protein plaques."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Parkinson’s Disease Symptoms", "d": ["• Bradykinesia – Movement slowness.", "• Resting Tremor – Tremor when muscles aren’t used.", "• Pill-Rolling Tremor – Finger flexing + Thumb rolling.", "• Masklike Facies – Static, blank facial features + Staring eyes + Open mouth.", "• Cogwheel Rigidity – Muscle stiffness + Jerky resistance to examination", "• Shuffling Gait – Shuffle walking while hunched over.", "• Depression + Dementia is also common."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Bradykinesia", "d": ["Movement slowness."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Resting Tremor", "d": ["Tremor when muscles aren’t used."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Pill-Rolling Tremor", "d": ["Finger flexing + Thumb rolling."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Masklike Facies", "d": ["Static, blank facial features + Staring eyes + Open mouth."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Cogwheel Rigidity", "d": ["Muscle stiffness + Jerky resistance to examination"]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Shuffling Gait", "d": ["Shuffle walking while hunched over."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "Parkinson’s Disease", "d": ["Less dopamine in substantia nigra leads to lost basal ganglia neurons."]}, {"ch": 7, "sec": "7.3 Biological Basis of Nervous System Disorders", "term": "L-DOPA", "d": ["Dopamine precursor that can treat Parkinson’s Disease."]}, {"ch": 8, "sec": "", "term": "Michelangelo Phenomenon", "d": ["Interdependent people sculpt each other to develop."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Social Action", "d": ["Actions or behaviors people do because other people are around."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Yerkes-Dodson Law of Social Facilitation", "d": ["Being around other people makes you better at familiar tasks, but worse at unfamiliar tasks."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Social Facilitation", "d": ["People perform simple or familiar tasks better when others are around."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Social Inhibition", "d": ["People perform complex or unfamiliar tasks worse when others are around."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Deindividuation", "d": ["Adoption of a group-oriented identity and loss of self-awareness in a group."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Antinormative Behavior", "d": ["Behavior against the norm, not socially acceptable."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Diffusion of Responsibility", "d": ["Someone else in the group will do it, so I don’t have to."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Bystander Effect", "d": ["You are less likely to help someone when other people are present."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Social Loafing", "d": ["Tendency of people to reduce effort when in a group."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Peers", "d": ["Individuals regarded as equals by someone."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Risky Behaviors", "d": ["Can be caused by stress, or peer pressure."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Identity Shift Effect", "d": ["Under the threat of social rejection, individuals tend to shift their identity to conform to the group."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Cognitive Dissonance", "d": ["Presence of 2 simultaneous but opposing thoughts, creating discomfort. Changing, adding, or minimizing 1 can relieve this."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Asch Conformity Experiments", "d": ["Solomon Asch, individuals are likely to conform to the group opinion."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Social Interaction", "d": ["Ways 2+ individuals influence each other’s behavior."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Group Polarization", "d": ["Individuals, when in a group, make more extreme decisions than they would when alone."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Choice Shift", "d": ["Groups collaboratively make more extreme decisions than the individual members of that group would."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Groupthink", "d": ["The desire for group harmony leads to poor decision-making, without looking at alternatives. 8 symptoms."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Illusion of Invulnerability", "d": ["Members encourage risks, too optimistic."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Collective Rationalization", "d": ["Members ignore expressed concerns of group-approved ideas, as to rationalize it."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Illusion of Morality", "d": ["Members believe group-approved ideas are moral."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Excessive Stereotyping", "d": ["Members stereotype outsiders or enemies."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Pressure for Conformity", "d": ["Members feel pressured to conform to the group-approved idea."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Self-censorship", "d": ["Members withhold ideas that go against the group-approved idea."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Illusion of Unanimity", "d": ["Members believe group-approved ideas to be unanimous."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Mindguards", "d": ["Members of a group intentionally filter out information that opposes the group-approved idea."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Fad", "d": ["Behavior viewed as cool by a large community. Trends."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Mass Hysteria", "d": ["Shared, intense fear of a threat to society. Salem Witch trials."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Culture", "d": ["Beliefs, behaviors, actions, characteristics of a group or society.", "• Culture Shock –"]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Assimilation", "d": ["An individual or group’s behavior begins to resemble another group. Integration."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Ethnic Enclave", "d": ["Locations with a high concentration of one ethnicity. Chinatown."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Multiculturalism / Cultural diversity", "d": ["Communities with multiple cultures or ethnic groups."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Multicultural Socialization", "d": ["Encourages the learning of norms and behaviors of different cultures."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Subcultures", "d": ["Groups of people within a culture that distinguish themselves from that culture. Goths or Amish."]}, {"ch": 8, "sec": "8.1 Group Psychology", "term": "Counterculture", "d": ["When the subculture group is at odds with the main culture. Hippies, cults."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Socialization", "d": ["Process of developing, inheriting, and spreading norms, customs, beliefs."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Cultural Transmission / Learning", "d": ["Culture passed down from generation to generation within a culture."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Cultural Diffusion", "d": ["Spread of norms, customs, beliefs from one culture to another."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Primary Socialization", "d": ["Childhood socialization, where we learn broadly acceptable behaviors and views, mainly through observation of adults."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Secondary Socialization", "d": ["Socialization; we learned acceptable behaviors and views within smaller groups, such as school, church, sports field."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Anticipatory Socialization", "d": ["Socialization; learn behaviors and views to prepare for future"]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Resocialization", "d": ["Socialization; we discard old behaviors and views, then adopt new ones. Army or cult."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Norms", "d": ["Societal rules that define the boundaries of acceptable behavior. Laws, unwritten rules."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Mores", "d": ["Essential norms, core values of a society."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Folkways", "d": ["Norms that are considered polite or standard etiquette."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Social Control", "d": ["A society regulates and enforces norms."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Sanctions", "d": ["Rewards or punishments used to maintain norms and social control."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Formal Sanctions", "d": ["Official sanctions enforced by institutions. Jail time."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Informal Sanctions", "d": ["Unofficial sanctions enforced by social groups. Lunch table."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Agents of Socialization", "d": ["Any part of society important for learning social norms and values. Includes caregivers, environments, etc."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Popular Culture", "d": ["Common trends and beliefs at a given point in time, commonly influenced by media."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Deviance", "d": ["Violation of norms. Jaywalking, murder, etc."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Taboo", "d": ["A socially forbidden behavior."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Social Stigma", "d": ["Extreme dislike of a person or group based on deviations of norm(s)."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Labeling Theory", "d": ["Labels given to an individual affect how they are perceived, and may produce either deviance or conformity to the label."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Role Engulfment", "d": ["A single label or role engulfs an individual’s identity. Their main schtick."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Differential Association Theory", "d": ["Deviance can be learned from interactions with others, like criminal behavior. Common when deviant behavior interactions are the most numerous."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Strain Theory", "d": ["Deviance is a result of disconnect between social goals and social structure, which may not allow everyone to succeed. Thus individuals deviate from social structure in an attempt to achieve those goals."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Conformity / Majority Influence", "d": ["Matching one’s attitude, beliefs, behaviors to the norm."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Normative Conformity", "d": ["Conforming without belief in the norm."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Internalization", "d": ["Conforming out of genuine belief in the norm."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Identification", "d": ["Outwardly conforming to norms to fit into a group."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Compliance", "d": ["Change in behavior based on a direct request from someone without actual authority over you."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Foot-in-the-Door Technique", "d": ["Compliance; ask for something small, then something big when they comply."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Door-in-the-Face Technique", "d": ["Compliance; ask for something big, then ask for something small. Often, the smaller request is the actual goal."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Lowball Technique", "d": ["Compliance; ask for a small commitment, then raise the cost after they’ve agreed."]}, {"ch": 8, "sec": "8.2 Socialization", "term": "That’s-not-All Technique", "d": ["Compliance; offer something, then add an extra bonus before they’ve agreed. But that’s not all!"]}, {"ch": 8, "sec": "8.2 Socialization", "term": "Obedience", "d": ["Change in behavior based on a direct request from someone with authority over you."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Social Cognition", "d": ["Process of how people think about others, and how this translates to behavior."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Attitude", "d": ["Expression of positive or negative feelings about a specific thing. 3 components."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Affective", "d": ["Attitude component; how one feels toward something. I don’t like snakes."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Behavioral", "d": ["Attitude component; how one acts with respect to something. I avoid snakes."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Cognitive", "d": ["Attitude component; how one thinks about something, usually justifying the affective, behavioral components. Snakes are dangerous."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Functional Attitudes Theory", "d": ["Attitudes have 4 functions: knowledge, ego expression, adaptation, ego defense"]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Knowledge Function", "d": ["Functional attitudes; attitudes help organize one’s thoughts, and make behavior more predictable (which might help in a social situation)."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Ego-Defensive", "d": ["Functional attitudes; attitudes protect our self-esteem or justify wrong actions to alleviate the feeling of guilt."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Ego-Expressive", "d": ["Functional attitudes; attitudes help us express our self-identity."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Adaptive", "d": ["Functional attitudes; expressing acceptable attitudes may lead to acceptance."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Learning Theory", "d": ["Attitudes develop through different kinds of learning."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Elaboration Likelihood Model", "d": ["Models on a continuum how people process persuasive information, and how this leads to changes in behavior or attitude."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Central Route Processing", "d": ["Elaboration Likelihood Model; people process persuasive information by focusing deeply on facts and logic."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Central Message Characteristics", "d": ["Core data, logic, quality of an argument."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Central Route to Persuasion", "d": ["Deep thinking about facts usually leads to long-lasting attitude change."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Peripheral Route Processing", "d": ["Elaboration Likelihood Model; people process persuasive information by focusing on superficial details, rather than logic or facts."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Peripheral Message Characteristics", "d": ["Surface cues, speaker’s fame or status, looks."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Peripheral Route to Persuasion", "d": ["Superficial cues usually leads to temporary attitude change."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Social Cognitive Theory", "d": ["People shape their attitudes and behaviors by observing others."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Bandura’s Triadic Reciprocal Causation", "d": ["A student likes psychology (personal), so they sit at the front (behavioral) which leads to more praise from the professor (environmental), making them like psychology more."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Personal Factor", "d": ["Bandura’s Triadic; your thoughts, beliefs, expectations."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Behavioral Factor", "d": ["Bandura’s Triadic; actions you take."]}, {"ch": 8, "sec": "8.3 Attitudes and Behavior", "term": "Environmental Factor", "d": ["Bandura’s Triadic; context, social surroundings, etc."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Social Statuses", "d": ["Perceived societal positions, used to classify people."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Ascribed Status", "d": ["Status involuntarily given or assigned."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Achieved Status", "d": ["Status gained as a result of choice, effort."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Master Status", "d": ["Someone’s primary or main status, most often identifying them."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Status Inconsistency", "d": ["When a person has multiple social statuses, of varying prestige. A doctor working as a clerk."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Role", "d": ["Set of expected beliefs, attitudes, norms attached to a particular social position or status."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Role Performance", "d": ["How a person carries out a role (and its behaviors) in practice."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Role Partner", "d": ["A person someone interacts with while in their role."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Role Set", "d": ["A set of roles associated with a social position or status."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Role Conflict", "d": ["Tension between multiple roles."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Role Strain", "d": ["Tension within a role."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Role Exit", "d": ["Dropping of an identity-important role for a different role."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Group / Social Group", "d": ["2+ people who share similar characteristics + feel unity."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Dyad", "d": ["A group of 2."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Triad", "d": ["A group of 3."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "In-Group", "d": ["A group one identifies with as a member."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Out-Group", "d": ["A group one does not identify with as a member."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Group Conflict", "d": ["Conflict or tension between groups."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Peer Group", "d": ["A group mad
