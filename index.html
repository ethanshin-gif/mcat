<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P/S Flashcards</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--no:#c2410c;--no-bg:#fdeee6;--yes:#15803d;--yes-bg:#e7f5ec;--accent:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececee;--muted:#9a9aa2;--line:#2e2e33;--no:#fb923c;--no-bg:#3a2216;--yes:#4ade80;--yes-bg:#16301f;--accent:#8ea2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:18px;margin:0;white-space:nowrap}
header .row{gap:2px;flex-wrap:nowrap}
@media (max-width:420px){header .link{font-size:14px;padding:4px 3px}h1{font-size:16px}}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.98)}
.link{background:none;border:none;color:var(--accent);padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:6px 10px;border-radius:999px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.stat.no b{color:var(--no)}.stat.yes b{color:var(--yes)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:300px;padding:24px 20px;display:flex;flex-direction:column;cursor:pointer;user-select:none}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.term{font-size:26px;font-weight:650;text-align:center;margin:auto 0;padding:16px 0}
.card.flipped .term{font-size:19px;margin:12px 0 8px;padding:0;text-align:left}
.def{display:none;font-size:17px}
.def p{margin:0 0 8px}
.card.flipped .def{display:block}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:auto}
.card.flipped .hint{display:none}
.tag{font-size:11px;padding:2px 8px;border-radius:999px}
.tag.no{background:var(--no-bg);color:var(--no)}.tag.yes{background:var(--yes-bg);color:var(--yes)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{padding:16px;font-size:17px;font-weight:600;border-radius:14px}
.bno{background:var(--no-bg);color:var(--no);border-color:transparent}
.byes{background:var(--yes-bg);color:var(--yes);border-color:transparent}
.done{text-align:center;padding:48px 16px;color:var(--muted)}
.list{margin-top:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.item summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.item .def{display:block;font-size:15px;margin-top:6px}
.tabs{display:flex;gap:6px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.drop{position:fixed;inset:0;background:rgba(59,91,219,.12);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--accent);z-index:9;pointer-events:none}
body.dragging .drop{display:flex}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="drop">Drop progress file to load</div>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header>
    <h1>P/S Flashcards</h1>
    <div class="row">
      <button class="link" id="saveBtn">Save</button>
      <button class="link" id="loadBtn">Load</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
      <button class="link" id="toggleSetup">Chapters</button>
      <button class="link" id="toggleList">Piles</button>
    </div>
  </header>

  <section id="setup" class="hidden">
    <div class="row"><span class="small">Chapters</span><button class="link" id="all">All</button><button class="link" id="none">None</button></div>
    <div class="chips" id="chips"></div>
  </section>

  <div class="row">
    <select id="mode">
      <option value="todo">New + Don't get it</option>
      <option value="no">Don't get it only</option>
      <option value="new">New only</option>
      <option value="all">Everything</option>
    </select>
    <button id="shuffle">Shuffle</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sNew">0</b>New</div>
    <div class="stat no"><b id="sNo">0</b>Don't get it</div>
    <div class="stat yes"><b id="sYes">0</b>Got it</div>
  </div>

  <section id="study">
    <div class="card" id="card">
      <div class="meta"><span id="where"></span><span id="pos"></span></div>
      <div class="term" id="term"></div>
      <div class="def" id="def"></div>
      <div class="hint">Tap to flip</div>
    </div>
    <div class="actions" id="actions">
      <button class="bno" id="bNo">✗ Don't get it</button>
      <button class="byes" id="bYes">✓ Got it</button>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <button class="link" id="undo">Undo</button>
      <span class="small">Space flip · ← no · → yes</span>
    </div>
  </section>

  <section id="listView" class="hidden">
    <div class="tabs">
      <button class="chip on" data-pile="no">Don't get it</button>
      <button class="chip" data-pile="yes">Got it</button>
      <button class="chip" data-pile="new">New</button>
    </div>
    <div class="list" id="list"></div>
    <p class="row" style="justify-content:center"><button id="reset">Reset selected chapters</button></p>
  </section>
</div>

 ["Temporal lobe, audio processing."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Wernicke’s Area", "d": ["Temporal lobe, speech processing."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Association Area", "d": ["Brain area that integrates inputs from multiple regions for complex tasks."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Projection Area", "d": ["Brain area involved in simpler, motor tasks."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Cerebrum", "d": ["Large upper part of the forebrain, divided into left and right hemisphere. Includes cerebral cortex."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Anterograde Amnesia", "d": ["Inability to make new long term memories."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Retrograde Amnesia", "d": ["Inability to remember old memories."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Contralaterally", "d": ["Right brain communicates with left body. Usually the case."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Ipsilaterally", "d": ["Right brain communicates with right body."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Dominant Hemisphere", "d": ["Cerebrum hemisphere more stimulated during language. Analytical, logic, math, language (Broca/Wernicke’s Area). Usually left."]}, {"ch": 1, "sec": "1.4 Parts of the Forebrain", "term": "Nondominant Hemisphere", "d": ["Cerebrum hemisphere associated with intuition, creativity, music, spatial processing, holistic images. Interprets the emotional tone of language."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Neurotransmitter", "d": ["Chemical used by neurons, to send signals to other neurons."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Agonist", "d": ["Drug that mimics (and thus amplifies) neurotransmitter effects."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Antagonists", "d": ["Drug that blocks neurotransmitter effects."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Acetylcholine (ACh)", "d": ["Neurotransmitter. (PNS) Muscle contraction, Parasympathetic nervous system, (CNS) Attention and arousal, Alzheimers."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Catecholamine", "d": ["Type of monoamine neurotransmitter, involved in emotion."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Monoamine / Biogenic Amine", "d": ["Neurotransmitter type."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Epinephrine (Adrenaline)", "d": ["Catecholamine neurotransmitter; Alertness + Sympathetic nervous system. More widespread, hormone-like."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Norepinephrine (Noradrenaline)", "d": ["Catecholamine neurotransmitter; Alertness + Sympathetic nervous system. More local in scope. (Low) Depression, (High) Anxiety."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Dopamine", "d": ["Catecholamine neurotransmitter; Movement via basal ganglia, schizophrenia, Parkinson’s."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Dopamine Theory of Schizophrenia", "d": ["Too much or too sensitive to dopamine in the brain."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Serotonin", "d": ["Monoamine neurotransmitter; Regulates mood, eating/drinking, sleeping. (Low) Depression, (High) Anxiety."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Gamma-Aminobutyric Acid (GABA)", "d": ["Neurotransmitter that inhibits/stabilizes neural activity. Hyperpolarizes membranes."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Glycine", "d": ["Neurotransmitter and Amino Acid that inhibits/stabilizes neural activity. Hyperpolarizes membranes via Cl– influx into neurons."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Glutamate", "d": ["Neurotransmitter and Amino Acid; excitatory via depolarization of membranes."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Neuromodulator / Neuropeptide", "d": ["Peptides involved in neurotransmission. Slower + longer."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Endorphins", "d": ["Neuromodulator painkillers, opioid-like effects."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Enkephalins", "d": ["Neuromodulator painkillers, opioid-like effects."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Endocrine System", "d": ["Body system that uses hormones, which are slower + longer than neurotransmitters."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Hypophyseal Portal System", "d": ["Connects hypothalamus + pituitary gland, allowing for quick and direct hormonal control."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Posterior Pituitary", "d": ["Forebrain structure connected to hypothalamus; Site of release for hypothalamus hormones ADH + Oxytocin."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Anterior Pituitary", "d": ["Master gland, releases hormones that regulate other endocrine glands."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Adrenal Gland", "d": ["On top of kidneys. Adrenal Medulla + Cortex."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Adrenal Medulla", "d": ["Adrenal gland, releases epinephrine/norepinephrine, sympathetic nervous system."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Adrenal Cortex", "d": ["Adrenal gland, releases corticosteroids (cortisol) and sex hormones (testosterone, estrogen)."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Gonads", "d": ["Sex glands, ovaries + testes. Release sex hormones at high concentrations, inducing libido or aggressive behavior in the case of testosterone."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Libido", "d": ["Lust."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Innate Behavior", "d": ["Genetically programmed behavior."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Learned Behaviors", "d": ["Behavior from experience/environment."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Adaptive Value", "d": ["How much a trait benefits a species by adaptation."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Nature vs Nurture", "d": ["Is behavior more influenced by genetics or environment?"]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Family Studies", "d": ["Study genetically related individuals, nature vs nurture."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Twin Studies", "d": ["Study twins, nature vs nurture."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Monogzygotic (MZ)", "d": ["Identical twins, 100% DNA."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Dizygotic (DZ)", "d": ["Fraternal twins, 50% DNA."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Concordance Rate", "d": ["Rate of twins having the same trait."]}, {"ch": 1, "sec": "1.5 Influences on Behavior", "term": "Adoption Studies", "d": ["Study adopted individuals, nature vs nurture."]}, {"ch": 1, "sec": "1.6 Development", "term": "Critical Periods", "d": ["Children are particularly susceptible to the environment."]}, {"ch": 1, "sec": "1.6 Development", "term": "Neurulation", "d": ["3-4 weeks. Embryonic process forming nervous system.", "• Ectoderm furrows into a neural groove surrounded by 2 neural folds, which are edged by a neural crest.", "• The neural groove closes into the neural tube, with alar plate + basal plate.", "• Neural tube folds on itself to become 3 swellings (prosencephalon, mesencephalon, rhombencephalon).", "• Neural tube folds on itself to become 5 swellings (telencephalon, diencephalon, MESencephalon, METencephalon, MYElencephalon)."]}, {"ch": 1, "sec": "1.6 Development", "term": "Neural Crest", "d": ["Embryonic structure that forms PNS structures."]}, {"ch": 1, "sec": "1.6 Development", "term": "Neural Tube", "d": ["Embryonic structure that forms CNS."]}, {"ch": 1, "sec": "1.6 Development", "term": "Alar Plate", "d": ["Embryonic structure that becomes sensory neurons."]}, {"ch": 1, "sec": "1.6 Development", "term": "Basal Plate", "d": ["Embryonic structure that forms motor neurons."]}, {"ch": 1, "sec": "1.6 Development", "term": "Umbilical Cord", "d": ["Connects fetus to placenta + uterine wall."]}, {"ch": 1, "sec": "1.6 Development", "term": "Placenta", "d": ["Gives food, oxygen, water to the fetus. Takes water, waste away."]}, {"ch": 1, "sec": "1.6 Development", "term": "Thalidomide", "d": ["Drug that led to limb defects."]}, {"ch": 1, "sec": "1.6 Development", "term": "Antiepileptic Medication", "d": ["Drug that leads to neural tube defects, spina bifida + anencephaly."]}, {"ch": 1, "sec": "1.6 Development", "term": "Reflex", "d": ["Behavior in response to stimuli, without higher cognitive process."]}, {"ch": 1, "sec": "1.6 Development", "term": "Primitive Reflex", "d": ["Baby reflex that disappears with age."]}, {"ch": 1, "sec": "1.6 Development", "term": "Rooting Reflex", "d": ["When their cheek is touched, a baby turns their head in that direction."]}, {"ch": 1, "sec": "1.6 Development", "term": "Moro Reflex", "d": ["When their head undergoes abrupt movement, a baby sticks out their arms + cries and slowly retracts their arms."]}, {"ch": 1, "sec": "1.6 Development", "term": "Babinski Reflex", "d": ["When their foot sole is touched, a baby spreads their toes."]}, {"ch": 1, "sec": "1.6 Development", "term": "Grasping Reflex", "d": ["When an object is placed in their hand, a baby grasps it."]}, {"ch": 1, "sec": "1.6 Development", "term": "Gross Motor Skills", "d": ["Motor skills involving large muscle groups and body."]}, {"ch": 1, "sec": "1.6 Development", "term": "Fine Motor Skills", "d": ["Motor skills involving smaller muscles, dexterity."]}, {"ch": 1, "sec": "1.6 Development", "term": "Stranger Anxiety", "d": ["Fear of strangers."]}, {"ch": 1, "sec": "1.6 Development", "term": "Separation Anxiety", "d": ["Fear of separation."]}, {"ch": 1, "sec": "1.6 Development", "term": "Parallel Play", "d": ["Children play near each other, but independently."]}, {"ch": 1, "sec": "1.6 Development", "term": "Developmental Milestones", "d": ["Skills expected to emerge at a certain stage in life. Motor skills progress head → toe and inside → outside. Social skills progress from parents → self → others."]}, {"ch": 1, "sec": "1.6 Development", "term": "Newborn", "d": ["Reflexes"]}, {"ch": 1, "sec": "1.6 Development", "term": "3 Months", "d": ["Lifts Head, Cooing"]}, {"ch": 1, "sec": "1.6 Development", "term": "6 Months", "d": ["Sits, Babbling, Stranger Anxiety"]}, {"ch": 1, "sec": "1.6 Development", "term": "1 Year", "d": ["Walks, First Words, Separation Anxiety, Object Permanence"]}, {"ch": 1, "sec": "1.6 Development", "term": "2 Years", "d": ["Independent Movement, Parallel Play"]}, {"ch": 1, "sec": "1.6 Development", "term": "3 Years", "d": ["Complete Sentences, Gender-stereotyped Play"]}, {"ch": 1, "sec": "1.6 Development", "term": "4 Years", "d": ["Cooperative Play"]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Sensation / Transduction", "d": ["External stimuli converted to electrical signals."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Perception", "d": ["Processing the newly-transduced electrical signals to make sense of it. Begins in the projection area, then association area."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Sensory Receptor", "d": ["Neurons that respond to stimuli, by sending electrical signals to the CNS."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Distal Stimuli", "d": ["Stimuli outside the body."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Proximal Stimuli", "d": ["Sensory-stimulating, typically produced by distal stimuli."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Psychophysics", "d": ["Relationship between physical stimuli + invoked sensation/perception."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Ganglia", "d": ["Clusters of neuron cell bodies outside CNS."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Photoreceptor", "d": ["Light."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Mechanoreceptors", "d": ["Pressure, Movement."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Nociceptors", "d": ["Pain (Somatosensation)"]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Thermoreceptors", "d": ["Temperature (Thermosensation)"]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Osmoreceptors", "d": ["Blood Osmolarity (Homeostasis)"]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Olfactor Receptors", "d": ["Smell"]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Threshold", "d": ["Minimum stimulus amount that creates a difference in perception."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Absolute Threshold", "d": ["Minimum stimulus amount to activate a sensory system. Sensation threshold."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Threshold of Conscious Perception", "d": ["Minimum stimulus amount for conscious perception by the brain. Perception threshold."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Subliminal Perception", "d": ["Perception that occurs when stimulus amount does not reach threshold of conscious perception."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Difference Threshold / Just Noticeable Difference (JND)", "d": ["Minimum change in stimulus amount for the perception of stimuli difference."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Discrimination Testing", "d": ["Test if an observer can detect difference between stimuli."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Weber’s Law", "d": ["JND is proportional to initial stimulus intensity, not constant.", "ΔI = JND, I = Initial Intensity of Stimulus, k = Constant, aka Weber’s Fraction"]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Signal Detection Theory", "d": ["At what point can we detect a signal when uncertainty is involved?"]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Hit", "d": ["A true positive. Yes when there is a signal."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "False Alarm", "d": ["A false positive. Yes when there is no signal."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Correct Rejection", "d": ["A true negative. No when there is no signal."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Miss", "d": ["A false negative. No where there is a signal."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Response Bias", "d": ["Someone tends to answer a certain way, regardless of evidence."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Noise Trials", "d": ["Signal detection test, yes signal."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Catch Trials", "d": ["Signal detection test, no signal."]}, {"ch": 2, "sec": "2.1 Sensation vs Perception", "term": "Adaptations", "d": ["Change in our ability to detect a stimulus. Sensory / physiological component (pupil dilation) + Perceptual / psychological component."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Sclera", "d": ["White part of eye"]}, {"ch": 2, "sec": "2.2 Vision", "term": "Choroid", "d": ["Vascular layer between retina + sclera. Continuous with iris."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Choroidal Vessels", "d": ["Blood vessels supplying the eye, between sclera + retina."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Retina", "d": ["Innermost eye layer, with photoreceptors transducing light into electrical signals (sensation). Part of CNS."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Retinal Vessels", "d": ["Blood vessels supplying the eye, on the retina."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Cornea", "d": ["Dome-like window in front of the eye; main focusing of light."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Anterior Chamber", "d": ["Front eye chamber, in front of the iris."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Posterior Chamber", "d": ["Front eye chamber, between iris + lens."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Iris", "d": ["Colored part of the eye."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Dilator Pupillae", "d": ["Dilates pupils under sympathetic conditions."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Constrictor Pupillae", "d": ["Constricts pupils under parasympathetic conditions."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Ciliary Body", "d": ["Produces aqueous humor, which bathes front eye + drains into Canal of Schlemm. Continuous with iris."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Aqueous Humor", "d": ["Front eye liquid, drains into the Canal of Schlemm."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Canal of Schlemm", "d": ["Drains aqueous humor."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Lens", "d": ["Behind the iris, refracts incoming light for fine-tuning."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Ciliary Muscle", "d": ["Muscle that bends lens via suspensory ligaments. Under parasympathetic control."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Suspensory Ligaments", "d": ["Connect ciliary muscle to lens, facilitating accommodation."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Accommodation", "d": ["Lens shape is changed by ciliary muscle + suspensory ligaments to focus on an image, as distance varies."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Vitreous Humor", "d": ["Eyeball jelly, supporting eye shape + retina."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Duplexity / Duplicity Theory of Vision", "d": ["Retina has 2 kinds of photoreceptors, 1 for light and dark, 1 for color detection."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Cones", "d": ["Photoreceptors used for color + fine details in bright light. 3 kinds of cones (Short/blue, Medium/green, Long/red) stimulated by a corresponding light wavelength. Less sensitive to light, due to wavelength specificity. Less convergence, so more accuracy."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Rods", "d": ["Photoreceptors used for dark vision + raw vision. 1 kind, all with rhodopsin and stimulated by any light wavelength. More sensitive to light, but less detail oriented."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Rhodopsin", "d": ["Pigment in rods."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Macula", "d": ["Central part of the retina. High concentration of cones."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Fovea", "d": ["Central part of the macula. Only cones."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Peripheral Retina", "d": ["Outer part of the retina. High concentration of rods."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Blind Spot", "d": ["Part of the retina where the optic nerve is. No photoreceptors."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Bipolar Cells", "d": ["Neurons, receive signals from photoreceptors, send to ganglion cells."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Ganglion Cells", "d": ["Neurons that receive signals from bipolar cells, send to brain. Axons form optic nerve."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Optic Nerve", "d": ["Axons of ganglion cells."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Amacrine Cell", "d": ["Retina interneurons connecting bipolar cells + ganglion cells laterally."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Horizontal Cell", "d": ["Retina interneurons connecting photoreceptors laterally. Sharpen edges via comparison."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Visual Pathway", "d": ["Anatomical connection between eyes and brain + flow of visual information along this connection.", "• Left half of retinas receives light from the right half of the visual field, and sends signals to the left half of the brain."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Temporal Fiber", "d": ["Optic nerve fibers from the temporal (outer) side of each retina. Do not cross."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Nasal Retina Fiber", "d": ["Optic nerve fibers from the nasal (inner) side of each retina. Cross at the optic chiasm."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Temporal Visual Field", "d": ["Outer visual field. Hits the nasal retinal fibers."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Nasal Visual Field", "d": ["Inner visual field. Hits the temporal retinal fibers."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Optic Chiasm", "d": ["Where nasal retinal fibers cross."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Optic Tracts", "d": ["Reorganized visual pathway after the optic chiasm. From here, signals go to (1) Thalamus, LGN → visual cortex (2) Superior colliculi."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Visual Radiation", "d": ["Nerve pathways connecting thalamus → visual cortex."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Lateral Geniculate Nucleus (LGN)", "d": ["Part of the thalamus that receives signals from retinal fibers. Sends signals to the visual cortex for conscious processing."]}, {"ch": 2, "sec": "2.2 Vision", "term": "LGN Pathway", "d": ["Retina → optic nerve → optic chiasm → optic tract → LGN (thalamus) → visual cortex."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Parallel Processing", "d": ["Brain analyzes multiple pieces of information simultaneously. Speed."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Serial Processing", "d": ["Brain analyzes information sequentially. Accuracy."]}, {"ch": 2, "sec": "2.2 Vision", "term": "(1) Color", "d": ["4 aspects of vision. Cones."]}, {"ch": 2, "sec": "2.2 Vision", "term": "(2) Form", "d": ["4 aspects of vision. Shape and distinctiveness from the background."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Parvocellular Cells", "d": ["Neurons in the LGN pathway, with high spatial (form) resolution, low temporal resolution."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Spatial Resolution", "d": ["Ability to distinguish fine details."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Temporal Resolution", "d": ["Ability to detect change, often movement."]}, {"ch": 2, "sec": "2.2 Vision", "term": "(3) Motion", "d": ["4 aspects of vision."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Magnocellular Cells", "d": ["Neurons in the LGN pathway, with high temporal resolution, low spatial resolution."]}, {"ch": 2, "sec": "2.2 Vision", "term": "(4) Depth Perception", "d": ["4 aspects of vision. 3-dimensional shape and distances."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Binocular Neurons", "d": ["Visual cortex neurons that compare right/left brain hemisphere input differences to process 3D."]}, {"ch": 2, "sec": "2.2 Vision", "term": "Feature Detectors", "d": ["Visual cortex neurons that fire in response to a specific visual feature. Can be packaged into complete perception of an object.", "Photoreceptors → Bipolar Cells → Ganglion Cells (Optic Nerve) → Brain"]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Vestibular Sense", "d": ["Ability to (1) Detect rotational / linear acceleration (2) Process it to inform balance and spatial orientation."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Pinna / Auricle", "d": ["Cartilaginous outer ear."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "External Auditory Canal", "d": ["Outer ear; receives sound waves from pinna, sends to tympanic membrane."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Tympanic Membrane / Eardrum", "d": ["Outer ear; vibrates in response to soundwave intensity. Divides outer ear from middle ear."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Intensity", "d": ["Refers to the power of a wave, related to amplitude (wave height)."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Ossicles", "d": ["3 smallest bones, middle ear. Transmits soundwaves from tympanic membrane → inner ear."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Malleus / Hammer", "d": ["Ossicle attached to tympanic membrane, transmits vibration from eardrum → incus."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Incus / Anvil", "d": ["Ossicle between malleus + stapes."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Stapes / Stirrup", "d": ["Ossicle attached to oval window, transmits vibrations from incus → oval window (inner ear)."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Eustachian Tube", "d": ["Connects middle ear + nasal cavity; pressure equalization."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Bony Labyrinth", "d": ["Inner ear; hollow region of temple bone containing inner ear."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Perilymph", "d": ["Fluid suspending membranous labyrinth in bony labyrinth. Transmits vibrations + cushions inner ear."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Membranous Labyrinth", "d": ["Inner ear; membranous tube collection filled with endolymph. Suspended in the bony labyrinth via perilymph."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Endolymph", "d": ["Potassium-rich fluid inside membranous labyrinth."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Oval Window", "d": ["Inner ear; membrane transmitting vibrations from stapes → cochlea. Bony labyrinth window."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Cochlea", "d": ["Inner ear; spiral-shaped, bony labyrinth organ cavity with hearing receptors. Divided into 3 scalae."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Scalae", "d": ["Subdivision of the cochlea, part of the bony labyrinth."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Organ of Corti", "d": ["Inner ear; thousands of hair cells resting on the basilar membrane, with the tectorial membrane above it. Suspended in endolymph, in the middle scala. Transduces physical movement of hair cells to electrical signal."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Basilar Membrane", "d": ["Membranous labyrinth, underneath the organ of Corti."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Tectorial Membrane", "d": ["Membranous labyrinth, above the organ of Corti."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Round Window", "d": ["Inner ear; membrane that stretches to allow perilymph movement in the cochlea. Bony labyrinth window."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Auditory / Vestibulocochlear Nerve", "d": ["Bundle of neuron axons, carry electrical signals transduced by the organ of Corti’s hair cells → CNS. From here, signals go to (1) Thalamus, MGN → auditory cortex (2) Inferior colliculi (3) Superior Olive."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Vestibule", "d": ["Bony labyrinth part with utricle + saccule, involved linear acceleration related balance."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Utricle", "d": ["Vestibule structure with otolith-covered hair. Linear acceleration related balance."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Saccule", "d": ["Vestibule structure with otolith-covered hair. Linear acceleration related balance."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Otoliths", "d": ["Cover utricle/saccule hair cells and resists linear acceleration, signaling to the brain."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Semicircular Canals", "d": ["Bony labyrinth part; 3 semicircular canals/ducts arranged perpendicularly + ending in ampulla. Involved in rotational acceleration related balance."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Ampulla", "d": ["Swelling at the end of the 3 semicircular ducts, containing hair cells. Endolymph resists rotational acceleration, bending hair cells and signaling to the brain."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Medial Geniculate Nucleus (MGN)", "d": ["Part of the thalamus that receives signals from auditory / vestibulocochlear nerves. Sends them to the auditory cortex for conscious processing."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "MGN Pathway", "d": ["Cochlea / Organ of Corti → auditory nerve → brainstem → MGN (thalamus) → auditory cortex."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Superior Olive", "d": ["Brainstem structure involved in sound localization."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Vestibulo-Ocular Reflex", "d": ["Eyes remain on target when your head moves."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Hair Cells", "d": ["Inner ear; sensory receptors that convert physical movement into electrical signal."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Stereocilia", "d": ["Tiny projections on hair cells. Open ion channels and depolarize when bent."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Place Theory", "d": ["Because of the varying thickness of the basilar membrane, pitch is determined by where the basilar membrane vibrates the most."]}, {"ch": 2, "sec": "2.3 Hearing and Vestibular Sense", "term": "Tonotopic Organization", "d": ["Hair cells are arranged on the basilar membrane, such that hair cell location matches pitch responsiveness. Cochlea base hair cells respond to high pitch, cochlea tip hair cells respond to low pitch."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Nerve", "d": ["Bundle of many neuron axons."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Chemoreceptor", "d": ["Receptors that detect stimuli by binding chemicals."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Olfactory Chemoreceptor", "d": ["Smell receptors."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Olfactory Nerves", "d": ["Nerves that transmit signals from the olfactory chemoreceptors → brain."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Pheromones", "d": ["Secreted chemicals that compel an animal to behave in a certain way."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Olfactory Pathway", "d": ["Nasal passage → Olfactory Epithelium, Olfactory nerves → Olfactory bulb → Olfactory Tract → Brain"]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Taste Buds", "d": ["Taste chemoreceptors, dissolved compounds."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Papillae", "d": ["A group of taste buds on the tongue; bump."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Taste Pathway", "d": ["Taste buds → Brainstem → Taste center → Brain"]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Taste Center", "d": ["Part of thalamus that relays taste information."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Somatosensation", "d": ["Essentially touch. Includes pressure, vibration, pain, temperature. Processed by somatosensory cortex, parietal lobe."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Pacinian Corpuscles", "d": ["Somatosensation receptor, deep pressure + vibration."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Meissner Corpuscles", "d": ["Somatosensation receptor, light touch."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Merkel Cells / Discs", "d": ["Somatosensation receptor, deep pressure + texture."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Ruffining Endings", "d": ["Somatosensation receptor, stretch."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Free Nerve Endings", "d": ["Somatosensation receptor, pain + temperature."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Somatosensory Cortex", "d": ["Parietal lobe, receives and processes sensory signals for touch, pressure, temperature, pain; Neurons are organized by body part. On the postcentral gyrus, behind the central sulcus. Projection area."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "2 Point Threshold", "d": ["Minimum distance between 2 stimulation points on skin to be perceived as 2 distinct stimuli. Depends on nerve density."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Physiological Zero", "d": ["The normal temperature of skin, to which other temperatures are compared."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Gate Theory of Pain", "d": ["Pain signals can be blocked or reduced in the spinal cord before reaching the brain, like a gate. Rubbing a wound may reduce pain signals by replacing them with rubbing signals."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Kinesthetic Sense / Proprioception", "d": ["The ability to discern the body’s spatial position. Important for hand-eye coordination, balance, mobility."]}, {"ch": 2, "sec": "2.4 Other Senses", "term": "Proprioceptors", "d": ["Proprioception receptors, found in muscles or joints."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Bottom-up / Data-driven Processing", "d": ["Object recognition via parallel processing + feature detection. Combine individual components. New things."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Top-down / Conceptually-driven Processing", "d": ["Object recognition via memories + expectations. Familiar things."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Perceptual Organization", "d": ["Ability to create a complete idea by combining bottom-up, top-down, other senses."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Monocular Cues", "d": ["Visual cues that only need 1 eye."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Relative Size", "d": ["Objects appear bigger when closer."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Relative Height", "d": ["Objects appear higher when further ."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Motion Parallax", "d": ["Objects appear to move faster when closer."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Interposition", "d": ["When objects overlap, the one in front is closer."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Shading & Contour", "d": ["Light and shadows estimate object form and depth."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Linear Perspective", "d": ["Parallel lines appear to converge with distance."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Accommodation", "d": ["Eye lens change shape; closer = curve, farther = flat."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Texture Gradient", "d": ["Object texture appears smoother or less detailed with distance."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Binocular Cues", "d": ["Visual cues that require 2 eyes."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Retinal Disparity", "d": ["Images seen by left and right eyes have differences. Depth perception."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Convergence", "d": ["Eyes turn inward to focus on an object. The inward turning angle estimates distance. Depth perception."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Size Constancy", "d": ["Despite relative size changes, the object is the same size."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Shape Constancy", "d": ["Despite orientation changes, the object is the same shape."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Color Constancy", "d": ["Despite lighting changes, the object is the same color."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Gestalt Principles", "d": ["Describe the brain’s tendencies to group and organize sensory information."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Law of Pragnanz", "d": ["Your brain picks the simplest perceptual organization/interpretation of a visual form."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Law of Similarity", "d": ["Similar objects are grouped together by your brain."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Law of Proximity", "d": ["Objects close together are grouped together by your brain."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Law of Continuity / Good Continuation", "d": ["Lines are organized to follow the smoothest path by your brain."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Law of Closure", "d": ["Incomplete objects are completed by the brain."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Subjective Contours", "d": ["Edges or shapes can be perceived despite not being drawn. Negative space."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Law of Common Fate", "d": ["Objects that move together are grouped together by your brain."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Law of Past Experience", "d": ["Your past experiences influence your current perception."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Contextual Effects", "d": ["Context and environment affect your perception."]}, {"ch": 2, "sec": "2.5 Object Recognition", "term": "Symmetry", "d": ["The brain tends to look for symmetry and center points."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Learning", "d": ["The way we acquire new behavior."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Stimulus", "d": ["Anything an organism can respond to."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Habituation", "d": ["A decrease in response due to repeated exposure to a stimulus."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Subthreshold Stimulus", "d": ["Stimulus too weak to get a response."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Dishabituation", "d": ["Recovery in stimulus response, after habituation."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Associative Learning", "d": ["Forming associations between stimuli, or stimuli and response."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Classical Conditioning", "d": ["Form of associative learning that creates associations between unconditioned stimuli + neutral stimuli, creating conditioned stimuli."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Unconditioned Stimulus", "d": ["A stimulus that brings about a reflexive response."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Unconditioned Response", "d": ["A reflexive response to an unconditioned stimulus."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Neutral Stimuli", "d": ["Stimuli that do not bring about a reflexive response."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Conditioned Stimulus", "d": ["A neutral stimulus that brings about a reflexive (conditioned) response due to classical conditioning."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Conditioned Response", "d": ["A reflexive response to a conditioned (neutral) stimulus, due to classical conditioning."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Acquisition", "d": ["Process of using unconditioned stimulus to turn neutral stimulus → conditioned stimulus."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Appetitive Conditioning", "d": ["Classical conditioning involving a pleasant unconditioned stimulus."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Appetitive Stimulus", "d": ["A pleasant unconditioned stimulus."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Extinction", "d": ["Loss of a conditioned response."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Spontaneous Recovery", "d": ["Recovery of a conditioned response after extinction."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Generalization", "d": ["Process where stimuli similar to the conditioned stimulus produce the conditioned response."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Discrimination", "d": ["Organism learns to discriminate between similar stimuli."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Operant Conditioning", "d": ["Associative learning where behaviors have consequences, thus changing the frequency of that behavior."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Law of Effect", "d": ["Behaviors with good consequences will be repeated."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Behaviorism", "d": ["Idea that all behaviors are conditioned."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Reinforcement", "d": ["Operant conditioning that increases frequency of a behavior."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Positive Reinforcement", "d": ["Increase frequency of a behavior by adding something good."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Negative Reinforcement", "d": ["Increase frequency of a behavior by removing something bad."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Escape Learning", "d": ["Negative reinforcement; You experience something bad, so you exhibit the desired behavior to escape the bad stimulus."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Avoidance Learning", "d": ["Negative reinforcement; You anticipate something bad, so you exhibit the desired behavior to escape the bad stimulus."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Primary Reinforcer", "d": ["Naturally rewarding stimulus that can encourage a behavior."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Secondary / Conditioned Reinforcer", "d": ["A stimulus that can become rewarding through association with a primary reinforcer."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Discriminative Stimulus", "d": ["A stimulus that indicates the possibility of reward."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Delayed Reinforcement", "d": ["A reward is given some time after the desired behavior. Less effective than immediate reinforcement."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Punishment", "d": ["Operant conditioning that decreases frequency of a behavior."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Positive Punishment", "d": ["Decrease frequency of a behavior by adding something bad."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Aversive Conditioning", "d": ["Positive punishment."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Negative Punishment", "d": ["Decrease frequency of a behavior by removing something good."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Reinforcement Schedule", "d": ["A pattern that specifies when/how often reinforcement occurs."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Fixed-ratio (FR) Schedule", "d": ["Reinforcement schedule; reinforce a behavior after a specific number of times that behavior is performed."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Variable-ratio (VR) Schedule", "d": ["Reinforcement schedule; reinforce a behavior after a varying number of times that behavior is performed. Average. Fastest and most resistant to extinction."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Fixed-interval (FI) Schedule", "d": ["Reinforcement schedule; reinforce a behavior after a specific amount of time has passed."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Variable-interval (VI) Schedule", "d": ["Reinforcement schedule; reinforce a behavior after a variable amount of time has passed."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Shaping", "d": ["Process of rewarding behaviors that are more and more similar to the desired behavior. Baby steps."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Latent Learning", "d": ["Learning that occurs without reward; behavior is hidden until a reward is introduced."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Preparedness", "d": ["Some animals have a higher biological predisposition to learn associations."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Instinctive Drift", "d": ["An animal drifts back to its instinctual behavior after learning something new/similar."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Observational Learning", "d": ["Learn a new behavior by watching others. Bobo the clown."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Mirror Neurons", "d": ["Frontal, parietal lobe neurons that fire when another being’s visible action matches an action your own brain knows how to perform."]}, {"ch": 3, "sec": "3.1 Learning", "term": "Modeling", "d": ["Observational learning; you see someone do something, and imitate it."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Encoding", "d": ["Memorize new information."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Visual Encoding", "d": ["Encode visuals."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Acoustic Encoding", "d": ["Encode sounds."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Elaborative Encoding", "d": ["Encode something by contextualizing it with what you know."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Semantic Encoding", "d": ["Encode something by understanding its meaning. Strongest."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Automatic Processing", "d": ["Information gained without effort."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Controlled / Effortful Processing", "d": ["Information gained with effort. Studying."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Rehearsal", "d": ["Strengthen encoded information."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Maintenance Rehearsal", "d": ["Repeating information helps keep it in working memory."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Elaborative Rehearsal", "d": ["Consolidate information into long-term memory by connecting it to things you already know."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Self-Reference Effect", "d": ["Encoding is more effective when you connect it to yourself."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Encoding Specificity", "d": ["When current conditions match the conditions in which you learned something, you can recall it better."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Mnemonics", "d": ["A memory aid that helps you remember things."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Method of Loci", "d": ["Mnemonic; associate a list item with a location in a building you know."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Peg-Word System", "d": ["Mnemonic; associate a list item with a peg word, a word permanently linked to a number. Peg word is tree/3, pour milk over a tree."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Chunking / Clustering", "d": ["Mnemonic; group individual list items into related groups."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Sensory Memory", "d": ["Brief storage of raw, sensory information."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Iconic Memory", "d": ["Brief visual sensory information / memory."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Echoic Memory", "d": ["Brief auditory sensory information / memory."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Whole-Report", "d": ["Remember all items from a briefly shown display."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Partial Report", "d": ["Remember some items from a briefly shown display."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Short-Term Memory", "d": ["Temporary conscious memory."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Memory Capacity", "d": ["Short-term memory can hold ~7±2"]}, {"ch": 3, "sec": "3.2 Memory", "term": "Hippocampus and Memory", "d": ["Hippocampus turns Short-term memory → Long-term memory. Super long-term memory is moved to the cerebral cortex."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Working Memory", "d": ["Active “workspace” memory where you hold and use information from short-term and long-term memory."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Long-Term Memory", "d": ["Permanent conscious memory, near limitless."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Implicit / Nondeclarative Memory", "d": ["Long-term memory; skills, habits, conditioned responses. Things we can’t put into words, more unconscious."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Procedural Memory", "d": ["Implicit memory; used for skills like bikes."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Priming", "d": ["Implicit memory; exposure to 1 stimulus makes you recall/respond differently to another stimulus."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Positive Priming", "d": ["Implicit memory; exposure to 1 stimulus makes you recall/respond faster to another stimulus."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Negative Priming", "d": ["Implicit memory; exposure to 1 stimulus makes you recall/respond slower to another stimulus."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Explicit / Declarative Memory", "d": ["Long-term memory; Memories you can put into words, and consciously recall."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Episodic Memory", "d": ["Explicit memory; memories of life experiences."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Semantic Memory", "d": ["Explicit memory; concepts, ideas, general facts we know."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Autobiographical Memory", "d": ["Refers to explicit memories about ourselves, and concepts related to ourselves."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Retrieval", "d": ["Retrieve stored information out of memory. Usually involves priming + retrieval cues."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Recall", "d": ["Retrieval without hints."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Recognition", "d": ["Retrieval with hints, usually easier."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Relearning", "d": ["Learning something you’ve already learned, usually faster."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Spacing Effect", "d": ["Learning works better when it’s spread out. Why cramming is bad."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Semantic Network", "d": ["Mental network that organizes related concepts from semantic memory."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Spreading Activation", "d": ["Activating 1 node of a semantic network unconsciously activates other nodes around it."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Recall / Retrieval Cue", "d": ["Cue that helps trigger retrieval."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Context Effect", "d": ["Retrieval cue; you can retrieve things better in the location you originally learned it."]}, {"ch": 3, "sec": "3.2 Memory", "term": "State-dependent Memory / Effect", "d": ["Retrieval cue; you can retrieve things better when you’re in the same mental state as when you originally learned it."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Source Monitoring", "d": ["During retrieval, you remember a memory’s origin."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Serial-Position Effect", "d": ["Items at the beginning or end of a list are easier to retrieve."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Primacy Effect", "d": ["Items at the beginning of a list are easier to retrieve."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Recency Effect", "d": ["Items at the end of a list are easier to retrieve."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Amnesia", "d": ["Significant loss of memorized information."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Source Amnesia", "d": ["You forget where you learned something."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Alzheimer’s Disease", "d": ["Theorized to involve loss of ACh in hippocampus neurons."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Dementia", "d": ["Loss cognitive function."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Neurofibrillary Tangles", "d": ["Alzheimer’s; protein tangles."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Beta-Amyloid Plaques", "d": ["Alzheimer’s; protein plaques."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Sundowning", "d": ["Increase in Alzheimer’s related dysfunction later in the day."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Korsakoff’s Syndrome", "d": ["Memory loss from thiamine (B1) disease, involving both anterograde + retrograde amnesia."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Confabulation", "d": ["Create vivid, fake memories."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Agnosia", "d": ["Loss of ability to recognize people + objects + sounds."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Decay", "d": ["Natural loss of short-term memories over time."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Retention Function", "d": ["Curve of forgetting, L-shaped. You forget a lot initially, then less."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Interference", "d": ["Retrieval of information is inhibited by similar information."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Proactive Interference", "d": ["Old information interferes with new learning."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Retroactive Interference", "d": ["New information interferes with retrieval of old information."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Aging and Memory", "d": ["Age doesn’t inherently lead to significant memory loss."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Prospective Memory", "d": ["Remembering to do something later. Time-based prospective memory declines with age."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Reproductive Memory", "d": ["Reproduce an event exactly how it happened. Doesn’t happen."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Reconstructive Memory", "d": ["Reconstruct an event using imagination, semantic memory, etc."]}, {"ch": 3, "sec": "3.2 Memory", "term": "False Memory", "d": ["Memory inaccurately reconstructed."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Recovered Memories", "d": ["Repressed memories brought back into the conscious."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Misinformation Effect", "d": ["Your memory becomes less accurate when exposed to misinformation."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Intrusion Errors", "d": ["Your other memories intrude on one of your memories, making a false memory."]}, {"ch": 3, "sec": "3.2 Memory", "term": "Source-monitoring Error", "d": ["You incorrectly identify the source of a memory."]}, {"ch": 3, "sec": "3.3 Neurobiology of Learning and Memory", "term": "Neuroplasticity", "d": ["The brain’s ability to change and reorganize itself, best in kids."]}, {"ch": 3, "sec": "3.3 Neurobiology of Learning and Memory", "term": "Synaptic Cleft", "d": ["Space between a neuron and target cell."]}, {"ch": 3, "sec": "3.3 Neurobiology of Learning and Memory", "term": "Synaptic Pruning", "d": ["The brain removes weak neural connections."]}, {"ch": 3, "sec": "3.3 Neurobiology of Learning and Memory", "term": "Long-term Potentiation", "d": ["The brain strengthens neural connections. Responsible for short-term → long-term memory.", "Sensory Memory (Visual Cortex, etc.) → Short-term, Long-term Memory (Hippocampus) → Long-term Memory (Cerebral Cortex)"]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Cognition", "d": ["Study of how our brains process and react to information."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Dual-Coding Theory", "d": ["Paivio, both verbal association + visual images process and store information."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Information Processing Model", "d": ["• Thinking requires sensation + encoding + storage of stimuli.", "• Stimuli must be analyzed by the brain for decision making.", "• Decisions made in 1 situation can be used + modified to help new problems.", "• Problem solving depends on a problem’s context + complexity, not just cognition."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Cognitive Development", "d": ["Development of your ability to think + solve problems."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Jean Piaget", "d": ["Stages of cognitive development."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Schema", "d": ["Mental framework used to organize information. Ranges from objects, behaviors, sequences, etc."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Adaptation", "d": ["Processing of new information."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Assimilation", "d": ["Process of classifying new info into a schema."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Accommodation", "d": ["Process of changing a schema to accommodate new information."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Sensorimotor Stage", "d": ["0–2 years. Manipulate environment, coordinate sensory + motor. Ends with object permanence."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Circular Reactions", "d": ["• Primary Circular Reactions – Sensoriomotor stage; repetitions of actions focused on the baby’s body, pleasurable or interesting. First occurred by chance.", "• Secondary Circular Reactions – Sensoriomotor stage; Repetitions of actions focused on the environment, produce an interesting effect."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Primary Circular Reactions", "d": ["Sensoriomotor stage; repetitions of actions focused on the baby’s body, pleasurable or interesting. First occurred by chance."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Secondary Circular Reactions", "d": ["Sensoriomotor stage; Repetitions of actions focused on the environment, produce an interesting effect."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Object Permanence", "d": ["Things exist even when not in view. Ends sensorimotor stage."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Representational Thought", "d": ["Baby begins to make mental representations of real things."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Preoperational Stage", "d": ["2–7 years. Symbolic thinking, egocentrism, no conservation."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Symbolic Thinking", "d": ["Ability to pretend, make-believe, imagination."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Egocentrism", "d": ["Inability to imagine what someone else thinks or feels."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Conservation", "d": ["An amount is the same regardless of shape or appearance."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Centration", "d": ["Tendency to hyperfocus on one aspect of something."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Concrete Operational Stage", "d": ["7–11 years. Conservation, basic logic, no egocentrism, no abstract."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Formal Operational Stage", "d": ["11 years. Abstract thought, hypothetical reasoning."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Hypothetical Reasoning", "d": ["Ability to think of what if’s, not just what’s directly available."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Lev Vygotsky", "d": ["Cognitive development is influenced by culture + social interaction."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Zone of Proximal Development", "d": ["Vygotsky; what a child can do with help, but not alone."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Scaffolding", "d": ["Vygotsky; temporary support that helps a child learn."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Fluid Intelligence", "d": ["Ability to solve new or unfamiliar problems. Declines with age."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Crystallized Intelligence", "d": ["Ability to solve familiar problems using acquired knowledge."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Activities of Daily Living", "d": ["Eating, bathing, etc."]}, {"ch": 4, "sec": "4.1 Cognition", "term": "Delirium", "d": ["Temporary, reversible change in cognitive function, usually caused by medical problems."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Mental Set", "d": ["Tendency to approach similar problems in the same way."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Functional Fixedness", "d": ["Inability to consider using an object in a non-traditional way."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Trial-and-Error", "d": ["Try many solutions until one works."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Algorithm", "d": ["Formula used to solve a problem."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Deductive / Top-down Reasoning", "d": ["Use general rules and apply it to a specific example."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Inductive / Bottom-up Reasoning", "d": ["Use specific examples to build a general rule."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Heuristics", "d": ["Simplified rules used to make decisions. Rule of thumb."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Availability Heuristic", "d": ["Judge the likelihood of an event, by how easily we can recall instances of that event."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Representativeness Heuristic", "d": ["Judge the likelihood of an event, by comparing it to a generalization. Essentially stereotyping."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Base Rate Fallacy", "d": ["Using generalizations instead of actual numerical information."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Disconfirmation Principle", "d": ["If evidence does not support a solution/hypothesis, it is disconfirmed, and therefore should be discarded."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Confirmation Bias", "d": ["Tendency to focus more on information that supports one’s beliefs."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Belief Perseverance", "d": ["Inability to reject a belief, despite clear evidence against it."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Hindsight Bias", "d": ["Tendency to underestimate something once you know its solution or fate."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Intuition", "d": ["Quick judgement through unconscious pattern recognition rather than conscious reasoning."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Recognition-primed Decision Model", "d": ["Use of experience + unconscious pattern recognition to make decisions. Under this model, intuition is a component in familiar situations."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Emotion", "d": ["Subjective experience during a specific situation."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Multiple Intelligence Theory", "d": ["Intelligence is defined not as one ability, but many unique abilities. Howard Gardner.", "• Linguistic Intelligence", "• Logical-Mathematical Intelligence", "• Visual-Spatial Intelligence", "• Bodily-Kinesthetic Intelligence"]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Interpersonal Intelligence", "d": ["Ability to detect + navigate moods of others."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Intrapersonal Intelligence", "d": ["Ability to detect + navigate your own mood."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Naturalist Intelligence", "d": ["Nature intelligence."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Triarchic Theory of Human Intelligence", "d": ["3 kinds of intelligence. Robert Sternberg."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Analytical Intelligence", "d": ["Ability to analyze and reason."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Creative Intelligence", "d": ["Unfamiliar problem solving ability, creativity."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Practical Intelligence", "d": ["Familiar, everyday problem solving ability."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Theory of Emotional Intelligence", "d": ["Describes emotional awareness. Empathy.", "• Ability to express + perceive emotions.", "• Ability to comprehend + analyze emotions.", "• Ability to control emotions.", "• Ability to apply emotions."]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Intelligence Quotient (IQ)", "d": ["( Mental age / Chronological age) x 100"]}, {"ch": 4, "sec": "4.2 Problem Solving, Decision Making", "term": "Stanford-Binet IQ Test", "d": ["Stanford professor used Alfred Binet’s work to make a test."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Consciousness", "d": ["Awareness of the world, and your existence in that world."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Alertness", "d": ["State of consciousness; awake and able to think."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Physiological Arousal", "d": ["State characterized by physiological reactions like increased HR, BR, BP, etc."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Reticular Formation", "d": ["Brainstem structure that keeps the cerebral cortex awake."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Beta Waves", "d": ["High frequency brain waves, when awake + concentrating or alert."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Alpha Waves", "d": ["Lower frequency than beta waves, when awake + relaxed."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Stage 1 / NREM1", "d": ["Lightest sleep, right as you doze off. Theta waves. Easy to wake. Hypnagogic hallucinations + hypnic jerks happen here."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Theta Waves", "d": ["Irregular brain waves with low frequency. NREM1."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Stage 2 / NREM2", "d": ["Deeper sleep. Most total time spent here. Theta waves + sleep spindles + K complexes."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Sleep Spindles", "d": ["Bursts of high frequency waves. NREM2."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "K Complexes", "d": ["Singular high amplitude waves. NREM2."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Stage 3 / NREM3 / Slow-Wave Sleep", "d": ["Deepest sleep, with cognitive recovery and GH release. Hard to rouse. Delta waves. Sleepwalking, night terrors, bedwetting happen here."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Delta Waves", "d": ["Very low-frequency brain waves. NREM3."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Non-Rapid Eye Movement (NREM) Sleep", "d": ["NREM1, NREM2, NREM3 (= N1, N2, N3). Old system had 4 stages; now 3.", "Cycle: N1 → N2 → N3 → N2 → REM, ~90 min. Later in the night N3 shrinks and REM gets longer."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Rapid Eye Movement (REM) Sleep / Paradoxical Sleep", "d": ["Kind of sleep, with mimicked physiological arousal + muscle paralysis. Dreams occur in REM."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Sleep Cycle", "d": ["1 complete progression through the sleep stages. Longer in adults.", "• 1 → 2 → 3 → 4 → REM → (repeat), with REM getting longer and longer."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Circadian Rhythms", "d": ["~24 hour cycle that controls waking + sleeping. Affected by light. Pineal gland, melatonin."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Melatonin and Sleep", "d": ["Circadian Rhythm; melatonin levels are higher in the evening when light decreases, and helps us feel sleepy."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Cortisol and Sleep", "d": ["Circadian Rhythm; cortisol levels are higher when we are awake, and helps us feel awake."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Corticotropin-releasing Factor (CRF)", "d": ["Released from hypothalamus in response to increasing light."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Adrenocorticotropic Hormone (ACTH)", "d": ["Released from anterior pituitary in response to CRF. Stimulates cortisol release."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Activation-Synthesis Theory", "d": ["Theorizes dreams are caused by widespread, random neural activity."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Problem Solving Dream Theory", "d": ["Theorizes dreams help people solve problems."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Cognitive Process Dream Theory", "d": ["Theorizes dreams are a natural continuation of regular thinking, but during sleep."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Neurocognitive Models of Dreaming", "d": ["Theorizes that dreams are normal brain activity during sleep. Combines physiology + psychology."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Dyssomnia", "d": ["General disorders that make it hard to sleep. Usually during NREM sleep."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Insomnia", "d": ["Hard to fall asleep or stay asleep."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Narcolepsy", "d": ["Can’t control when you fall asleep, sleep attacks."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Cataplexy", "d": ["REM-like loss of muscle control, during waking hours. Emotional onset."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Sleep Paralysis", "d": ["Inability to move when awake."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Hypnagogic Hallucination", "d": ["Hallucinations when going to sleep."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Hypnopompic Hallucination", "d": ["Hallucinations when waking up."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Sleep Apnea", "d": ["Breathing difficulties during sleep."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Parasomnias", "d": ["Disorder involving weird movement or behavior during sleep. Usually during NREM sleep."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Night Terrors", "d": ["Thrashing or anxiety during NREM / Slow Wave Sleep. Hard to wake."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Sleep Walking / Sommambulism", "d": ["Walking or actions during NREM / Slow Wave Sleep."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Hypnosis", "d": ["A state where someone has control over their body, but listens to suggestions."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Hypnotic Induction", "d": ["Induction into hypnosis."]}, {"ch": 4, "sec": "4.3 Consciousness", "term": "Meditation", "d": ["Quieting of mind for some purpose. Can decrease stress, HR, BP. Resembles Stage 1 / NREM1 sleep, with theta + slow alpha waves."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Depressants", "d": ["Downers. Reduce nervous system activity. Alcohol, sedatives.", "• GABA is the main inhibitory neurotransmitter. Cl– hyperpolarization."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Alcohol", "d": ["Depressant. Increases GABA receptors to cause hyperpolarizations, resulting in diminished arousal + disinhibition + euphoria."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Alcohol Myopia", "d": ["Alcohol-induced inability to recognize consequences of actions."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Wernicke-Korsakoff Syndrome", "d": ["Thiamine (B1) deficiency caused by alcoholism. Memory impairment + loss of motor skills + mental status changes."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Sedatives", "d": ["Depressants of CNS. Calm, relaxation. Increase GABA receptor activity."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Barbiturates", "d": ["Old anxiety-reducing sedative, more prone to overdose."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Benzodiazepines", "d": ["New anxiety-reducing sedative, less prone to overdose."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Stimulants", "d": ["Uppers. Increase nervous system activity."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Amphetamine", "d": ["Stimulant that increases dopamine, norepinephrine, serotonin release."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Cocaine", "d": ["Stimulant that decreases dopamine, norepinephrine, serotonin reuptake. Used for anesthesia + vasoconstriction in surgery."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Crack", "d": ["Cocaine that can be smoked."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Ecstasy / MDMA", "d": ["Hallucinogen + Amphetamine (Stimulant). Uppers."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Opium", "d": ["Painkiller downer drug, acting as endorphin agonists on PNS/CNS opioid receptors."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Opiates", "d": ["Natural opium. Morphine, Codeine."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Opioids", "d": ["Opiate derivatives, maybe synthetic. Oxycodone, Hydrocodone, Heroin."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering Drugs", "term": "Heroin", "d": ["Opioid that gets metabolized into morphine."]}, {"ch": 4, "sec": "4.4 Consciousness-Altering D
