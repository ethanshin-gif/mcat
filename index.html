<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P/S Flashcards</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--no:#c2410c;--no-bg:#fdeee6;--yes:#15803d;--yes-bg:#e7f5ec;--accent:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececee;--muted:#9a9aa2;--line:#2e2e33;--no:#fb923c;--no-bg:#3a2216;--yes:#4ade80;--yes-bg:#16301f;--accent:#8ea2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:18px;margin:0;white-space:nowrap}
header .row{gap:2px;flex-wrap:nowrap}
@media (max-width:420px){header .link{font-size:14px;padding:4px 3px}h1{font-size:16px}}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.98)}
.link{background:none;border:none;color:var(--accent);padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:6px 10px;border-radius:999px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters #chSel,.filters #grpSel,.filters #shuffle{grid-column:1/-1}
.grp{font-size:13px;font-weight:600;color:var(--accent);margin-top:10px}
.card.flipped .grp{margin-top:12px}
.card:not(.flipped) .grp{text-align:center;margin-bottom:-28px;margin-top:auto}
.filters select,.filters button{width:100%;min-width:0}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.stat.no b{color:var(--no)}.stat.yes b{color:var(--yes)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:300px;padding:24px 20px;display:flex;flex-direction:column;cursor:pointer;user-select:none}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.term{font-size:26px;font-weight:650;text-align:center;margin:auto 0;padding:16px 0}
.card.flipped .term{font-size:19px;margin:12px 0 8px;padding:0;text-align:left}
.def{display:none;font-size:17px}
.def p{margin:0 0 8px}
.def p.sub,.gd p.sub,.mapinfo p.sub{margin-left:18px;font-size:.93em;opacity:.9}
.card.flipped .def{display:block}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:auto}
.card.flipped .hint{display:none}
.tag{font-size:11px;padding:2px 8px;border-radius:999px}
.tag.lo{background:var(--line);color:var(--muted)}
.tag.no{background:var(--no-bg);color:var(--no)}.tag.yes{background:var(--yes-bg);color:var(--yes)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{padding:16px;font-size:17px;font-weight:600;border-radius:14px}
.bno{background:var(--no-bg);color:var(--no);border-color:transparent}
.byes{background:var(--yes-bg);color:var(--yes);border-color:transparent}
.done{text-align:center;padding:48px 16px;color:var(--muted)}
.list{margin-top:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.item summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.item .def{display:block;font-size:15px;margin-top:6px}
.tabs{display:flex;gap:6px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.nav button{border:none;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drillbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:10px;font-weight:600;font-size:14px}
.mapbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mapbar select,.mapbar input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.mapwrap{position:relative;height:calc(100vh - 210px);min-height:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
#map{display:block;width:100%;height:100%;cursor:grab}
#map.dragging{cursor:grabbing}
.mapempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
.mapzoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.mapzoom button{width:36px;height:36px;padding:0;font-size:18px;border-radius:10px}
.mapinfo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:15px}
.mapinfo h3{margin:0 0 6px;font-size:17px}
.mapinfo p{margin:0 0 4px}
.mapinfo .nb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gtitle{font-size:22px;margin:4px 0 2px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.danger{color:var(--no)}
.topic{margin:20px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:10px 0}
.g.editing{border-color:var(--accent)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.gh h3{margin:0;font-size:17px}
.gh .link{font-size:14px;font-weight:600}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.tt{font-size:15px;padding:6px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tt.lo{color:var(--muted)}
.tt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tt.plain{cursor:default;border-style:dashed}
.gd{font-size:15px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.gd b{display:block;margin-bottom:4px}
.gd p{margin:0 0 4px}
.ef{display:grid;gap:8px;margin-bottom:10px}
.ef label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.g input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.eitems{margin-bottom:8px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:none}
.ib{padding:4px 9px;border-radius:8px;font-size:14px}
.ib.x{color:var(--no)}
.results{margin-top:4px}
.res{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin-top:4px;border-radius:10px}
.ebar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.drop{position:fixed;inset:0;background:rgba(59,91,219,.12);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--accent);z-index:9;pointer-events:none}
body.dragging .drop{display:flex}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="drop">Drop progress file to load</div>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header>
    <h1>P/S Flashcards</h1>
    <div class="row">
      <button class="link" id="saveBtn">Save</button>
      <button class="link" id="loadBtn">Load</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </header>

  <nav class="nav">
    <button class="on" data-tab="study">Study</button>
    <button data-tab="listView">Piles</button>
    <button data-tab="guideView">Guides</button>
    <button data-tab="mapView">Map</button>
  </nav>

  <div id="drillBar" class="drillbar hidden"><span id="drillName"></span><button class="link" id="drillExit">Exit</button></div>

  <div id="controls">

  <div class="filters">
    <select id="chSel"></select>
    <select id="grpSel"></select>
    <select id="yield">
      <option value="all">All yield</option>
      <option value="hi">High yield only</option>
      <option value="lo">Low yield only</option>
    </select>
    <select id="mode">
      <option value="todo">New + Don't get it</option>
      <option value="no">Don't get it only</option>
      <option value="new">New only</option>
      <option value="all">Everything</option>
    </select>
    <button id="shuffle">Shuffle</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sNew">0</b>New</div>
    <div class="stat no"><b id="sNo">0</b>Don't get it</div>
    <div class="stat yes"><b id="sYes">0</b>Got it</div>
  </div>
  </div>

  <section id="study">
    <div class="card" id="card">
      <div class="meta"><span id="where"></span><span id="pos"></span></div>
      <div class="grp" id="grp"></div><div class="term" id="term"></div>
      <div class="def" id="def"></div>
      <div class="hint">Tap to flip</div>
    </div>
    <div class="actions" id="actions">
      <button class="bno" id="bNo">✗ Don't get it</button>
      <button class="byes" id="bYes">✓ Got it</button>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <button class="link" id="undo">Undo</button>
      <span class="small">Space flip · ← no · → yes</span>
    </div>
  </section>

  <section id="listView" class="hidden">
    <div class="tabs">
      <button class="chip on" data-pile="no">Don't get it</button>
      <button class="chip" data-pile="yes">Got it</button>
      <button class="chip" data-pile="new">New</button>
    </div>
    <div class="list" id="list"></div>
    <p class="row" style="justify-content:center"><button id="reset">Reset this selection</button></p>
  </section>
  <section id="guideView" class="hidden">
    <div class="ghead">
      <h2 class="gtitle">Study Guide</h2>
      <button id="newGroup" class="primary">+ New group</button>
    </div>
    <p class="small">Tap a term to see your definition. Gray = low yield.</p>
    <div id="guideBody"></div>
  </section>

  <section id="mapView" class="hidden">
    <div class="mapbar">
      <select id="mapTopic"></select>
      <input id="mapFind" placeholder="Find a term…" autocomplete="off" list="mapNames">
      <datalist id="mapNames"></datalist>
    </div>
    <div class="mapwrap" id="mapWrap">
      <canvas id="map"></canvas>
      <div class="mapempty hidden" id="mapEmpty">Make some groups in <b>Guides</b> and they'll show up here.</div>
      <div class="mapzoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit">⤢</button></div>
    </div>
    <div class="mapinfo hidden" id="mapInfo"></div>
  </section>
</div>

<script>
const DATA = {"chapters":[{"ch":1,"title":"Biology and Behavior"},{"ch":2,"title":"Sensation and Perception"},{"ch":3,"title":"Learning and Memory"},{"ch":4,"title":"Cognition Consciousness and Language"},{"ch":5,"title":"Motivation Emotion Stress"},{"ch":6,"title":"Identity and Personality"},{"ch":7,"title":"Psychological Disorders"},{"ch":8,"title":"Social Processes Attitudes Behavior"},{"ch":9,"title":"Social Interaction"},{"ch":10,"title":"Social Thinking"},{"ch":11,"title":"Social Structure and Demographics"},{"ch":12,"title":"Social Stratification"}],"cards":[{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Franz Gall","d":["Phrenology, wrong, bulge."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Phrenology","d":["Developing a trait makes the corresponding brain section bigger."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Pierre Flourens","d":["Studied functions of major brain regions via extirpation / ablation."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Extirpation / Ablation","d":["Remove part of the brain to see the result."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"William James","d":["American psychology founder. Functionalism."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"John Dewey","d":["Article about Functionalism. Study the whole instead of parts."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Functionalism","d":["How mental processes help people adapt to the environment. Their function."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Paul Broca","d":["Studied behavior deficiencies of people with brain damage; Matched function with brain region. Speech deficiency, left brain."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Hermann von Helmholtz","d":["Studied nerve impulse speed; Bridged psychology + physiology."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Sir Charles Sherrington","d":["Theorized synapses. Incorrectly thought they were electrical instead of chemical."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"3 Nerve Cells","d":["Sensory neurons, Motor neurons, Interneurons","• Sensory / Afferent Neurons","• Motor / Efferent Neurons","• Interneurons"],"lo":0,"gs":["3 Nerve Cells"]},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Sensory / Afferent Neurons","d":["Receptors to CNS."],"lo":0,"g":"3 Nerve Cells","gs":["3 Nerve Cells"]},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Motor / Efferent Neurons","d":["CNS to muscles + glands."],"lo":0,"g":"3 Nerve Cells","gs":["3 Nerve Cells"]},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Interneurons","d":["In CNS, connect neurons to each other. Most numerous. Reflexive behavior."],"lo":0,"g":"3 Nerve Cells","gs":["3 Nerve Cells"]},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Reflex Arcs","d":["Neural circuit controlling reflexive behavior. Bypass conscious processing."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Central Nervous System (CNS)","d":["Brain + Spinal Cord."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Peripheral Nervous System (PNS)","d":["Nerves outside the CNS."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Spinal Nerves","d":["31 pairs of nerves exiting the spinal cord."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Cranial Nerves","d":["12 pairs of nerves exiting the brain."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Olfactory Nerve","d":["Cranial nerve 1. PNS."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Optic Nerve","d":["Cranial nerve 2. PNS."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Somatic Nervous System","d":["Sensory + Motor neurons in the skin, joints, muscles."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Motor Impulse","d":["CNS to skeletal muscle via efferent neurons."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Autonomic Nervous System (ANS)","d":["Heartbeat, respiration, digestion, gland secretions, sweating. Involuntary muscles."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Parasympathetic Nervous System","d":["Resting and digestion, acetylcholine (ACh). Decreases HR. Constricts pupils, bronchi. Inhibits release of glucose, epinephrine. Stimulates saliva, bile, peristalsis."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Peristalsis","d":["Muscle contraction that moves stuff through your digestive tract."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Sympathetic Nervous System","d":["Fight or flight, stress. Increases HR. Dilates pupils, bronchi. Stimulates release of glucose, epinephrine. Decreases digestion, peristalsis."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Meninges","d":["3 layer sheath of tissue covering the brain. Reabsorb CSF.","• Dura Mater","• Arachnoid Mater","• Pia Mater"],"lo":0,"gs":["Meninges"]},{"ch":1,"sec":"1.3 Organization of the brain","term":"Dura Mater","d":["Outermost layer of meninges; Connected to skull."],"lo":1,"g":"Meninges","gs":["Meninges"]},{"ch":1,"sec":"1.3 Organization of the brain","term":"Arachnoid Mater","d":["Middle, web-like layer of meninges."],"lo":1,"g":"Meninges","gs":["Meninges"]},{"ch":1,"sec":"1.3 Organization of the brain","term":"Pia Mater","d":["Innermost layer of meninges; Connected to brain."],"lo":1,"g":"Meninges","gs":["Meninges"]},{"ch":1,"sec":"1.3 Organization of the brain","term":"Cerebrospinal Fluid","d":["Nourishes and cushions CNS. Produced by cells lining the ventricles of the brain."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Hindbrain / Rhombencephalon","d":["Lower brain, regulates basic survival. Divides into myelencephalon + metencephalon."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Myelencephalon","d":["Becomes medulla oblongata."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Metencephalon","d":["Becomes pons + cerebellum."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Medulla Oblongata","d":["Hindbrain structure regulating breathing, HR, digestion."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Pons","d":["Hindbrain structure regulating breathing; Connects brain regions."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Cerebellum","d":["Hindbrain structure maintaining posture, balance, coordination. Drunk."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Reticular Formation","d":["Brain structure for alertness and arousal."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Midbrain / Mesencephalon","d":["Middle brain, sight/hearing reflexes. Receives and sends this reflexive info."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Colliculi","d":["Prominent part of midbrain. Super + Inferior.","• Superior Colliculus","• Inferior Colliculus"],"lo":1,"gs":["Colliculi"]},{"ch":1,"sec":"1.3 Organization of the brain","term":"Superior Colliculus","d":["Receives visual input. Sight reflexes."],"lo":1,"g":"Colliculi","gs":["Colliculi"]},{"ch":1,"sec":"1.3 Organization of the brain","term":"Inferior Colliculus","d":["Receives audio input. Hearing reflexes."],"lo":1,"g":"Colliculi","gs":["Colliculi"]},{"ch":1,"sec":"1.3 Organization of the brain","term":"Forebrain / Prosencephalon","d":["Upper brain, complex functions. Divides into telencephalon + diencephalon."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Telencephalon","d":["Becomes cerebral co ve. Yes when there is a signal."],"lo":0,"g":"Signal Detection Theory","gs":["Signal Detection Theory"]},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"False Alarm","d":["A false positive. Yes when there is no signal."],"lo":0,"g":"Signal Detection Theory","gs":["Signal Detection Theory"]},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Correct Rejection","d":["A true negative. No when there is no signal."],"lo":0,"g":"Signal Detection Theory","gs":["Signal Detection Theory"]},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Miss","d":["A false negative. No where there is a signal."],"lo":0,"g":"Signal Detection Theory","gs":["Signal Detection Theory"]},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Response Bias","d":["Someone tends to answer a certain way, regardless of evidence."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Noise Trials","d":["Signal detection test, yes signal."],"lo":1},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Catch Trials","d":["Signal detection test, no signal."],"lo":1},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Adaptations","d":["Change in our ability to detect a stimulus. Sensory / physiological component (pupil dilation) + Perceptual / psychological component."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Sclera","d":["White part of eye"],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Choroid","d":["Vascular layer between retina + sclera. Continuous with iris."],"lo":1,"gs":["Choroid"]},{"ch":2,"sec":"2.2 Vision","term":"Choroidal Vessels","d":["Blood vessels supplying the eye, between sclera + retina."],"lo":1,"g":"Choroid","gs":["Choroid"]},{"ch":2,"sec":"2.2 Vision","term":"Retina","d":["Innermost eye layer, with photoreceptors transducing light into electrical signals (sensation). Part of CNS."],"lo":0,"gs":["Retina"]},{"ch":2,"sec":"2.2 Vision","term":"Retinal Vessels","d":["Blood vessels supplying the eye, on the retina."],"lo":1,"g":"Retina","gs":["Retina"]},{"ch":2,"sec":"2.2 Vision", plexity / Duplicity Theory of Vision"]},{"ch":2,"sec":"2.2 Vision","term":"Cones","d":["Photoreceptors used for color + fine details in bright light. 3 kinds of cones (Short/blue, Medium/green, Long/red) stimulated by a corresponding light wavelength. Less sensitive to light, due to wavelength specificity. Less convergence, so more accuracy."],"lo":0,"g":"Duplexity / Duplicity Theory of Vision","gs":["Duplexity / Duplicity Theory of Vision"]},{"ch":2,"sec":"2.2 Vision","term":"Rods","d":["Photoreceptors used for dark vision + raw vision. 1 kind, all with rhodopsin and stimulated by any light wavelength. More sensitive to light, but less detail oriented."],"lo":0,"g":"Duplexity / Duplicity Theory of Vision","gs":["Duplexity / Duplicity Theory of Vision"]},{"ch":2,"sec":"2.2 Vision","term":"Rhodopsin","d":["Pigment in rods."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Macula","d":["Central part of the retina. High concentration of cones."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Fovea","d":["Central part of the macula. Only cones."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Peripheral Retina","d":["Outer part of the retina. High concentration of rods."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Blind Spot","d":["Part of the retina where the optic nerve is. No photoreceptors."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Bipolar Cells","d":["Neurons, receive signals from photoreceptors, send to ganglion cells."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Ganglion Cells","d":["Neurons that receive signals from bipolar cells, send to brain. Axons form optic nerve."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Optic Nerve","d":["Axons of ganglion cells."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Amacrine Cell","d":["Retina interneurons connecting bipolar cells + ganglion cells laterally."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Horizontal Cell","d":["Retina interneurons connecting photoreceptors laterally. Sharpen edges via comparison."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Visual Pathway","d":["Anatomical connection between eyes and brain + flow of visual information along this connection.","• Left half of retinas receives light from the right half of the visual field, and sends signals to the left half of the brain."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Temporal Fiber","d":["Optic nerve fibers from the temporal (outer) side of each retina. Do not cross."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Nasal Retina Fiber","d":["Optic nerve fibers from the nasal (inner) side of each retina. Cross at the optic chiasm."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Temporal Visual Field","d":["Outer visual field. Hits the nasal retinal fibers."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Nasal Visual Field","d":["Inner visual field. Hits the temporal retinal fibers."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Optic Chiasm","d":["Where nasal retinal fibers cross."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Optic Tracts","d":["Reorganized visual pathway after the optic chiasm. From here, signals go to (1) Thalamus, LGN → visual cortex (2) Superior colliculi."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Visual Radiation","d":["Nerve pathways connecting thalamus → visual cortex."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Lateral Geniculate Nucleus (LGN)","d":["Part of the thalamus that receives signals from retinal fibers. Sends signals to the visual cortex for conscious processing."],"lo":0,"gs":["Lateral Geniculate Nucleus (LGN)"]},{"ch":2,"sec":"2.2 Vision","term":"LGN Pathway","d":["Retina → optic nerve → optic chiasm → optic tract → LGN (thalamus) → visual cortex."],"lo":0,"g":"Lateral Geniculate Nucleus (LGN)","gs":["Lateral Geniculate Nucleus (LGN)"]},{"ch":2,"sec":"2.2 Vision","term":"Parallel Processing","d":["Brain analyzes multiple pieces of information simultaneously. Speed."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Serial Processing","d":["Brain analyzes information sequentially. Accuracy."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"(1) Color","d":["4 aspects of vision. Cones."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"(2) Form","d":["4 aspects of vision. Shape and distinctiveness from the background."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Parvocellular Cells","d":["Neurons in the LGN pathway, with high spatial (form) resolution, low temporal resolution."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Spatial Resolution","d":["Ability to distinguish fine details."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Temporal Resolution","d":["Ability to detect change, often movement."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"(3) Motion","d":["4 aspects of vision."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Magnocellular Cells","d":["Neurons in the LGN pathway, with high temporal resolution, low spatial resolution."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"(4) Depth Perception","d":["4 aspects of vision. 3-dimensional shape and distances."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Binocular Neurons","d":["Visual cortex neurons that compare right/left brain hemisphere input differences to process 3D."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Feature Detectors","d":["Visual cortex neurons that fire in response to a specific visual feature. Can be packaged into complete perception of an object.","Photoreceptors → Bipolar Cells → Ganglion Cells (Optic Nerve) → Brain"],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Vestibular Sense","d":["Ability to (1) Detect rotational / linear acceleration (2) Process it to inform balance and spatial orientation."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Pinna / Auricle","d":["Cartilaginous outer ear."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"External Auditory Canal","d":["Outer ear; receives sound waves from pinna, sends to tympanic membrane."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Tympanic Membrane / Eardrum","d":["Outer ear; vibrates in response to soundwave intensity. Divides outer ear from middle ear."],"lo":0,"gs":["Tympanic Membrane / Eardrum"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Intensity","d":["Refers to the power of a wave, related to amplitude (wave height)."],"lo":0,"g":"Tympanic Membrane / Eardrum","gs":["Tympanic Membrane / Eardrum"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Ossicles","d":["3 smallest bones, middle ear. Transmits soundwaves from tympanic membrane → inner ear.","• Malleus / Hammer","• Incus / Anvil","• Stapes / Stirrup"],"lo":0,"gs":["Ossicles"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Malleus / Hammer","d":["Ossicle attached to tympanic membrane, transmits vibration from eardrum → incus."],"lo":1,"g":"Ossicles","gs":["Ossicles"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Incus / Anvil","d":["Ossicle between malleus + stapes."],"lo":1,"g":"Ossicles","gs":["Ossicles"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Stapes / Stirrup","d":["Ossicle attached to oval window, transmits vibrations from incus → oval window (inner ear)."],"lo":1,"g":"Ossicles","gs":["Ossicles"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Eustachian Tube","d":["Connects middle ear + nasal cavity; pressure equalization."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Bony Labyrinth","d":["Inner ear; hollow region of temple bone containing inner ear."],"lo":1,"gs":["Bony Labyrinth"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Perilymph","d":["Fluid suspending membranous labyrinth in bony labyrinth. Transmits vibrations + cushions inner ear."],"lo":1,"g":"Bony Labyrinth","gs":["Bony Labyrinth"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Membranous Labyrinth","d":["Inner ear; membranous tube collection filled with endolymph. Suspended in the bony labyrinth via perilymph."],"lo":1,"gs":["Membranous Labyrinth"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Endolymph","d":["Potassium-rich fluid inside membranous labyrinth."],"lo":1,"g":"Membranous Labyrinth","gs":["Membranous Labyrinth"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Oval Window","d":["Inner ear; membrane transmitting vibrations from stapes → cochlea. Bony labyrinth window."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Cochlea","d":["Inner ear; spiral-shaped, bony labyrinth organ cavity with hearing receptors. Divided into 3 scalae."],"lo":0,"gs":["Cochlea"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Scalae","d":["Subdivision of the cochlea, part of the bony labyrinth."],"lo":1,"g":"Cochlea","gs":["Cochlea"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Organ of Corti","d":["Inner ear; thousands of hair cells resting on the basilar membrane, with the tectorial membrane above it. Suspended in endolymph, in the middle scala. Transduces physical movement of hair cells to electrical signal.","• Basilar Membrane","• Tectorial Membrane"],"lo":0,"gs":["Organ of Corti"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Basilar Membrane","d":["Membranous labyrinth, underneath the organ of Corti."],"lo":0,"g":"Organ of Corti","gs":["Organ of Corti"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Tectorial Membrane","d":["Membranous labyrinth, above the organ of Corti."],"lo":1,"g":"Organ of Corti","gs":["Organ of Corti"]},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Round Window","d":["Inner ear; membrane that stretches to allow perilymph movement in the cochlea. Bony labyrinth window."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Auditory / Vestibulocochlear Nerve","d":["Bundle of neuron axons, carry electrical signals transduced by the organ of Corti’s hair cells → CNS. From here, signals go to (1) Thalamus, MGN → auditory cortex (2) Inferior colliculi (3) Superior Olive."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Vestibule","d":["Bony labyrinth part with utricle + saccule, involved linear acceleration related balance."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Utricle","d":["Vestibule structure with otolith-covered hair. Linear acceleration related balance."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Saccule","d":["Vestibule structure with otolith-covered hair. Linear acceleration related balance."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Otoliths","d":["Cover utricle/saccule hair cells and resists linear acceleration, signaling to the brain."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Semicircular Canals","d":["Bony labyrinth part; 3 semicircular canals/ducts arranged perpendicularly + ending in ampulla. Involved in rotational acceleration related balance."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Ampulla","d":["Swelling at the end of the 3 semicircular ducts, containing hair cells. Endolymph resists rotational acceleration, bending hair cells and signaling to the brain."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Medial Geniculate Nucleus (MGN)","d":["Part of the thalamus that receives signals from auditory / vestibulocochlear nerves. Sends them to the auditory cortex for conscious processing."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"MGN Pathway","d":["Cochlea / Organ of Corti → auditory nerve → brainstem → MGN (thalamus) → auditory cortex."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Superior Olive","d":["Brainstem structure involved in sound localization."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Vestibulo-Ocular Reflex","d":["Eyes remain on target when your head moves."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Hair Cells","d":["Inner ear; sensory receptors that convert physical movement into electrical signal."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Stereocilia","d":["Tiny projections on hair cells. Open ion channels and depolarize when bent."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Place Theory","d":["Because of the varying thickness of the basilar membrane, pitch is determined by where the basilar membrane vibrates the most."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Tonotopic Organization","d":["Hair cells are arranged on the basilar membrane, such that hair cell location matches pitch responsiveness. Cochlea base hair cells respond to high pitch, cochlea tip hair cells respond to low pitch."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Nerve","d":["Bundle of many neuron axons."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Chemoreceptor","d":["Receptors that detect stimuli by binding chemicals."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Olfactory Chemoreceptor","d":["Smell receptors."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Olfactory Nerves","d":["Nerves that transmit signals from the olfactory chemoreceptors → brain."],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Pheromones","d":["Secreted chemicals that compel an animal to behave in a certain way."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Olfactory Pathway","d":["Nasal passage → Olfactory Epithelium, Olfactory nerves → Olfactory bulb → Olfactory Tract → Brain"],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Taste Buds","d":["Taste chemoreceptors, dissolved compounds."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Papillae","d":["A group of taste buds on the tongue; bump."],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Taste Pathway","d":["Taste buds → Brainstem → Taste center → Brain"],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Taste Center","d":["Part of thalamus that relays taste information."],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Somatosensation","d":["Essentially touch. Includes pressure, vibr s, making a false memory."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Source-monitoring Error","d":["You incorrectly identify the source of a memory."],"lo":0},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Neuroplasticity","d":["The brain’s ability to change and reorganize itself, best in kids."],"lo":0},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Synaptic Cleft","d":["Space between a neuron and target cell."],"lo":1},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Synaptic Pruning","d":["The brain removes weak neural connections."],"lo":0},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Long-term Potentiation","d":["The brain strengthens neural connections. Responsible for short-term → long-term memory.","Sensory Memory (Visual Cortex, etc.) → Short-term, Long-term Memory (Hippocampus) → Long-term Memory (Cerebral Cortex)"],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Cognition","d":["Study of how our brains process and react to information."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Dual-Coding Theory","d":["Paivio, both verbal association + visual images process and store information."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Information Processing Model","d":["• Thinking requires sensation + encoding + storage of stimuli.","• Stimuli must be analyzed by the brain for decision making.","• Decisions made in 1 situation can be used + modified to help new problems.","• Problem solving depends on a problem’s context + complexity, not just cognition."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Cognitive Development","d":["Development of your ability to think + solve problems."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Jean Piaget","d":["Stages of cognitive development.","• Sensorimotor Stage","• Preoperational Stage","• Concrete Operational Stage","• Formal Operational Stage"],"lo":0,"gs":["Jean Piaget"]},{"ch":4,"sec":"4.1 Cognition","term":"Schema","d":["Mental framework used to organize information. Ranges from objects, behaviors, sequences, etc."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Adaptation","d":["Processing of new information.","• Assimilation","• Accommodation"],"lo":0,"gs":["Adaptation"]},{"ch":4,"sec":"4.1 Cognition","term":"Assimilation","d":["Process of classifying new info into a schema."],"lo":0,"g":"Adaptation","gs":["Adaptation"]},{"ch":4,"sec":"4.1 Cognition","term":"Accommodation","d":["Process of changing a schema to accommodate new information."],"lo":0,"g":"Adaptation","gs":["Adaptation"]},{"ch":4,"sec":"4.1 Cognition","term":"Sensorimotor Stage","d":["0–2 years. Manipulate environment, coordinate sensory + motor. Ends with object permanence."],"lo":0,"g":"Jean Piaget","gs":["Jean Piaget"]},{"ch":4,"sec":"4.1 Cognition","term":"Circular Reactions","d":["• Primary Circular Reactions – Sensoriomotor stage; repetitions of actions focused on the baby’s body, pleasurable or interesting. First occurred by chance.","• Secondary Circular Reactions – Sensoriomotor stage; Repetitions of actions focused on the environment, produce an interesting effect."],"lo":1,"gs":["Circular Reactions"]},{"ch":4,"sec":"4.1 Cognition","term":"Primary Circular Reactions","d":["Sensoriomotor stage; repetitions of actions focused on the baby’s body, pleasurable or interesting. First occurred by chance."],"lo":1,"g":"Circular Reactions","gs":["Circular Reactions"]},{"ch":4,"sec":"4.1 Cognition","term":"Secondary Circular Reactions","d":["Sensoriomotor stage; Repetitions of actions focused on the environment, produce an interesting effect."],"lo":1,"g":"Circular Reactions","gs":["Circular Reactions"]},{"ch":4,"sec":"4.1 Cognition","term":"Object Permanence","d":["Things exist even when not in view. Ends sensorimotor stage."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Representational Thought","d":["Baby begins to make mental representations of real things."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Preoperational Stage","d":["2–7 years. Symbolic thinking, egocentrism, no conservation.","• Symbolic Thinking","• Egocentrism"],"lo":0,"g":"Jean Piaget","gs":["Preoperational Stage","Jean Piaget"]},{"ch":4,"sec":"4.1 Cognition","term":"Symbolic Thinking","d":["Ability to pretend, make-believe, imagination."],"lo":0,"g":"Preoperational Stage","gs":["Preoperational Stage","Jean Piaget"]},{"ch":4,"sec":"4.1 Cognition","term":"Egocentrism","d":["Inability to imagine what someone else thinks or feels."],"lo":0,"g":"Preoperational Stage","gs":["Preoperational Stage","Jean Piaget"]},{"ch":4,"sec":"4.1 Cognition","term":"Conservation","d":["An amount is the same regardless of shape or appearance."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Centration","d":["Tendency to hyperfocus on one aspect of something."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Concrete Operational Stage","d":["7–11 years. Conservation, basic logic, no egocentrism, no abstract."],"lo":0,"g":"Jean Piaget","gs":["Jean Piaget"]},{"ch":4,"sec":"4.1 Cognition","term":"Formal Operational Stage","d":["11 years. Abstract thought, hypothetical reasoning."],"lo":0,"g":"Jean Piaget","gs":["Jean Piaget"]},{"ch":4,"sec":"4.1 Cognition","term":"Hypothetical Reasoning","d":["Ability to think of what if’s, not just what’s directly available."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Lev Vygotsky","d":["Cognitive development is influenced by culture + social interaction."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Zone of Proximal Development","d":["Vygotsky; what a child can do with help, but not alone."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Scaffolding","d":["Vygotsky; temporary support that helps a child learn."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Fluid Intelligence","d":["Ability to solve new or unfamiliar problems. Declines with age."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Crystallized Intelligence","d":["Ability to solve familiar problems using acquired knowledge."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Activities of Daily Living","d":["Eating, bathing, etc."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Delirium","d":["Temporary, reversible change in cognitive function, usually caused by medical problems."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Mental Set","d":["Tendency to approach similar problems in the same way."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Functional Fixedness","d":["Inability to consider using an object in a non-traditional way."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Trial-and-Error","d":["Try many solutions until one works."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Algorithm","d":["Formula used to solve a problem."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Deductive / Top-down Reasoning","d":["Use general rules and apply it to a specific example."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Inductive / Bottom-up Reasoning","d":["Use specific examples to build a general rule."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Heuristics","d":["Simplified rules used to make decisions. Rule of thumb.","• Availability Heuristic","• Representativeness Heuristic"],"lo":0,"gs":["Heuristics"]},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Availability Heuristic","d":["Judge the likelihood of an event, by how easily we can recall instances of that event."],"lo":0,"g":"Heuristics","gs":["Heuristics"]},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Representativeness Heuristic","d":["Judge the likelihood of an event, by comparing it to a generalization. Essentially stereotyping."],"lo":0,"g":"Heuristics","gs":["Heuristics"]},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Base Rate Fallacy","d":["Using generalizations instead of actual numerical information."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Disconfirmation Principle","d":["If evidence does not support a solution/hypothesis, it is disconfirmed, and therefore should be discarded."],"lo":1},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Confirmation Bias","d":["Tendency to focus more on information that supports one’s beliefs."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Belief Perseverance","d":["Inability to reject a belief, despite clear evidence against it."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Hindsight Bias","d":["Tendency to underestimate something once you know its solution or fate."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Intuition","d":["Quick judgement through unconscious pattern recognition rather than conscious reasoning."],"lo":1},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Recognition-primed Decision Model","d":["Use of experience + unconscious pattern recognition to make decisions. Under this model, intuition is a component in familiar situations."],"lo":1},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Emotion","d":["Subjective experience during a specific situation."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Multiple Intelligence Theory","d":["Intelligence is defined not as one ability, but many unique abilities. Howard Gardner.","• Linguistic Intelligence","• Logical-Mathematical Intelligence","• Visual-Spatial Intelligence","• Bodily-Kinesthetic Intelligence","• Interpersonal Intelligence","• Intrapersonal Intelligence","• Naturalist Intelligence"],"lo":0,"gs":["Multiple Intelligence Theory"]},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Interpersonal Intelligence","d":["Ability to detect + navigate moods of others."],"lo":0,"g":"Multiple Intelligence Theory","gs":["Multiple Intelligence Theory"]},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Intrapersonal Intelligence","d": ss of the world, and your existence in that world."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Alertness","d":["State of consciousness; awake and able to think."],"lo":0,"gs":["Alertness"]},{"ch":4,"sec":"4.3 Consciousness","term":"Physiological Arousal","d":["State characterized by physiological reactions like increased HR, BR, BP, etc."],"lo":0,"g":"Alertness","gs":["Alertness"]},{"ch":4,"sec":"4.3 Consciousness","term":"Reticular Formation","d":["Brainstem structure that keeps the cerebral cortex awake."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Beta Waves","d":["High frequency brain waves, when awake + concentrating or alert."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Alpha Waves","d":["Lower frequency than beta waves, when awake + relaxed."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Stage 1 / NREM1","d":["Lightest sleep, right as you doze off. Theta waves. Easy to wake. Hypnagogic hallucinations + hypnic jerks happen here."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Theta Waves","d":["Irregular brain waves with low frequency. NREM1."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Stage 2 / NREM2","d":["Deeper sleep. Most total time spent here. Theta waves + sleep spindles + K complexes."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Sleep Spindles","d":["Bursts of high frequency waves. NREM2."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"K Complexes","d":["Singular high amplitude waves. NREM2."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Stage 3 / NREM3 / Slow-Wave Sleep","d":["Deepest sleep, with cognitive recovery and GH release. Hard to rouse. Delta waves. Sleepwalking, night terrors, bedwetting happen here."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Delta Waves","d":["Very low-frequency brain waves. NREM3."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Non-Rapid Eye Movement (NREM) Sleep","d":["NREM1, NREM2, NREM3 (= N1, N2, N3). Old system had 4 stages; now 3.","Cycle: N1 → N2 → N3 → N2 → REM, ~90 min. Later in the night N3 shrinks and REM gets longer."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Rapid Eye Movement (REM) Sleep / Paradoxical Sleep","d":["Kind of sleep, with mimicked physiological arousal + muscle paralysis. Dreams occur in REM."],"lo":0,"g":"Sleep Stages & Brain Waves","gs":["Sleep Stages & Brain Waves"]},{"ch":4,"sec":"4.3 Consciousness","term":"Sleep Cycle","d":["1 complete progression through the sleep stages. Longer in adults.","• 1 → 2 → 3 → 4 → REM → (repeat), with REM getting longer and longer."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Circadian Rhythms","d":["~24 hour cycle that controls waking + sleeping. Affected by light. Pineal gland, melatonin."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Melatonin and Sleep","d":["Circadian Rhythm; melatonin levels are higher in the evening when light decreases, and helps us feel sleepy."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Cortisol and Sleep","d":["Circadian Rhythm; cortisol levels are higher when we are awake, and helps us feel awake."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Corticotropin-releasing Factor (CRF)","d":["Released from hypothalamus in response to increasing light."],"lo":1},{"ch":4,"sec":"4.3 Consciousness","term":"Adrenocorticotropic Hormone (ACTH)","d":["Released from anterior pituitary in response to CRF. Stimulates cortisol release."],"lo":1},{"ch":4,"sec":"4.3 Consciousness","term":"Activation-Synthesis Theory","d":["Theorizes dreams are caused by widespread, random neural activity."],"lo":0,"g":"Dream Theories","gs":["Dream Theories"]},{"ch":4,"sec":"4.3 Consciousness","term":"Problem Solving Dream Theory","d":["Theorizes dreams help people solve problems."],"lo":1,"g":"Dream Theories","gs":["Dream Theories"]},{"ch":4,"sec":"4.3 Consciousness","term":"Cognitive Process Dream Theory","d":["Theorizes dreams are a natural continuation of regular thinking, but during sleep."],"lo":1,"g":"Dream Theories","gs":["Dream Theories"]},{"ch":4,"sec":"4.3 Consciousness","term":"Neurocognitive Models of Dreaming","d":["Theorizes that dreams are normal brain activity during sleep. Combines physiology + psychology."],"lo":1,"g":"Dream Theories","gs":["Dream Theories"]},{"ch":4,"sec":"4.3 Consciousness","term":"Dyssomnia","d":["General disorders that make it hard to sleep. Usually during NREM sleep.","• Insomnia","• Narcolepsy","• Cataplexy","• Sleep Paralysis","• Hypnagogic Hallucination","• Hypnopompic Hallucination","• Sleep Apnea"],"lo":1,"gs":["Dyssomnia"]},{"ch":4,"sec":"4.3 Consciousness","term":"Insomnia","d":["Hard to fall asleep or stay asleep."],"lo":0,"g":"Dyssomnia","gs":["Dyssomnia"]},{"ch":4,"sec":"4.3 Consciousness","term":"Narcolepsy","d":["Can’t control when you fall asleep, sleep attacks."],"lo":0,"g":"Dyssomnia","gs":["Dyssomnia"]},{"ch":4,"sec":"4.3 Consciousness","term":"Cataplexy","d":["REM-like loss of muscle control, during waking hours. Emotional onset."],"lo":0,"g":"Dyssomnia","gs":["Dyssomnia"]},{"ch":4,"sec":"4.3 Consciousness","term":"Sleep Paralysis","d":["Inability to move when awake."],"lo":0,"g":"Dyssomnia","gs":["Dyssomnia"]},{"ch":4,"sec":"4.3 Consciousness","term":"Hypnagogic Hallucination","d":["Hallucinations when going to sleep."],"lo":1,"g":"Dyssomnia","gs":["Dyssomnia const KEY='ps-flash-v1', CHKEY='ps-flash-ch1', MODEKEY='ps-flash-mode', YKEY='ps-flash-yield';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const cards=DATA.cards.map((c,i)=>({...c,id:c.ch+'|'+c.sec+'|'+c.term}));
let status=load(KEY,{});            // id -> 'yes' | 'no'
let chSel=String(load(CHKEY,'all'));
const $=id=>document.getElementById(id);
$('chSel').innerHTML='<option value="all">All chapters</option>'+DATA.chapters.map(c=>'<option value="'+c.ch+'">Ch '+c.ch+' · '+c.title+'</option>').join('');
$('chSel').value=chSel;
const GRPKEY='ps-flash-grp'; let grpSel=String(load(GRPKEY,'all'));
function fillGroups(){
  const seen=[];cards.forEach(c=>{if((chSel==='all'||c.ch==+chSel)&&c.gs)c.gs.slice().reverse().forEach(g=>{if(!seen.includes(g))seen.push(g)})});
  $('grpSel').innerHTML='<option value="all">All groups</option>'+seen.map(g=>'<option value="'+esc(g).replace(/"/g,'&quot;')+'">'+esc(g)+'</option>').join('');
  if(!seen.includes(grpSel)) grpSel='all';
  $('grpSel').value=grpSel;
}
fillGroups();
$('mode').value=load(MODEKEY,'todo');
$('yield').value=load(YKEY,'all');
let queue=[], idx=0, history=[], pile='no', drill=null;
const GKEY='ps-flash-guides';
const byId=new Map(cards.map((c,i)=>[c.id,i]));
Object.entries(DATA.alias||{}).forEach(([a,p])=>{if(byId.has(p)&&!byId.has(a))byId.set(a,byId.get(p))});
let guides=load(GKEY,null);
if(!Array.isArray(guides)) guides=[];
function saveGuides(){save(GKEY,guides)}

function pileOf(c){return status[c.id]||'new'}
function inScope(){if(drill)return drill.i.map(i=>cards[i]);const y=$('yield').value;return cards.filter(c=>(chSel==='all'||c.ch==+chSel)&&(grpSel==='all'||(c.gs&&c.gs.includes(grpSel)))&&(y==='all'||(y==='lo'?c.lo:!c.lo)))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function blockShuffle(list){
  const blocks=new Map(),order=[];
  list.forEach(c=>{const k=c.gs?c.gs[c.gs.length-1]:'#'+c.id;if(!blocks.has(k)){blocks.set(k,[]);order.push(k)}blocks.get(k).push(c)});
  return shuffle(order).flatMap(k=>{const b=blocks.get(k);b.sort((x,y)=>cards.indexOf(x)-cards.indexOf(y));return b});
}
function build(){
  const m=drill?'all':$('mode').value;
  queue=blockShuffle(inScope().filter(c=>{const p=pileOf(c);return m==='all'||(m==='todo'?p!=='yes':p===m)}));
  idx=0; history=[]; render();
}
function esc(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))}
function lineHTML(x){const m=x.match(/^([•◦] )(.+?)( – [\s\S]*)?$/);if(!m)return esc(x);return esc(m[1])+'<b>'+esc(m[2])+'</b>'+(m[3]?esc(m[3]):'')}
function defHTML(c){return c.d.map(x=>x.startsWith('◦ ')?'<p class="sub">'+lineHTML(x)+'</p>':'<p>'+lineHTML(x)+'</p>').join('')}
function stats(){
  const s={new:0,no:0,yes:0}; inScope().forEach(c=>s[pileOf(c)]++);
  $('sNew').textContent=s.new;$('sNo').textContent=s.no;$('sYes').textContent=s.yes;
}
function render(){
  stats();
  const card=$('card'); card.classList.remove('flipped');
  if(idx>=queue.length){
    card.innerHTML='<div class="done"><b style="font-size:20px;color:var(--ink)">Done with this set.</b><br><br>'+(drill?'Hit Shuffle to drill again, or Exit above.':'Hit Shuffle to go again, or switch the mode.')+'</div>';
    $('actions').classList.add('hidden'); return;
  }
  $('actions').classList.remove('hidden');
  if(!$('term')) card.innerHTML='<div class="meta"><span id="where"></span><span id="pos"></span></div><div class="grp" id="grp"></div><div class="term" id="term"></div><div class="def" id="def"></div><div class="hint">Tap to flip</div>';
  const c=queue[idx], p=pileOf(c);
  $('where').innerHTML='Ch '+c.ch+(c.sec?' · '+esc(c.sec.replace(/^\d+\.\d+\s*/,'')):'')+(c.lo?' <span class="tag lo">low yield</span>':'')+(p!=='new'?' <span class="tag '+p+'">'+(p==='yes'?'got it':"don't get it")+'</span>':'');
  $('pos').textContent=(idx+1)+' / '+queue.length;
  $('grp').textContent=c.g||''; $('term').textContent=c.term; $('def').innerHTML=defHTML(c);
}
function mark(v){
  if(idx>=queue.length) return;
  const c=queue[idx]; history.push([idx,c.id,status[c.id]]);
  status[c.id]=v; save(KEY,status); idx++; render();
}
$('card').onclick=()=>{if(idx<queue.length)$('card').classList.toggle('flipped')};
$('bNo').onclick=()=>mark('no'); $('bYes').onclick=()=>mark('yes');
$('undo').onclick=()=>{const h=history.pop(); if(!h) return; const [i,id,prev]=h; if(prev) status[id]=prev; else delete status[id]; save(KEY,status); idx=i; render();};
$('shuffle').onclick=build;
$('mode').onchange=()=>{save(MODEKEY,$('mode').value);build()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key===' '){e.preventDefault();$('card').click()}
  else if(e.key==='ArrowLeft') mark('no');
  else if(e.key==='ArrowRight') mark('yes');
});

// filters
function refilter(){build();if(tab==='listView')drawList()}
$('chSel').onchange=()=>{chSel=$('chSel').value;save(CHKEY,chSel);fillGroups();refilter()};
$('grpSel').onchange=()=>{grpSel=$('grpSel').value;save(GRPKEY,grpSel);refilter()};
$('yield').onchange=()=>{save(YKEY,$('yield').value);refilter()};

// piles
function drawList(){
  const items=inScope().filter(c=>pileOf(c)===pile);
  $('list').innerHTML=items.length?items.map(c=>'<details class="item"><summary><span>'+esc(c.term)+'</span><span class="small">'+(c.g?esc(c.g)+' · ':'')+(c.lo?'low · ':'')+'Ch '+c.ch+'</span></summary><div class="def">'+defHTML(c)+'</div></details>').join(''):'<p class="small" style="text-align:center">Nothing here.</p>';
  document.querySelectorAll('[data-pile]').forEach(b=>b.classList.toggle('on',b.dataset.pile===pile));
}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-pile]'); if(!b) return; pile=b.dataset.pile; drawList();};
let tab='study';
function showTab(t){
  tab=t;
  ['study','listView','guideView','mapView'].forEach(x=>$(x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('controls').classList.toggle('hidden',t==='guideView'||t==='mapView');
  $('drillBar').classList.toggle('hidden',!drill||t==='guideView'||t==='mapView');
  if(t==='listView') drawList();
  if(t==='mapView') MAP.open(); else MAP.close();
  window.scrollTo(0,0);
}
document.querySelector('.nav').onclick=e=>{const b=e.target.closest('[data-tab]'); if(b) showTab(b.dataset.tab)};
function setDrill(g){
  drill=g||null;
  $('drillName').textContent=drill?'Drilling: '+drill.n+' ('+drill.i.length+')':'';
  ['chSel','grpSel','yield','mode'].forEach(x=>$(x).classList.toggle('hidden',!!drill));
  build(); showTab('study');
}
let editing=null, openTerm={};
const gIdx=id=>guides.findIndex(g=>g.id===id);
function itemLabel(it){if(it.t!=null)return it.t;const i=byId.get(it.c);return i==null?'(missing term)':cards[i].term}
function groupCards(g){return g.items.map(it=>byId.get(it.c)).filter(i=>i!=null)}
function viewHTML(g){
  const n=groupCards(g).length, ot=openTerm[g.id];
  let def='';
  if(ot!=null){const it=g.items[ot]; const i=it&&byId.get(it.c); if(i!=null) def='<div class="gd"><b>'+esc(cards[i].term)+'</b>'+defHTML(cards[i])+'<span class="small">Ch '+cards[i].ch+'</span></div>';}
  return '<div class="g" data-id="'+g.id+'"><div class="gh"><h3>'+esc(g.name||'Untitled')+'</h3><div class="row" style="gap:2px">'+
    (n?'<button class="link" data-act="drill">Drill '+n+'</button>':'')+'<button class="link" data-act="edit">Edit</button></div></div>'+
    (g.items.length?'<div class="terms">'+g.items.map((it,k)=>{const i=byId.get(it.c);const cls=it.t!=null?'tt plain':'tt'+(i!=null&&cards[i].lo?' lo':'')+(ot===k?' on':'');return '<button class="'+cls+'" data-k="'+k+'">'+esc(itemLabel(it))+'</button>'}).join('')+'</div>':'<p class="small">No terms yet. Tap Edit to add some.</p>')+def+'</div>';
}
function editHTML(g){
  const topics=[...new Set(guides.map(x=>x.topic).filter(Boolean))];
  return '<div class="g editing" data-id="'+g.id+'">'+
   '<div class="ef"><label>Group name<input data-f="name" value="'+esc(g.name||'').replace(/"/g,'&quot;')+'" placeholder="e.g. Frontal Lobe"></label>'+
   '<label>Topic <span class="small">(optional heading)</span><input data-f="topic" list="topicList" value="'+esc(g.topic||'').replace(/"/g,'&quot;')+'" placeholder="e.g. Brain"></label></div>'+
   '<datalist id="topicList">'+topics.map(t=>'<option value="'+esc(t).replace(/"/g,'&quot;')+'">').join('')+'</datalist>'+
   '<div class="eitems">'+(g.items.length?g.items.map((it,k)=>'<div class="erow"><span>'+esc(itemLabel(it))+'</span><span class="row" style="gap:2px;flex-wrap:nowrap"><button class="ib" data-act="iup" data-k="'+k+'" aria-label="Move up">↑</button><button class="ib" data-act="idown" data-k="'+k+'" aria-label="Move down">↓</button><button class="ib x" data-act="idel" data-k="'+k+'" aria-label="Remove">×</button></span></div>').join(''):'<p class="small">No terms yet.</p>')+'</div>'+
   '<input class="search" data-f="search" placeholder="Search your terms to add…" autocomplete="off"><div class="results"></div>'+
   '<div class="ebar"><button data-act="gup">↑ Move group</button><button data-act="gdown">↓ Move group</button><button class="danger" data-act="gdel">Delete</button><button class="primary" data-act="done">Done</button></div></div>';
}
function drawGuides(){
  let html='', last=undefined;
  guides.forEach(g=>{
    const t=g.topic||'';
    if(t!==last){html+=t?'<h4 class="topic">'+esc(t)+'</h4>':(last!==undefined?'<h4 class="topic">Other</h4>':'');last=t}
    html+=editing===g.id?editHTML(g):viewHTML(g);
  });
  $('guideBody').innerHTML=html||'<p class="small" style="text-align:center;padding:24px 0">No groups yet. Hit "+ New group".</p>';
  if(editing){const el=document.querySelector('.editing [data-f=search]');}
}
function results(q){
  q=q.trim().toLowerCase(); if(!q) return '';
  const hits=[]; for(let i=0;i<cards.length&&hits.length<8;i++){if(cards[i].term.toLowerCase().includes(q))hits.push(i)}
  return hits.map(i=>'<button class="res" data-act="add" data-i="'+i+'"><span>'+esc(cards[i].term)+'</span><span class="small">'+(cards[i].lo?'low · ':'')+'Ch '+cards[i].ch+'</span></button>').join('')+
    '<button class="res" data-act="addtext"><span>Add "'+esc(q)+'" as plain text</span><span class="small">no definition</span></button>';
}
$('newGroup').onclick=()=>{
  const g={id:'g'+Date.now(),topic:guides.length?guides[guides.length-1].topic:'',name:'',items:[]};
  guides.push(g); saveGuides(); editing=g.id; drawGuides();
  const el=document.querySelector('.editing [data-f=name]'); el.scrollIntoView({block:'center'}); el.focus();
};
$('guideBody').addEventListener('input',e=>{
  const box=e.target.closest('.g'); if(!box) return; const g=guides[gIdx(box.dataset.id)]; const f=e.target.dataset.f;
  if(f==='search'){box.querySelector('.results').innerHTML=results(e.target.value);return}
  if(f==='name'||f==='topic'){g[f]=e.target.value;saveGuides()}
});
$('guideBody').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset.f==='search'){e.preventDefault();const b=e.target.parentElement.querySelector('.res');if(b)b.click()}
});
$('guideBody').addEventListener('click',e=>{
  const box=e.target.closest('.g'); if(!box) return;
  const gi=gIdx(box.dataset.id), g=guides[gi];
  const tt=e.target.closest('.tt');
  if(tt&&!tt.classList.contains('plain')){const k=+tt.dataset.k; openTerm[g.id]=openTerm[g.id]===k?null:k; drawGuides(); return}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, k=+b.dataset.k;
  const refocus=()=>{const s=document.querySelector('.editing [data-f=search]'); if(s) s.focus()};
  if(a==='drill'){const ix=groupCards(g);setDrill({n:g.name||'Untitled',i:[...new Set(ix)]});return}
  if(a==='edit'){editing=g.id;drawGuides();return}
  if(a==='done'){editing=null;drawGuides();box.scrollIntoView&&document.querySelector('[data-id="'+g.id+'"]').scrollIntoView({block:'nearest'});return}
  if(a==='add'){const id=cards[+b.dataset.i].id; if(!g.items.some(x=>x.c===id)) g.items.push({c:id}); saveGuides(); drawGuides(); refocus(); return}
  if(a==='addtext'){const v=box.querySelector('[data-f=search]').value.trim(); if(v) g.items.push({t:v}); saveGuides(); drawGuides(); refocus(); return}
  if(a==='idel'){g.items.splice(k,1)}
  else if(a==='iup'&&k>0){[g.items[k-1],g.items[k]]=[g.items[k],g.items[k-1]]}
  else if(a==='idown'&&k<g.items.length-1){[g.items[k+1],g.items[k]]=[g.items[k],g.items[k+1]]}
  else if(a==='gup'&&gi>0){[guides[gi-1],guides[gi]]=[guides[gi],guides[gi-1]]}
  else if(a==='gdown'&&gi<guides.length-1){[guides[gi+1],guides[gi]]=[guides[gi],guides[gi+1]]}
  else if(a==='gdel'){if(!confirm('Delete "'+(g.name||'Untitled')+'"?'))return; guides.splice(gi,1); editing=null}
  else return;
  saveGuides(); drawGuides();
  if(a==='gup'||a==='gdown'){const el=document.querySelector('[data-id="'+g.id+'"]'); if(el) el.scrollIntoView({block:'center'})}
});
drawGuides();
$('drillExit').onclick=()=>setDrill(null);
$('reset').onclick=()=>{if(drill){if(!confirm('Move every card in this drill group back to New?'))return;inScope().forEach(c=>delete status[c.id]);save(KEY,status);drawList();stats();return;}if(!confirm('Move every card in the current chapter/yield selection back to New?'))return;inScope().forEach(c=>delete status[c.id]); save(KEY,status); drawList(); stats();};

// save / load progress file
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
$('saveBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'ps-flash',v:1,saved:new Date().toISOString(),status,guides,chapter:chSel,group:grpSel,yield:$('yield').value,mode:$('mode').value})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ps-progress.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress saved');
};
function loadFile(f){
  if(!f) return;
  f.text().then(txt=>{
    const o=JSON.parse(txt);
    if(!o||typeof o.status!=='object') throw 0;
    status=o.status; save(KEY,status);
    if(o.chapter){chSel=String(o.chapter);$('chSel').value=chSel;save(CHKEY,chSel)}
    if(o.group){grpSel=String(o.group);save(GRPKEY,grpSel)} fillGroups();
    if(o.yield){$('yield').value=o.yield;save(YKEY,o.yield)}
    if(Array.isArray(o.guides)){guides=o.guides;saveGuides();editing=null;drawGuides()}
    if(o.mode){$('mode').value=o.mode;save(MODEKEY,o.mode)}
    build(); if(tab==='listView') drawList();
    const n=Object.values(status), no=n.filter(x=>x==='no').length, yes=n.filter(x=>x==='yes').length;
    toast('Loaded: '+no+" don't get it, "+yes+' got it');
  }).catch(()=>toast("That file isn't a progress file"));
}
$('loadBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(--dragN<=0){dragN=0;document.body.classList.remove('dragging')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('dragging');loadFile(e.dataTransfer.files[0])});

// ---- concept map ----
const MAP=(()=>{
  const cv=$('map'), ctx=cv.getContext('2d');
  let nodes=[], links=[], nbr=new Map(), W=0, H=0, dpr=1;
  let cam={x:0,y:0,k:1}, alpha=0, raf=0, active=false, sel=null, hover=null, sig='';
  const norm=x=>String(x).toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
  const cardByName=new Map();
  cards.forEach((c,i)=>{
    const full=norm(c.term); if(!cardByName.has(full)) cardByName.set(full,i);
    c.term.split(/\s*\/\s*/).forEach(p=>{const a=norm(p.replace(/\s*\(.*?\)\s*/g,' ')); if(a&&!cardByName.has(a)) cardByName.set(a,i)});
    const np=norm(c.term.replace(/\s*\(.*?\)\s*/g,' ')); if(!cardByName.has(np)) cardByName.set(np,i);
  });
  const colorsFor=()=>{const cs=getComputedStyle(document.documentElement);const g=v=>cs.getPropertyValue(v).trim();return{ink:g('--ink'),muted:g('--muted'),line:g('--line'),accent:g('--accent'),card:g('--card'),bg:g('--bg')}};
  const PAL=['#3b5bdb','#c2410c','#15803d','#9333ea','#0e7490','#b45309','#be185d','#4d7c0f'];
  function build(){
    const topic=$('mapTopic').value||'__all';
    const gs=guides.filter(g=>topic==='__all'||(g.topic||'')===topic);
    const topics=[...new Set(guides.map(g=>g.topic||''))];
    const old=new Map(nodes.map(n=>[n.key,n]));
    const N=new Map(); links=[]; nbr=new Map();
    const groupKey=new Map();
    gs.forEach(g=>{const nm=norm(g.name||'Untitled');const ci=cardByName.get(nm);groupKey.set(g.id,ci!=null?'c'+ci:'g:'+nm)});
    const groupByName=new Map(gs.map(g=>[norm(g.name||'Untitled'),groupKey.get(g.id)]));
    const add=(key,label,kind,ci,topic)=>{
      let n=N.get(key);
      if(!n){const o=old.get(key);n={key,label,kind,ci,topic,x:o?o.x:(Math.random()-.5)*300,y:o?o.y:(Math.random()-.5)*300,vx:0,vy:0,deg:0,fixed:false};N.set(key,n)}
      if(kind==='group'){n.kind='group';n.label=label;n.topic=topic}
      if(ci!=null&&n.ci==null) n.ci=ci;
      return n;
    };
    gs.forEach(g=>{
      const gk=groupKey.get(g.id), ci=gk[0]==='c'?+gk.slice(1):null;
      const gn=add(gk,g.name||'Untitled','group',ci,g.topic||'');
      g.items.forEach(it=>{
        let key,label,ci2=null;
        if(it.t!=null){const nm=norm(it.t);key=groupByName.get(nm);if(!key){const c=cardByName.get(nm);key=c!=null?'c'+c:'t:'+nm;ci2=c??null}label=it.t}
        else{const i=byId.get(it.c);if(i==null)return;key='c'+i;ci2=i;label=cards[i].term}
        if(key===gk) return;
        const tn=add(key,label,'term',ci2,g.topic||'');
        if(!links.some(l=>(l.s===gn&&l.t===tn)||(l.s===tn&&l.t===gn))) links.push({s:gn,t:tn});
      });
    });
    nodes=[...N.values()];
    nodes.forEach(n=>{n.deg=0;nbr.set(n,new Set())});
    links.forEach(l=>{l.s.deg++;l.t.deg++;nbr.get(l.s).add(l.t);nbr.get(l.t).add(l.s)});
    nodes.forEach(n=>{n.r=(n.kind==='group'?7:4)+Math.sqrt(n.deg)*2.2;n.col=PAL[Math.max(0,topics.indexOf(n.topic))%PAL.length]});
    $('mapEmpty').classList.toggle('hidden',nodes.length>0);
    $('mapNames').innerHTML=nodes.map(n=>'<option value="'+esc(n.label).replace(/"/g,'&quot;')+'">').join('');
    if(sel&&!N.has(sel.key)) sel=null; else if(sel) sel=N.get(sel.key);
    info();
  }
  function step(){
    const n=nodes.length; if(!n) return;
    const rep=7000, len=95, kS=.05;
    for(let i=0;i<n;i++){const a=nodes[i];for(let j=i+1;j<n;j++){const b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;if(d2>250000)continue;const f=rep/d2*alpha,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
    links.forEach(l=>{const dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;const L=len+(l.s.r+l.t.r);const f=(d-L)*kS*alpha;const fx=dx/d*f,fy=dy/d*f;l.s.vx+=fx;l.s.vy+=fy;l.t.vx-=fx;l.t.vy-=fy});
    nodes.forEach(a=>{a.vx-=a.x*.004*alpha;a.vy-=a.y*.004*alpha;if(a.fixed){a.vx=a.vy=0;return}a.vx*=.6;a.vy*=.6;a.x+=a.vx;a.y+=a.vy});
    alpha*=.985; if(alpha<.02) alpha=0;
  }
  function draw(){
    const C=colorsFor();
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    ctx.translate(W/2+cam.x,H/2+cam.y);ctx.scale(cam.k,cam.k);
    const focus=sel||hover, near=focus?nbr.get(focus):null;
    const dim=n=>focus&&n!==focus&&!near.has(n);
    ctx.lineWidth=1/cam.k;
    links.forEach(l=>{const on=focus&&(l.s===focus||l.t===focus);ctx.strokeStyle=on?C.accent:C.line;ctx.globalAlpha=focus&&!on?.25:1;ctx.lineWidth=(on?2:1.2)/cam.k;ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke()});
    nodes.forEach(n=>{
      ctx.globalAlpha=dim(n)?.2:1;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);
      ctx.fillStyle=n.kind==='group'?n.col:(n.ci!=null&&cards[n.ci].lo?C.line:C.muted);ctx.fill();
      if(n===sel){ctx.lineWidth=3/cam.k;ctx.strokeStyle=C.ink;ctx.stroke()}
    });
    ctx.textAlign='center';ctx.textBaseline='top';
    nodes.forEach(n=>{
      const show=n===focus||(near&&near.has(n))||(!focus&&(n.kind==='group'?true:cam.k>.9));
      if(!show) return;
      ctx.globalAlpha=dim(n)?.25:1;
      const fs=(n.kind==='group'?13:11.5)/Math.max(cam.k,.6)*Math.min(cam.k,1.6)/Math.min(cam.k,1.6);
      const px=(n.kind==='group'?12:11)/Math.min(cam.k,1.4);
      ctx.font=(n.kind==='group'?'600 ':'')+px+'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      const lab=n.label.length>34?n.label.slice(0,32)+'…':n.label;
      ctx.lineWidth=3/cam.k;ctx.strokeStyle=C.card;ctx.strokeText(lab,n.x,n.y+n.r+3/cam.k);
      ctx.fillStyle=n.kind==='group'?C.ink:C.muted;ctx.fillText(lab,n.x,n.y+n.r+3/cam.k);
    });
    ctx.globalAlpha=1;
  }
  function loop(){raf=0;if(!active)return;if(alpha>0)step();draw();if(alpha>0||dragN)raf=requestAnimationFrame(loop)}
  function kick(a){alpha=Math.max(alpha,a||.6);if(!raf&&active)raf=requestAnimationFrame(loop)}
  function redraw(){if(!raf&&active)raf=requestAnimationFrame(loop)}
  function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;redraw()}
  function fit(){if(!nodes.length)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;nodes.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)});const k=Math.min(W/(x1-x0+120),H/(y1-y0+120),2.2);cam.k=Math.max(.15,k);cam.x=-(x0+x1)/2*cam.k;cam.y=-(y0+y1)/2*cam.k;redraw()}
  const toWorld=(px,py)=>({x:(px-W/2-cam.x)/cam.k,y:(py-H/2-cam.y)/cam.k});
  function hit(px,py){const p=toWorld(px,py);let best=null,bd=1e9;nodes.forEach(n=>{const d=Math.hypot(n.x-p.x,n.y-p.y);const R=Math.max(n.r,12/cam.k);if(d<R&&d<bd){bd=d;best=n}});return best}
  function zoomAt(px,py,f){const p=toWorld(px,py);cam.k=Math.min(5,Math.max(.12,cam.k*f));cam.x=px-W/2-p.x*cam.k;cam.y=py-H/2-p.y*cam.k;redraw()}
  function info(){
    const el=$('mapInfo');
    if(!sel){el.classList.add('hidden');return}
    const c=sel.ci!=null?cards[sel.ci]:null;
    const ns=[...nbr.get(sel)||[]].sort((a,b)=>(b.kind==='group')-(a.kind==='group')||a.label.localeCompare(b.label));
    el.innerHTML='<h3>'+esc(sel.label)+'</h3>'+(c?defHTML(c)+'<span class="small">'+(c.lo?'Low yield · ':'')+'Ch '+c.ch+'</span>':'<p class="small">No definition (plain text or group name).</p>')+
      (ns.length?'<div class="nb">'+ns.map(n=>'<button class="tt'+(n.kind==='group'?' on':'')+'" data-key="'+esc(n.key).replace(/"/g,'&quot;')+'">'+esc(n.label)+'</button>').join('')+'</div>':'');
    el.classList.remove('hidden');
  }
  function select(n,center){sel=n;info();if(n&&center){cam.x=-n.x*cam.k;cam.y=-n.y*cam.k}redraw()}
  $('mapInfo').onclick=e=>{const b=e.target.closest('[data-key]');if(!b)return;const n=nodes.find(x=>x.key===b.dataset.key);if(n)select(n,true)};
  // pointer handling
  const pts=new Map(); let dragN=null, panning=false, moved=0, pinch=null, downAt=null;
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
    pts.set(e.pointerId,{x:px,y:py});moved=0;downAt={x:px,y:py};
    if(pts.size===2){dragN=null;panning=false;const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:cam.k};return}
    const n=hit(px,py);
    if(n){dragN=n;n.fixed=true;kick(.3)}else{panning=true}
    cv.classList.add('dragging');
  });
  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
    if(!pts.has(e.pointerId)){const h=hit(px,py);if(h!==hover){hover=h;redraw()}return}
    const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:px,y:py});
    moved+=Math.abs(px-prev.x)+Math.abs(py-prev.y);
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const f=(pinch.k*d/pinch.d)/cam.k;zoomAt((a.x+b.x)/2,(a.y+b.y)/2,f);return}
    if(dragN){const p=toWorld(px,py);dragN.x=p.x;dragN.y=p.y;kick(.3);redraw()}
    else if(panning){cam.x+=px-prev.x;cam.y+=py-prev.y;redraw()}
  });
  const up=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(moved<6&&pts.size===0){const n=dragN||hit(downAt.x,downAt.y);select(n&&n!==sel?n:(n===sel?sel:null))}
    if(dragN){dragN.fixed=false;dragN=null}
    panning=false;cv.classList.remove('dragging');redraw();
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{if(hover){hover=null;redraw()}});
  cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015))},{passive:false});
  $('zIn').onclick=()=>zoomAt(W/2,H/2,1.3);$('zOut').onclick=()=>zoomAt(W/2,H/2,1/1.3);$('zFit').onclick=fit;
  $('mapTopic').onchange=()=>{build();kick(.8);setTimeout(fit,700)};
  $('mapFind').onchange=()=>{const q=norm($('mapFind').value);const n=nodes.find(x=>norm(x.label)===q)||nodes.find(x=>norm(x.label).includes(q));if(n){if(cam.k<1)cam.k=1.2;select(n,true)}};
  addEventListener('resize',()=>{if(active)resize()});
  return{
    open(){
      const topics=[...new Set(guides.map(g=>g.topic||''))];
      const cur=$('mapTopic').value;
      $('mapTopic').innerHTML='<option value="__all">All topics</option>'+topics.map(t=>'<option value="'+esc(t).replace(/"/g,'&quot;')+'">'+(t?esc(t):'(No topic)')+'</option>').join('');
      if([...$('mapTopic').options].some(o=>o.value===cur))$('mapTopic').value=cur;
      active=true;resize();
      const ns=JSON.stringify(guides)+$('mapTopic').value;
      if(ns!==sig){const first=!nodes.length;sig=ns;build();if(first){for(let i=0;i<300;i++){alpha=Math.max(alpha,.8);step()}alpha=.3}kick(.3);fit()}
      redraw();
    },
    close(){active=false}
  };
})();

build();
</script>
