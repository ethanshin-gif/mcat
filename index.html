gence","d":["Describes emotional awareness. Empathy.","• Ability to express + perceive emotions.","• Ability to comprehend + analyze emotions.","• Ability to control emotions.","• Ability to apply emotions."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Intelligence Quotient (IQ)","d":["( Mental age / Chronological age) x 100"],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Stanford-Binet IQ Test","d":["Stanford professor used Alfred Binet’s work to make a test."],"lo":1},{"ch":4,"sec":"4.3 Consciousness","term":"Consciousness","d":["Awareness of the world, and your existence in that world."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Alertness","d":["State of consciousness; awake and able to think.","• Physiological Arousal – State characterized by physiological reactions like increased HR, BR, BP, etc."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Reticular Formation","d":["Brainstem structure that keeps the cerebral cortex awake."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Sleep Stages & Brain Waves","d":["Awake → N1 → N2 → N3 → REM.","• Beta Waves – High frequency brain waves, when awake + concentrating or alert.","• Alpha Waves – Lower frequency than beta waves, when awake + relaxed.","• Stage 1 / NREM1 – Lightest sleep, right as you doze off. Theta waves. Easy to wake. Hypnagogic hallucinations + hypnic jerks happen here.","• Theta Waves – Irregular brain waves with low frequency. NREM1.","• Stage 2 / NREM2 – Deeper sleep. Most total time spent here. Theta waves + sleep spindles + K complexes.","• Sleep Spindles – Bursts of high frequency waves. NREM2.","• K Complexes – Singular high amplitude waves. NREM2.","• Stage 3 / NREM3 / Slow-Wave Sleep – Deepest sleep, with cognitive recovery and GH release. Hard to rouse. Delta waves. Sleepwalking, night terrors, bedwetting happen here.","• Delta Waves – Very low-frequency brain waves. NREM3.","• Non-Rapid Eye Movement (NREM) Sleep – NREM1, NREM2, NREM3 (= N1, N2, N3). Old system had 4 stages; now 3.","◦ Cycle: N1 → N2 → N3 → N2 → REM, ~90 min. Later in the night N3 shrinks and REM gets longer.","• Rapid Eye Movement (REM) Sleep / Paradoxical Sleep – Kind of sleep, with mimicked physiological arousal + muscle paralysis. Dreams occur in REM."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Sleep Cycle","d":["1 complete progression through the sleep stages. Longer in adults.","• 1 → 2 → 3 → 4 → REM → (repeat), with REM getting longer and longer."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Circadian Rhythms","d":["~24 hour cycle that controls waking + sleeping. Affected by light. Pineal gland, melatonin."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Melatonin and Sleep","d":["Circadian Rhythm; melatonin levels are higher in the evening when light decreases, and helps us feel sleepy."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Cortisol and Sleep","d":["Circadian Rhythm; cortisol levels are higher when we are awake, and helps us feel awake."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Corticotropin-releasing Factor (CRF)","d":["Released from hypothalamus in response to increasing light."],"lo":1},{"ch":4,"sec":"4.3 Consciousness","term":"Adrenocorticotropic Hormone (ACTH)","d":["Released from anterior pituitary in response to CRF. Stimulates cortisol release."],"lo":1},{"ch":4,"sec":"4.3 Consciousness","term":"Dream Theories","d":["Explanations for why we dream.","• Activation-Synthesis Theory – Theorizes dreams are caused by widespread, random neural activity.","• Problem Solving Dream Theory – Theorizes dreams help people solve problems.","• Cognitive Process Dream Theory – Theorizes dreams are a natural continuation of regular thinking, but during sleep.","• Neurocognitive Models of Dreaming – Theorizes that dreams are normal brain activity during sleep. Combines physiology + psychology."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Dyssomnia","d":["General disorders that make it hard to sleep. Usually during NREM sleep.","• Insomnia – Hard to fall asleep or stay asleep.","• Narcolepsy – Can’t control when you fall asleep, sleep attacks.","• Cataplexy – REM-like loss of muscle control, during waking hours. Emotional onset.","• Sleep Paralysis – Inability to move when awake.","• Hypnagogic Hallucination – Hallucinations when going to sleep.","• Hypnopompic Hallucination – Hallucinations when waking up.","• Sleep Apnea – Breathing difficulties during sleep."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Parasomnias","d":["Disorder involving weird movement or behavior during sleep. Usually during NREM sleep.","• Night Terrors – Thrashing or anxiety during NREM / Slow Wave Sleep. Hard to wake.","• Sleep Walking / Sommambulism – Walking or actions during NREM / Slow Wave Sleep."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Hypnosis","d":["A state where someone has control over their body, but listens to suggestions."],"lo":0},{"ch":4,"sec":"4.3 Consciousness","term":"Hypnotic Induction","d":["Induction into hypnosis."],"lo":1},{"ch":4,"sec":"4.3 Consciousness","term":"Meditation","d":["Quieting of mind for some purpose. Can decrease stress, HR, BP. Resembles Stage 1 / NREM1 sleep, with theta + slow alpha waves."],"lo":0},{"ch":4,"sec":"4.4 Consciousness-Altering Drugs","term":"Depressants","d":["Downers. Reduce nervous system activity. Alcohol, sedatives.","• GABA is the main inhibitory neurotransmitter. Cl– hyperpolarization.","• Alcohol – Depressant. Increases GABA receptors to cause hyperpolarizations, resulting in diminished arousal + disinhibition + euphoria.","• Alcohol Myopia – Alcohol-induced inability to recognize consequences of actions.","• Wernicke-Korsakoff Syndrome – Thiamine (B1) deficiency caused by alcoholism. Memory impairment + loss of motor skills + mental status changes.","• Sedatives – Depressants of CNS. Calm, relaxation. Increase GABA receptor activity.","• Barbiturates – Old anxiety-reducing sedative, more prone to overdose.","• Benzodiazepines – New anxiety-reducing sedative, less prone to overdose."],"lo":0},{"ch":4,"sec":"4.4 Consciousness-Altering Drugs","term":"Stimulants","d":["Uppers. Increase nervous system activity.","• Amphetamine – Stimulant that increases dopamine, norepinephrine, serotonin release.","• Cocaine – Stimulant that decreases dopamine, norepinephrine, serotonin reuptake. Used for anesthesia + vasoconstriction in surgery.","• Crack – Cocaine that can be smoked.","• Ecstasy / MDMA – Hallucinogen + Amphetamine (Stimulant). Uppers."],"lo":0},{"ch":4,"sec":"4.4 Consciousness-Altering Drugs","term":"Opium","d":["Painkiller downer drug, acting as endorphin agonists on PNS/CNS opioid receptors.","• Opiates – Natural opium. Morphine, Codeine.","• Opioids – Opiate derivatives, maybe synthetic. Oxycodone, Hydrocodone, Heroin.","• Heroin – Opioid that gets metabolized into morphine.","• Methadone – Long acting opioid, used to help opioid addiction recovery."],"lo":0},{"ch":4,"sec":"4.4 Consciousness-Altering Drugs","term":"Hallucinogen","d":["Perception altering drugs with upper-like symptoms. Theorized to interact with neurotransmitters like serotonin.","• Lysergic Acid Diethylamide (LSD) – Hallucinogen."],"lo":0},{"ch":4,"sec":"4.4 Consciousness-Altering Drugs","term":"Marijuana","d":["Drug with downer-like symptoms. Active chemical is tetrahydrocannabinol (THC), which increases dopamine, decreases GABA."],"lo":0},{"ch":4,"sec":"4.4 Consciousness-Altering Drugs","term":"Mesolimbic Reward Pathway","d":["1 of 4 dopaminergic pathways. Associated with drugs, gambling, love.","• Nucleus Accumbens (NAc)","• Medial Forebrain Bundle (MFB)","• Ventral Tegmental Area (VTA)"],"lo":0},{"ch":4,"sec":"4.5 Attention","term":"Attention","d":["Concentrate on 1 aspect of a sensory environment."],"lo":0},{"ch":4,"sec":"4.5 Attention","term":"Sensorium","d":["Total sensory input available to the consciousness in a given moment."],"lo":1},{"ch":4,"sec":"4.5 Attention","term":"Selective Attention","d":["Focusing on 1 part of the sensorium, ignoring the rest."],"lo":0},{"ch":4,"sec":"4.5 Attention","term":"Cocktail Party Phenomenon","d":["Ability to focus on 1 conversation while ignoring other stimuli, but still being able to recognize your name being spoken elsewhere."],"lo":0},{"ch":4,"sec":"4.5 Attention","term":"Dichotic Listening Tests","d":["Tests selective attention by using auditory stimuli in both ears. May involve shadowing."],"lo":1},{"ch":4,"sec":"4.5 Attention","term":"Shadowing","d":["Repeating a message you heard."],"lo":1},{"ch":4,"sec":"4.5 Attention","term":"Divided Attention","d":["Ability to perform multiple tasks simultaneously, usually involving automatic processing rather than controlled processing."],"lo":0},{"ch":4,"sec":"4.6 Language","term":"5 Components of Language","d":["Phonology, Morphology, Semantics, Syntax, Pragmatics (PMSSP)","• Phonology – Sound of a language.","• Phonemes – Speech sound.","• Categorical Perception – Distinguishing of similar-sounding phonemes.","• Morphology – Structure of words.","• Morphemes – Building blocks of words. Prefixes, suffixes.","• Semantics – Association of meaning with a word.","• Syntax – How words are put together into sentences, word order.","• Pragmatics – Dependence of a language on context. Stranger vs friend.","• Prosody – Tone of voice."],"lo":0},{"ch":4,"sec":"4.6 Language","term":"Language Development","d":["• 12 Months – First words","• 18 Months – Naming Explosion","• 18m - 20m – Word combining","• 2/3 Years – Sentences","• Babbling – Precursor to language. Meaningless speech.","• Naming Explosion – At ~18 months, children learn dozens of words.","• Overextension – During naming explosion, children incorrectly use a word too broadly to describe a similar thing.","• Errors of Growth – Grammatical error during a child’s language development."],"lo":0},{"ch":4,"sec":"4.6 Language","term":"Language Acquisition Theories","d":["How children learn language.","• Nativist / Biological Theory – Noam Chomsky. Humans have a biological predisposition to learning language.","• Transformational Grammar – The same idea can be expressed in different grammatical forms.","• Language Acquisition Device (LAD) – Theoretical brain pathway in babies that gives them innate language learning abilities.","• Learning / Behaviorist Theory – BF Skinner. Humans learn language like they learn everything else, it’s not particularly innate. Operant conditioning + reinforcement.","• Social Interactionist Theory – Humans language acquisition is driven by the desire to communicate and be social."],"lo":0},{"ch":4,"sec":"4.6 Language","term":"Critical Period","d":["Language can only be learned from 2-13 years."],"lo":0},{"ch":4,"sec":"4.6 Language","term":"Sensitive Period","d":["Language is best learned from 2-13 years."],"lo":1},{"ch":4,"sec":"4.6 Language","term":"Linguistic Relativity / Whorfian Hypothesis","d":["Our perception of reality is determined by language."],"lo":0},{"ch":4,"sec":"4.6 Language","term":"Arcuate Fasciculus","d":["Bundle of axons that connect Broca’s Area + Wernicke’s Area."],"lo":0},{"ch":4,"sec":"4.6 Language","term":"Aphasia","d":["Impairment of language production or comprehension.","• Broca’s / Expressive Aphasia – Impaired speech production.","• Wernicke’s / Receptive Aphasia – Impaired speech comprehension.","• Conduction Aphasia – You cannot repeat what was just said, but you can understand and independently say it. Damaged arcuate fasciculus."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Motivation","d":["Driving force behind actions."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Appetite","d":["Desire to fulfill a physical need."],"lo":1},{"ch":5,"sec":"5.1 Motivation","term":"Extrinsic Motivation","d":["Motivation to get a reward or avoid a punishment."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Intrinsic Motivation","d":["Motivation to do something for its inherent satisfaction."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Instincts","d":["Innate patterns of behavior. Primitive reflexes."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Theories of Motivation","d":["Explanations for what drives behavior.","• Instinct Theory – Behavior is motivated by innate instinct.","• Arousal Theory – Behavior is motivated by the desire to maintain a level of arousal.","• Drive Reduction Theory – We are motivated to do things that eliminate the state of discomfort/tension.","• Incentive Theory – Behavior is motivated by rewards and punishment (extrinsic motivation), not intrinsic motivation.","• Expectancy-Value Theory – Motivation depends on how much you believe you can succeed (expectancy) + value of the task (value).","• Opponent-Process Theory – The brain automatically creates an opposite emotion to balance any strong emotion you feel. The opposite emotion lasts longer, which leads to tolerance + addiction + withdrawals."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Arousal","d":["Psychological + Physiological state of being awake and reacting to stimuli."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Yerkes-Dodson Law","d":["Bell-shaped curve describing arousal, performance. Performance is best when arousal is not too low or too high, and instead in the middle. Counterintuitively, simple tasks require more arousal than complex tasks."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Drives","d":["State of discomfort/tension that motivates behavior.","• Primary Drives – Drives that motivate us to sustain our bodies.","• Secondary Drives – Drives that motivate behavior separate from basic biological needs."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Homeostasis","d":["Usually controlled by negative feedback loop."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Needs","d":["Long-lasting feelings that require relief, and tend to drive behavior.","• Primary Needs – Biological needs of food, water, sleep, shelter.","• Secondary Needs – Mental states or desires."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Maslow’s Hierarchy of Needs","d":["Hierarchy of needs, segregated into 5 groups.","• Physiological","• Safety","• Love/Belonging","• Esteem","• Self-Actualization – Maslow’s Hierarchy; the need to realize your full potential."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Self-determination Theory (SDT)","d":["You feel most intrinsically motivated when 3 needs are met. Autonomy, Competence, Relatedness.","• Autonomy – SDT; the need to be in control of your actions or ideas.","• Competence – SDT; the need to feel capable.","• Relatedness – SDT; the need for relationships."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Tolerance","d":["Decreased in perceived drug effect over time."],"lo":0},{"ch":5,"sec":"5.1 Motivation","term":"Sexual Motivation","d":["Hormone concentration is strongly correlated with sexual desire."],"lo":1},{"ch":5,"sec":"5.2 Emotion","term":"3 Elements of Emotion","d":["Physiological + Behavioral + Cognitive Response","• Physiological Response – 3 elements of emotion; heart rate + breathing, etc. Autonomic nervous system.","• Behavioral Response – 3 elements of emotion; facial expressions + body language.","• Cognitive Response – 3 elements of emotion; subjective thoughts."],"lo":0},{"ch":5,"sec":"5.2 Emotion","term":"7 Universal Emotions","d":["Happiness, Sadness, Contempt, Surprise, Fear, Disgust, Anger"],"lo":0},{"ch":5,"sec":"5.2 Emotion","term":"Facial-Feedback Effect / Hypothesis","d":["Your facial expressions can affect how you feel. Weak and strong versions."],"lo":0},{"ch":5,"sec":"5.2 Emotion","term":"Evolutionary Perspective","d":["Emotions are a product of evolution via natural selection."],"lo":1},{"ch":5,"sec":"5.2 Emotion","term":"Theories of Emotion","d":["How physiology, cognition, and feeling relate.","• James-Lange Theory of Emotion – Nervous system arousal, then conscious emotion, then action.","• Cannon-Bard Theory of Emotion – Nervous system arousal and conscious emotion, then action.","• Schachter-Singer / Cognitive Arousal / 2 Factor / Theory of Emotion – Nervous system arousal, then cognitive appraisal of that arousal, then conscious emotion."],"lo":0},{"ch":5,"sec":"5.2 Emotion","term":"Limbic System","d":["Forebrain structures involved in emotion + memory. Underneath cerebrum, on both sides of thalamus. Amygdala + Thalamus + Hypothalamus + Hippocampus + Fornix + Septal Nuclei + Parts of Cerebral Cortex.","• Amygdala – Processes the environment and stimuli + Signals to the cortex. Fear (aggressive + defensive), facial expressions.","• Emotional Memory – Implicit memories storing the emotions about an event, usually in the amygdala. Explicit memories storing the actual events themselves are hippocampus-related.","• Thalamus – Forebrain structure that relays signals from the rest of the body. No smell.","• Hypothalamus – Forebrain structure for homeostasis (metabolism, temperature, water). Turns emotions into physiological response via hormone release.","• Hippocampus – Stores short term → long term explicit memories. Contextualizes emotions."],"lo":0},{"ch":5,"sec":"5.2 Emotion","term":"Prefrontal Cortex","d":["Frontal lobe, supervises other brain regions. Decision-making and impulse control. Association area.","• Dorsal Prefrontal Cortex – Attention + Cognition.","• Ventral Prefrontal Cortex – Emotion experiencing.","• Ventromedial Prefrontal Cortex – Decision-making, controls amygdala’s emotions by reducing/increasing its signal to the rest of the cortex."],"lo":0},{"ch":5,"sec":"5.3 Stress","term":"Cognitive Appraisal","d":["Subjective appraisal of a stress-inducing situation.","• Primary Appraisal – Appraisal of the environment and possible threat.","• Secondary Appraisal – Appraisal of your ability to handle the threat.","• Harm – Damage caused by the threat.","• Threat – Potential future damage caused by the threat.","• Challenge – Possibility of overcoming the threat."],"lo":0},{"ch":5,"sec":"5.3 Stress","term":"Reappraisal","d":["Cognitive appraisal that happens after an initial appraisal."],"lo":1},{"ch":5,"sec":"5.3 Stress","term":"Stressor","d":["Anything that causes a stress response. Ranges from environmental factors to social expectations.","• Distress – When a stressor is perceived as negative, a threat. A school shooter.","• Eustress – When a stressor is perceived as positive, a challenge. Getting married."],"lo":0},{"ch":5,"sec":"5.3 Stress","term":"Social Readjustment Rating Scale","d":["A scale measuring stress."],"lo":1},{"ch":5,"sec":"5.3 Stress","term":"General Adaptation Syndrome","d":["Hans Selye. The body’s 3 stage response to a stressor.","• Alarm – Initial reaction to a stressor. Activated sympathetic nervous system, ACTH + Cortisol + Epinephrine + Norepinephrine.","• Resistance – Continuous release of hormones (cortisol) to maintain an elevated stress response. May include SNS. Can be short, but also very long during chronic stress.","• Exhaustion – The body can no longer maintain the elevated sympathetic nervous system response. Vulnerability."],"lo":0},{"ch":5,"sec":"5.3 Stress","term":"Diathesis-Stress Model","d":["Psychological disorders come from genetic predisposition (diathesis) and stressors (stress). Schizophrenia, depression."],"lo":0},{"ch":5,"sec":"5.3 Stress","term":"Coping","d":["Can be good (exercise, breathing, spiritual) or bad (drugs, alcohol)."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Self-Concept","d":["The way you see yourself"],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Self-Schema","d":["A specific label you give to yourself."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Identity","d":["The components of your self-concept, related to the groups you belong to."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Gender Identity","d":["The way you see yourself on a masculinity/feminity scale."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Androgyny","d":["To be both highly masculine + highly feminine."],"lo":1},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Undifferentiated","d":["To be neither masculine + feminine."],"lo":1},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Theory of Gender Schema","d":["Brain creates male and female schema, and forces everything to fit in those 2. Persistence of gender roles."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Ethnic Identity","d":["Part of your identity associated with your membership to an ethnic group."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Nationality","d":["One’s legal and political membership to a nation."],"lo":1},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Hierarchy of Salience","d":["The ranking of identities making up your self-concept, based on probability of invocation."],"lo":1},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Self-Identification","d":["Your ability to recognize yourself."],"lo":1},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Self-Discrepancy Theory","d":["Humans have 3 selves. Differences between these selves lead to negative feelings.","• Actual Self – The kind of person you think you are.","• Ideal Self – The kind of person you want to be.","• Ought Self – The kind of person you believe you should be."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Self-Esteem","d":["How much you think of yourself. Less differences in the 3 selves lead to higher self-esteem."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Self-Efficacy","d":["How much you believe in your ability to succeed."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Learned Helplessness","d":["A perceived lack of control over an outcome. Related to clinical depression."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Locus of Control","d":["How much control one believes they have over their life. Internal means you believe you control your fate."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Social Comparison Theory","d":["Individuals evaluate themselves by comparison to others.","• Upward Social Comparison – Individuals compare themselves to people they see as better.","• Lateral Social Comparison – Individuals compare themselves to people they see as similar.","• Downward Social Comparison – Individuals compare themselves to people they see as worse."],"lo":0},{"ch":6,"sec":"6.1 Self Concept and Identity","term":"Metacognition","d":["The awareness of your own thoughts and emotions. Thinking about thinking."],"lo":0},{"ch":6,"sec":"6.2 Formation of Identity","term":"Libido","d":["Sex drive."],"lo":1},{"ch":6,"sec":"6.2 Formation of Identity","term":"Fixation","d":["One becomes psychologically stuck at a psychosexual stage due to under- or overgratification."],"lo":0},{"ch":6,"sec":"6.2 Formation of Identity","term":"Neurosis","d":["Mental stress or disorder usually resulting from fixation. Carries into adulthood."],"lo":1},{"ch":6,"sec":"6.2 Formation of Identity","term":"Freud Psychosexual Development","d":["• Oral Stage – 0-1 years. Gratification comes from the mouth, sucking and biting.","• Anal Stage – 1-3 years. Gratification comes from pooping and pissing correctly.","• Phallic / Oedipal Stage – 3-5 years. Oedipal and Electra conflict. Penis envy.","• Oedipal Conflict – Male child envies father’s relationship with mother. Resolved when the child identifies with his father.","• Electra Conflict – Female child envies mother’s relationship with father. Resolved when the child identifies with his mother.","• Sublimates – One turns unacceptable impulses into productive activities. Healthy defense mechanism.","• Penis Envy – Female child envies that male children have penises.","• Latency Stage – 6 years-puberty. Social skills, learning, friendships, etc.","• Genital Stage – Puberty onwards. Development of sexual/romantic relationships."],"lo":0},{"ch":6,"sec":"6.2 Formation of Identity","term":"Erikson’s Theory of Psychosocial Development","d":["Personality develops from the resolution of specific conflicts.","• Trust vs Mistrust – 0-1 year. Baby decides to trust or not trust their caretaker. Can I trust the world?","• Autonomy vs Shame/Doubt – 1-3 years. Child learn independence, which will lead to either autonomy or shame/doubt. Is it okay to be me?","• Initiative vs Guilt – 3-6 years. Child learns to take initiative, play, explore. Is it okay for me to do certain things?","• Industry vs Inferiority – 6-12 years. Child learns competence, working hard, achievement. Can I make it in the world?","• Identity vs Role Confusion – 12-18 years. Teenager forms identity. Who am I and what can I be?","• Intimacy vs Isolation – 18-40. Adult learns loving or romantic relationships. Can I love?","• Generativity vs Stagnation – 40-65 years. Adult contributes to society, raises kids. Can I make my life count?","• Integrity vs Despair – 65+ years. Adult looks back on their life. Is it okay to have been me?"],"lo":0},{"ch":6,"sec":"6.2 Formation of Identity","term":"Kohlberg’s Theory of Moral Reasoning","d":["People progress through 3 levels of moral thinking, each with 2 levels.","• Preconventional Morality – Kohlberg’s Theory; preadolescent thinking emphasizing consequences.","• Obedience – Preconventional; avoid punishment.","• Self-Interest / Instrumental Relativist Stage – Preconventional; gain rewards.","• Conventional Morality – Kohlberg’s Theory; adolescent and adult thinking emphasizing relationship to others.","• Conformity – Conventional; seek approval of others.","• Law and Order – Conventional; maintain social order.","• Postconventional Morality – Kohlberg’s Theory; adult thinking not everyone is capable of, emphasizing morals.","• Social Contract – Postconventional; greater good and individual rights.","• Universal Human Ethics – Postconventional; abstract principles."],"lo":0},{"ch":6,"sec":"6.2 Formation of Identity","term":"Role-Taking","d":["Ability to understand the perspective of someone else."],"lo":1},{"ch":6,"sec":"6.2 Formation of Identity","term":"Theory of Mind","d":["Ability to understand that other people have their own thoughts and emotions, etc."],"lo":0},{"ch":6,"sec":"6.2 Formation of Identity","term":"Looking-Glass Self","d":["We develop our own image based on how we think other people view us."],"lo":0},{"ch":6,"sec":"6.2 Formation of Identity","term":"Reference Group","d":["A group we use as a standard to compare ourselves to."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Personality","d":["Relatively stable set of feelings, thoughts, traits, behaviors that are characteristic of an individual. Theories of personality can be divided into 4.","• Psychoanalytic / Psychodynamic","• Humanistic / Phenomenological","• Type and Trait","• Behaviorist"],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Psychoanalytic / Psychodynamic Theories of Personality","d":["4 theories of personality; assume internal states that determine personality. Freud."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Freud’s Structural Model of the Mind","d":["The mind consists of 3 entities: Id, Ego, Superego.","• Id – Primal part of the mind; urge to survive and reproduce. Freud.","• Pleasure Principle – Achieving immediate gratification to relieve pent-up tension.","• Primary Process – Id makes one act in a way to achieve immediate gratification, as described by the pleasure principle.","• Wish Fulfillment – Mental imagery relieves tension, and gives immediate gratification. Dreams, fantasy.","• Ego – Logical part of the mind; moderates conflict between id’s desire and superego’s moral.","• Reality Principle – Delay gratification to achieve things in a realistic, acceptable way.","• Secondary Process – Ego makes one act logically and plan to achieve delayed gratification, as described by the reality principle.","• Superego – Perfectionist part of the mind; judges actions according to an ideal moral standard.","• Conscience – Superego part that makes one feel guilty for doing something wrong.","• Ego-Ideal – Superego part that makes one feel pride for meeting some ideal standard."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Freud's Levels of Consciousness","d":["Topographic model of the mind.","• Conscious – Thoughts we have conscious access to.","• Preconscious – Thoughts we aren’t aware of.","• Unconscious – Thoughts we have repressed."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Instinct (Freud)","d":["Innate psychological representation of a biological need.","• Eros – Instincts that promote life, like eating and drinking.","• Thanatos – Death instincts, unconscious wish for death. Trauma victims reenacting."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Defense Mechanism","d":["Ego’s way to relieve the inherent anxiety caused by the clash between superego and id. All of them (1) distort reality (2) operate unconsciously.","• Repression – Defense mechanism; ego unconsciously blocks undesired thoughts/urges.","• Suppression – Defense mechanism*; ego consciously blocks undesired thoughts/urges.","• Regression – Defense mechanism; reversion to an earlier developmental stage.","• Reaction Formation – Defense mechanism; ego unconsciously suppresses an urge by producing the opposite urge. Celebrity hate.","• Projection – Defense mechanism; project own feelings onto others.","• Rorschach Inkblot Test – Interpret inkblot, which reveals unconscious feelings hidden by projection.","• Thematic Apperception Test – Show someone pictures, and ask them to make up a story. Theorized to reveal unconscious feelings.","• Rationalization – Defense mechanism; justify an unacceptable thought with a logical-sounding excuse.","• Displacement – Defense mechanism; redirect emotions/urges from the original thing to another thing, usually safer.","• Sublimation – Defense mechanism; transform unacceptable urges into acceptable behaviors."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Jung’s Ego","d":["Jung defined ego as the conscious mind.","• Personal Unconscious – Unconscious of one person.","• Collective Unconscious – Collective unconscious of humanity, early ancestors."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Archetypes","d":["Universal symbols or themes that exist in the collective unconscious.","• Persona – Archetype; part of our personality we present to the world.","• Anima / Animus – Archetype; gender-inappropriate parts of our personality. Man’s inner woman + Woman’s inner man.","• Shadow – Archetype; responsible for unconscious bad thoughts."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Self","d":["Intersection between conscious, personal unconscious, collective unconscious. Strives for unity."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Word Association Testing","d":["Say the first word that comes to mind after hearing a word. Theorized to reveal parts of the unconscious.","Jung’s Dichotomies of Personality.","• Extraversion vs Introversion – Jung’s dichotomies of personality; orientation to the outer (E) vs inner world (I).","• Sensing vs Intuiting – Jung’s dichotomies of personality; working with info objectively (S) vs abstractly (I).","• Thinking vs Feeling – Jung’s dichotomies of personality; using logic (T) vs personal beliefs (F)."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Myers-Briggs Type Inventory (MBTI)","d":["Personality test, partly built from Jung’s dichotomies of personality. Type theory.","• Judging vs Perceiving – Preference of order (J) vs spontaneity (P)."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Inferiority Complex","d":["Alfred Adler. One’s sense of incompleteness or inferiority, which drives personality."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Creative Self","d":["Adler; people actively create their own, unique personalities."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Style of Life","d":["Adler; the unique way/pattern someone approaches life."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Fictional Finalism","d":["Adler; people are more motivated by their expectations for the future than the past."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Neurotic Needs","d":["Karen Horney; an excessive need directed towards reducing negative feelings, and making life better, coping. Consist of (1) moving towards (2) moving against (3) moving away from people."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Basic Anxiety","d":["Horney; vulnerability caused by inadequate caretaking."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Basic Hostility","d":["Horney; anger caused by rejection or neglect."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Object Relations Theory","d":["Early relationships with caretakers influence future social interactions."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Humanistic / Phenomenological Theorists","d":["Focus on the value of individuals, person-centered.","• Gestalt Therapy – Focuses on the complete (holistic) person, rather than reducing them to individual behaviors.","• Force Field Theory – Kurt Lewin; the current state of one’s mind is the sum of opposing forces/influences acting on them.","• Peak Experience – Maslow; profoundly moving experiences that have important, long-lasting effects on an individual.","• Personal Construct Psychology – George Kelly; an individual acts like a scientist by creating theories + constructs to predict the behavior of others.","• Client-Centered / Person-Centered / Nondirective Therapy – Carl Rogers; therapy model where client guides conversation, and has more autonomy.","• Unconditional Positive Regard – Rogers; therapy technique where therapists completely accept the client to make a positive environment."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Type Theorists","d":["Separate people into personality types.","• Humors – Body fluids. Greeks believed an imbalance led to personality disorders.","• Somatotypes – William Sheldon; personalities based on body types. Short stocky people are jolly, tall people are aloof.","• Type A – Personality that is competitive and compulsive.","• Type B – Personality that is laid-back and relaxed."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Trait Theorists","d":["Personality is the sum of someone’s individual behaviors."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Traits","d":["Hans, Sybil Eysenck; Groups of behaviors that usually occur together. Organized desk, schedule keeping, etc. fit in the trait of conscientiousness."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"PEN Model","d":["Hans, Sybil Eysenck; trait theory that divides personality into 3 parts.","• Psychoticism – PEN Model; measure of non-conformity + lack of empathy.","• Extraversion – PEN Model; measure of social tolerance/stimulation.","• Neuroticism – PEN Model; measure of emotional arousal during high stress situations.","• Negative Affect – One’s tendency to experience negative emotions. Related to neuroticism."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"5 Factor Model / Big 5","d":["Updated PEN Model.","• Extraversion","• Neuroticism","• Openness – Big 5; willingness to engage, try new things.","• Conscientiousness – Big 5; self and impulse control.","• Agreeableness – Big 5; concern with maintaining harmony in social interactions."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Gordon Allport’s Traits","d":["• Cardinal Traits – Allport; the important traits people organize their lives around. Not everyone develops one.","• Central Traits – Allport; major traits of one’s personality.","• Secondary Traits – Allport; minor traits of one’s personality."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Functional Autonomy","d":["Allport; a behavior persists despite the satisfaction of the original drive. I used to eat bananas because I was constipated, but I still eat them because I like them."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"N-Ach","d":["McClelland; Trait characterized by the Need for ACHievement. Desire to master hard things."],"lo":1},{"ch":6,"sec":"6.3 Personality","term":"Behaviorist Perspective","d":["BF Skinner; personality is merely behaviors that have been reinforced by operant conditioning.","• Token Economies – Behaviorist therapeutic system, where desired behaviors are reinforced with tokens. Operant conditioning."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Social Cognitive Perspective","d":["Albert Bandura; personality is both environment influencing behavior (behaviorist) + behavior influencing environment.","• Reciprocal Determinism – Bandura; one’s thoughts, behaviors, and environment interact to shape personality."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Biological Perspective","d":["Personality is a result of gene expression in the brain. Related to trait theorists / perspective; traits are a result of specific genes or differences."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Dispositional Approach","d":["Behavior is determined by personality."],"lo":0},{"ch":6,"sec":"6.3 Personality","term":"Situational Approach","d":["Behavior is determined by environment and context."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Maladaptive","d":["An aspect of one’s behavior that prevents them from functioning effectively."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Biomedical Approach","d":["Views psychological disorders as a medical disease. Focuses on symptom reduction."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Biopsychosocial Approach","d":["Psychological + Biological + Social components to a psychological disorder.","• Direct Therapy – Treatment that acts directly on the individual.","• Indirect Therapy – Treatment that empowers family/friends of the individual."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Diagnostic and Statistical Manual of Mental Disorders (DSM)","d":["Categorizes psychological disorders by symptoms, to help clinicians. DSM-5."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Psychopharmacology","d":["Treatment involving use of medication."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Psychotherapy","d":["Treatment involving a trained therapist.","• Talk Therapy – Psychotherapy involving conversation.","• Behavioral Therapy – Psychotherapy aiming to modify behavior."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Cognitive Behavioral Therapy (CBT)","d":["Therapy with both talk + behavioral components. Aims to change maladaptive thoughts (cognitive) to change maladaptive behavior (behavioral)."],"lo":0},{"ch":7,"sec":"7.1 Understanding Psychological Disorders","term":"Systematic Desensitization","d":["Gradual exposure to a phobia to desensitize them. Classical conditioning."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Psychotic Disorders","d":["(DSM) Symptoms include delusions, hallucinations, disorganized thought/behavior, catatonia, negative symptoms. Spectrum.","• Delusion Disorder – Psychotic disorder; delusions for at least a month.","• Brief Psychotic Disorder – Psychotic disorder; positive psychotic symptoms for at least a day, under 1 month.","• Schizophreniform Disorder – Psychotic disorder; schizophrenia symptoms for at least 1 month, under 6 months.","• Schizoaffective Disorder – Psychotic disorder; major mood episodes with psychotic symptoms."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Positive Symptoms","d":["Behaviors or thoughts (symptoms) added to normal behavior.","• Delusion – Beliefs not in-line with reality, or not shared by others. Maintained despite contrary evidence","• Delusion of Reference – Belief that common or neutral environmental cues are directed towards them. TV people are talking to me.","• Delusions of Persecution – Belief that one is being deliberately interfered, threatened, or discriminated against.","• Delusions of Grandeur – Belief that one is remarkable in some significant way.","• Thought Broadcasting – Belief that one’s thoughts are broadcasted to the world.","• Thought Withdrawal – Belief that one’s thoughts are being removed.","• Thought Insertion – Belief that thoughts are being inserted into one’s head.","• Hallucination – Perceptions that occur without external stimuli.","• Disorganized Thought – Associations fall apart due to mental disorder. No train of thought, word salad.","• Neologism – New words created by people with schizophrenia.","• Disorganized Behavior – Inability to carry out daily activities due to mental disorder.","• Catatonia – Motor behaviors characteristic of schizophrenia.","• Echolalia – Repeating another’s words for no reason, mental disorder.","• Echopraxia – Imitating another’s actions for no reason, mental disorder."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Negative Symptoms","d":["Behaviors or thoughts missing from normal behavior.","• Affect – Outward expression of your internal mood/emotion.","• Blunting – Reduction of affect expression.","• Emotional Flattening / Flat Effect – No signs of affect expression.","• Inappropriate Affect – Mismatch of affect expression, inappropriate.","• Avolition – Decreased engagement in goal-oriented actions."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Schizophrenia","d":["Classic psychotic disorder. Disconnect between an individual and reality. 6 months, including 1 month of positive symptoms.","• Prodromal Phase – Schizophrenia; deterioration in cognitive, social functioning.","• Active Phase – Schizophrenia; psychotic symptoms are displayed.","• Residual / Recovery Phase – Schizophrenia; mental clarity which may result in depression, after the active phase."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Schizotypal Personality Disorder","d":["Psychotic disorder; psychotic symptoms + personality disorder."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Depressive Disorders","d":["Mental disorder, characterized by being sad. Symptoms are Sadness + SIG E CAPS.","• Sadness","• Sleep – Insomnia, Hypersomnia","• Interest – Anhedonia","• Guilt","• Energy – Lower","• Concentration – Lower","• Appetite – Lower or higher","• Psychomotor – Retardation, Agitation","• Suicidal","• Major Depressive Disorder (MDD) – Characterized by major depressive episodes.","◦ Major Depressive Episode – 2+ weeks with 5+ depressive disorder symptoms, 1 of which must be sadness or anhedonia. Interference of daily activities.","• Persistent Depressive Disorder (PDD) – Characterized by 2+ years of (majority) depressed mood.","◦ Dysthymia – Persistent Depressive Disorder (PDD).","• Disruptive Mood Dysregulation Disorder – Depressive disorder; persistent emotional irritability in multiple environments. Mostly ages 6-10.","• Premenstrual Dysphoric Disorder – Depressive disorder; mood swings before menstruation, resolves after menstruation.","• Seasonal Affective Disorder (SAD) – Depressive disorder; depressive symptoms caused by dark winter months. Essentially MDD with seasonal onset.","◦ Bright Light Therapy – Expose a pt with SAD to bright light, a specific amount of time.","• Postpartum Depression – Depressive disorder; depressive symptoms caused by hormonal levels post pregnancy."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Bipolar and Related Disorder","d":["Mental disorder characterized by severe mood fluctuations.","• Hypomanic Episode – 4+ days with 3+ manic symptoms.","• Manic Episode – 7+ days with 3+ manic symptoms, which impair social or work activities.","• Bipolar 1 Disorder – Characterized by manic episodes, and sometimes but not always depressive episodes.","• Bipolar 2 Disorder – Characterized by both depressive + hypomanic episodes.","• Cyclothymic Disorder – Characterized by hypomanic + depressive symptoms not severe enough to be called episodes, over the majority of 2 years."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Manic Symptoms","d":["Exaggerated elevation in mood, energy, activity. DIG FAST.","• Distractibility","• Irresponsibility","• Activity / Agitation","• Sleep – Less","• Talkative","• Grandiosity – Unrealistic increase in self-esteem.","• Flight of Thoughts – Racing thoughts, rapid speech."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Monoamine / Catecholamine Theory of Depression","d":["Too much norepinephrine + serotonin leads to mania, too little leads to depression."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Anxiety Disorder","d":["Mental disorder characterized by excessive fear that interferes with daily life.","• Specific Phobia – Phobia of a specific thing, like spiders.","• Separation Anxiety Disorder – Excessive fear of separation from a caregiver or home, persisting beyond normal.","• Social Anxiety Disorder – Excessive fear of social situations and possible humiliation, negative perception. 6+ months of symptoms.","• Selective Mutism – Anxiety disorder; consistent inability to speak when speaking is expected.","• Panic Disorder – Anxiety disorder; recurring, unexpected panic attacks.","◦ Panic Attack – Sudden surge of fear accompanied by physiological + cognitive symptoms, like fear. Not a psychological disorder. (Expected Panic Attack – Panic attacks usually occurring due to a trigger.; Unexpected Panic Attack – Panic attacks occurring at random.)","• Agoraphobia – Anxiety disorder; fear of being in places or situations hard to escape from.","• Generalized Anxiety Disorder (GAD) – Anxiety disorder about many different things for 6+ months. Common."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Anxiety","d":["Fear of an upcoming or future event, sometimes healthy."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Phobia","d":["Most common anxiety disorder; irrational fear of something."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Obsessive-Compulsive Disorder (OCD)","d":["Mental disorder characterized by compulsions and obsessions that feed off each other.","• Obsession – Persistent, intrusive thoughts.","• Compulsion – Repetitive tasks that relieve tension, but may cause impairment."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Body Dysmorphic Disorder","d":["OCD-related disorder; unrealistic negative perception of one’s body.","• Muscle Dysmorphia –","• Preoccupation – Continuous mindset stuck on something, usually your body."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Hoarding Disorder","d":["OCD-related disorder."],"lo":1},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Trichotillomania","d":["OCD-related disorder; compulsion to pull hair out."],"lo":1},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Excoriation Disorder","d":["OCD-related disorder; compulsion to pick at skin."],"lo":1},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Posttraumatic Stress Disorder (PTSD)","d":["1+ month of symptoms.","• Intrusion Symptoms – PTSD; recurring reliving of the trauma.","• Arousal Symptoms – PTSD; irritability, anxiety, self-destructive, sleep disturbance.","• Avoidance Symptoms – PTSD; avoid anything related to the trauma.","• Negative Cognitive Symptoms – PTSD; forget traumatic memories, negative feelings."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Acute Stress Disorder","d":["PTSD symptoms for 3+ days, but less than 1 month."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Dissociative Disorder","d":["Mental disorder, where one escapes stress by dissociating from their identity, memories, or consciousness.","• Dissociative Amnesia – Dissociative disorder; dissociation from memories, usually due to trauma.","◦ Dissociative Fugue – Condition related to dissociative amnesia. Sudden travel away from home + Identity confusion. May assume a new identity.","• Dissociative Identity Disorder (DID) – Dissociative disorder; 2+ personalities that take control of one’s behavior + memory gaps. Two-face.","• Depersonalization / Derealization Disorder – Mental disorder where people feel detached from their mind/body or surroundings. Feeling of automation, cannot recognize your reflection.","◦ Depersonalization – One feels detached from their mind or body.","◦ Derealization – One feels detached from their surroundings."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Somatic Symptom & Related Disorders","d":["Physical symptoms causing major distress.","• Somatic Symptom Disorder – Mental disorder characterized by bodily (somatic) symptoms that cause stress or impairment.","• Illness Anxiety Disorder – Anxiety or somatic symptom-related disorder.","• Conversion / Functional Neurological Symptom Disorder – Somatic symptom-related disorder; physiological or neurological symptoms with no medical cause. Usually after high stress or trauma, like mom going blind.","◦ La Belle Indifference – Patient is unconcerned about conversion disorder symptoms."],"lo":0},{"ch":7,"sec":"7.2 Types of Psychological Disorders","term":"Personality Disorder","d":["Mental disorder; pattern of behavior that causes impairment in 2 of the following. Cognition + Emotions + Interpersonal Functioning + Impulse Control,","• Ego-Syntonic – Someone with a personality disorder sees their behavior as normal.","• Ego-Dystonic – Someone with a personality disorder sees their behavior as bad.","• General Personality Disorder – Personality disorder diagnosed when a patient meets the criteria, but doesn’t match any of the 10 defined ones.","• Cluster A Personality Disorder – 10 personality disorders; behavior labeled odd by others.","◦ Paranoid Personality Disorder – Cluster A; distrust or suspicion of others.","◦ Schizotypal Personality Disorder – Cluster A; eccentric thinking, superstition.","◦ Schizoid Personality Disorder – Cluster A; detachment of social relationships, restricted emotional expression.","• Cluster B Personality Disorder – 10 personality disorders; behavior labeled dramatic or erratic by others.","◦ Antisocial Personality Disorder – Cluster B; disregard and violation of other’s rights. More in men, serial killers.","◦ Borderline Personality Disorder – Cluster B; instability in relationships, fear of abandonment, self-harm.","◦ Splitting – Borderline personality disorder, everyone is either good or bad.","◦ Histrionic Personality Disorder – Cluster B; attention-seeking behavior.","◦ Narcissistic Personality Disorder – Cluster B; excessive self-importance, constant need for admiration or attention, entitlement. Fragile self-esteem.","• Cluster C Personality Disorder – 10 personality disorders; behavior labeled anxious or fearful by others.","◦ Avoidant Personality Disorder – Cluster C; extremely shy, fear of rejection.","◦ Dependent Personality Disorder – Cluster C; continuous need for reassurance, usually by a caretaker or significant other.","◦ Obsessive-Compulsive Personality Disorder (OCPD) – Cluster C; perfectionism and inflexibility. Unlike ego-dystonic OCD, OCPD is ego-syntonic."],"lo":0},{"ch":7,"sec":"7.3 Biological Basis of Nervous System Disorders","term":"Schizophrenia Basis","d":["• Dopamine-associated","• Hypoxemia at birth","• Marijuana during adolescence","• Inherited."],"lo":0},{"ch":7,"sec":"7.3 Biological Basis of Nervous System Disorders","term":"Neuroleptic / Antipsychotics","d":["Medications that depress (reduce) nerve function."],"lo":0},{"ch":7,"sec":"7.3 Biological Basis of Nervous System Disorders","term":"Depressive Disorder Basis","d":["• High glucose metabolism in amygdala","• Hippocampus atrophy or wasting after illness","• High cortisol","• Low norepinephrine, serotonin, dopamine via Monoamine Theory.","• Less neurotransmitter production, not more degradation"],"lo":0},{"ch":7,"sec":"7.3 Biological Basis of Nervous System Disorders","term":"Bipolar Disorder Basis","d":["• High norepinephrine, serotonin via Monoamine Theory","• Inherited","• Multiple Sclerosis"],"lo":0},{"ch":7,"sec":"7.3 Biological Basis of Nervous System Disorders","term":"Alzheimer’s Disease Symptoms","d":["• Diffuse brain atrophy in CT/MRI","• Flattened cerebral sulci","• Enlarged cerebral ventricles","• Less blood blow + metabolism in parietal lobes","• Less metabolism in temporal lobes","• Less ChAT / ACh levels","• ChAT – Choline Acetyltransferase, ACh creating enzyme.","• Neurofibrillary Tangles – Alzheimer’s; hyperphosphorylated tau-protein tangles.","• Beta-Amyloid Plaques – Alzheimer’s; beta-amyloid protein plaques."],"lo":0},{"ch":7,"sec":"7.3 Biological Basis of Nervous System Disorders","term":"Parkinson’s Disease Symptoms","d":["• Depression + Dementia is also common.","• Bradykinesia – Movement slowness.","• Resting Tremor – Tremor when muscles aren’t used.","• Pill-Rolling Tremor – Finger flexing + Thumb rolling.","• Masklike Facies – Static, blank facial features + Staring eyes + Open mouth.","• Cogwheel Rigidity – Muscle stiffness + Jerky resistance to examination","• Shuffling Gait – Shuffle walking while hunched over."],"lo":0},{"ch":7,"sec":"7.3 Biological Basis of Nervous System Disorders","term":"Parkinson’s Disease","d":["Less dopamine in substantia nigra leads to lost basal ganglia neurons.","• L-DOPA – Dopamine precursor that can treat Parkinson’s Disease."],"lo":0},{"ch":8,"sec":"","term":"Michelangelo Phenomenon","d":["Interdependent people sculpt each other to develop."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Social Action","d":["Actions or behaviors people do because other people are around."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Yerkes-Dodson Law of Social Facilitation","d":["Being around other people makes you better at familiar tasks, but worse at unfamiliar tasks."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Social Facilitation","d":["People perform simple or familiar tasks better when others are around."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Social Inhibition","d":["People perform complex or unfamiliar tasks worse when others are around."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Deindividuation","d":["Adoption of a group-oriented identity and loss of self-awareness in a group."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Antinormative Behavior","d":["Behavior against the norm, not socially acceptable."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Diffusion of Responsibility","d":["Someone else in the group will do it, so I don’t have to."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Bystander Effect","d":["You are less likely to help someone when other people are present."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Social Loafing","d":["Tendency of people to reduce effort when in a group."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Peers","d":["Individuals regarded as equals by someone."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Risky Behaviors","d":["Can be caused by stress, or peer pressure."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Identity Shift Effect","d":["Under the threat of social rejection, individuals tend to shift their identity to conform to the group."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Cognitive Dissonance","d":["Presence of 2 simultaneous but opposing thoughts, creating discomfort. Changing, adding, or minimizing 1 can relieve this."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Asch Conformity Experiments","d":["Solomon Asch, individuals are likely to conform to the group opinion."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Social Interaction","d":["Ways 2+ individuals influence each other’s behavior."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Group Polarization","d":["Individuals, when in a group, make more extreme decisions than they would when alone."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Choice Shift","d":["Groups collaboratively make more extreme decisions than the individual members of that group would."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Groupthink","d":["The desire for group harmony leads to poor decision-making, without looking at alternatives. 8 symptoms.","• Illusion of Invulnerability – Members encourage risks, too optimistic.","• Collective Rationalization – Members ignore expressed concerns of group-approved ideas, as to rationalize it.","• Illusion of Morality – Members believe group-approved ideas are moral.","• Excessive Stereotyping – Members stereotype outsiders or enemies.","• Pressure for Conformity – Members feel pressured to conform to the group-approved idea.","• Self-censorship – Members withhold ideas that go against the group-approved idea.","• Illusion of Unanimity – Members believe group-approved ideas to be unanimous.","• Mindguards – Members of a group intentionally filter out information that opposes the group-approved idea."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Fad","d":["Behavior viewed as cool by a large community. Trends."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Mass Hysteria","d":["Shared, intense fear of a threat to society. Salem Witch trials."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Culture","d":["Beliefs, behaviors, actions, characteristics of a group or society.","• Culture Shock –"],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Assimilation","d":["An individual or group’s behavior begins to resemble another group. Integration."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Ethnic Enclave","d":["Locations with a high concentration of one ethnicity. Chinatown."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Multiculturalism / Cultural diversity","d":["Communities with multiple cultures or ethnic groups."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Multicultural Socialization","d":["Encourages the learning of norms and behaviors of different cultures."],"lo":1},{"ch":8,"sec":"8.1 Group Psychology","term":"Subcultures","d":["Groups of people within a culture that distinguish themselves from that culture. Goths or Amish."],"lo":0},{"ch":8,"sec":"8.1 Group Psychology","term":"Counterculture","d":["When the subculture group is at odds with the main culture. Hippies, cults."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Socialization","d":["Process of developing, inheriting, and spreading norms, customs, beliefs.","• Primary Socialization – Childhood socialization, where we learn broadly acceptable behaviors and views, mainly through observation of adults.","• Secondary Socialization – Socialization; we learned acceptable behaviors and views within smaller groups, such as school, church, sports field.","• Anticipatory Socialization – Socialization; learn behaviors and views to prepare for future","• Resocialization – Socialization; we discard old behaviors and views, then adopt new ones. Army or cult."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Cultural Transmission / Learning","d":["Culture passed down from generation to generation within a culture."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Cultural Diffusion","d":["Spread of norms, customs, beliefs from one culture to another."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Norms","d":["Societal rules that define the boundaries of acceptable behavior. Laws, unwritten rules.","• Mores – Essential norms, core values of a society.","• Folkways – Norms that are considered polite or standard etiquette."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Social Control","d":["A society regulates and enforces norms.","• Sanctions – Rewards or punishments used to maintain norms and social control.","• Formal Sanctions – Official sanctions enforced by institutions. Jail time.","• Informal Sanctions – Unofficial sanctions enforced by social groups. Lunch table."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Agents of Socialization","d":["Any part of society important for learning social norms and values. Includes caregivers, environments, etc."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Popular Culture","d":["Common trends and beliefs at a given point in time, commonly influenced by media."],"lo":1},{"ch":8,"sec":"8.2 Socialization","term":"Deviance","d":["Violation of norms. Jaywalking, murder, etc.","• Taboo – A socially forbidden behavior.","• Social Stigma – Extreme dislike of a person or group based on deviations of norm(s)."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Theories of Deviance","d":["Explanations for why people break norms.","• Labeling Theory – Labels given to an individual affect how they are perceived, and may produce either deviance or conformity to the label.","• Role Engulfment – A single label or role engulfs an individual’s identity. Their main schtick.","• Differential Association Theory – Deviance can be learned from interactions with others, like criminal behavior. Common when deviant behavior interactions are the most numerous.","• Strain Theory – Deviance is a result of disconnect between social goals and social structure, which may not allow everyone to succeed. Thus individuals deviate from social structure in an attempt to achieve those goals."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Conformity / Majority Influence","d":["Matching one’s attitude, beliefs, behaviors to the norm.","• Normative Conformity – Conforming without belief in the norm.","• Internalization – Conforming out of genuine belief in the norm.","• Identification – Outwardly conforming to norms to fit into a group."],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Compliance","d":["Change in behavior based on a direct request from someone without actual authority over you.","• Foot-in-the-Door Technique – Compliance; ask for something small, then something big when they comply.","• Door-in-the-Face Technique – Compliance; ask for something big, then ask for something small. Often, the smaller request is the actual goal.","• Lowball Technique – Compliance; ask for a small commitment, then raise the cost after they’ve agreed.","• That’s-not-All Technique – Compliance; offer something, then add an extra bonus before they’ve agreed. But that’s not all!"],"lo":0},{"ch":8,"sec":"8.2 Socialization","term":"Obedience","d":["Change in behavior based on a direct request from someone with authority over you."],"lo":0},{"ch":8,"sec":"8.3 Attitudes and Behavior","term":"Social Cognition","d":["Process of how people think about others, and how this translates to behavior."],"lo":0},{"ch":8,"sec":"8.3 Attitudes and Behavior","term":"Attitude","d":["Expression of positive or negative feelings about a specific thing. 3 components.","• Affective – Attitude component; how one feels toward something. I don’t like snakes.","• Behavioral – Attitude component; how one acts with respect to something. I avoid snakes.","• Cognitive – Attitude component; how one thinks about something, usually justifying the affective, behavioral components. Snakes are dangerous."],"lo":0},{"ch":8,"sec":"8.3 Attitudes and Behavior","term":"Functional Attitudes Theory","d":["Attitudes have 4 functions: knowledge, ego expression, adaptation, ego defense","• Knowledge Function – Functional attitudes; attitudes help organize one’s thoughts, and make behavior more predictable (which might help in a social situation).","• Ego-Defensive – Functional attitudes; attitudes protect our self-esteem or justify wrong actions to alleviate the feeling of guilt.","• Ego-Expressive – Functional attitudes; attitudes help us express our self-identity.","• Adaptive – Functional attitudes; expressing acceptable attitudes may lead to acceptance."],"lo":1},{"ch":8,"sec":"8.3 Attitudes and Behavior","term":"Learning Theory","d":["Attitudes develop through different kinds of learning."],"lo":0},{"ch":8,"sec":"8.3 Attitudes and Behavior","term":"Elaboration Likelihood Model","d":["Models on a continuum how people process persuasive information, and how this leads to changes in behavior or attitude.","• Central Route Processing – Elaboration Likelihood Model; people process persuasive information by focusing deeply on facts and logic.","◦ Central Message Characteristics – Core data, logic, quality of an argument.","◦ Central Route to Persuasion – Deep thinking about facts usually leads to long-lasting attitude change.","• Peripheral Route Processing – Elaboration Likelihood Model; people process persuasive information by focusing on superficial details, rather than logic or facts.","◦ Peripheral Message Characteristics – Surface cues, speaker’s fame or status, looks.","◦ Peripheral Route to Persuasion – Superficial cues usually leads to temporary attitude change."],"lo":0},{"ch":8,"sec":"8.3 Attitudes and Behavior","term":"Social Cognitive Theory","d":["People shape their attitudes and behaviors by observing others."],"lo":0},{"ch":8,"sec":"8.3 Attitudes and Behavior","term":"Bandura’s Triadic Reciprocal Causation","d":["A student likes psychology (personal), so they sit at the front (behavioral) which leads to more praise from the professor (environmental), making them like psychology more.","• Personal Factor – Bandura’s Triadic; your thoughts, beliefs, expectations.","• Behavioral Factor – Bandura’s Triadic; actions you take.","• Environmental Factor – Bandura’s Triadic; context, social surroundings, etc."],"lo":0},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Social Statuses","d":["Perceived societal positions, used to classify people.","• Ascribed Status – Status involuntarily given or assigned.","• Achieved Status – Status gained as a result of choice, effort.","• Master Status – Someone’s primary or main status, most often identifying them.","• Status Inconsistency – When a person has multiple social statuses, of varying prestige. A doctor working as a clerk."],"lo":0},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Role","d":["Set of expected beliefs, attitudes, norms attached to a particular social position or status.","• Role Performance – How a person carries out a role (and its behaviors) in practice.","• Role Partner – A person someone interacts with while in their role.","• Role Set – A set of roles associated with a social position or status.","• Role Conflict – Tension between multiple roles.","• Role Strain – Tension within a role.","• Role Exit – Dropping of an identity-important role for a different role."],"lo":0},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Group / Social Group","d":["2+ people who share similar characteristics + feel unity.","• Dyad – A group of 2.","• Triad – A group of 3.","• In-Group – A group one identifies with as a member.","• Out-Group – A group one does not identify with as a member.","• Peer Group – A group made up of self-selected equals (peers), usually with something in common.","• Family Group – A group determined by birth, adoption, or marriage.","• Reference Group – A group one uses as a standard to evaluate themselves.","• Primary Group – A group made up of close, tightly-knit members with personal bonds.","• Secondary Group – An often temporary, impersonal group made up of members centered around a goal or purpose."],"lo":0},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Group Conflict","d":["Conflict or tension between groups."],"lo":1},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Gemeinschaft und Gesellschaft","d":["Ferdinand Tonnies’ 2 major group types.","• Gemeinschaft / Community – Groups unified by a sense of “togetherness”, shared beliefs, ancestries, geography.","• Gesellschaft / Society – Groups formed out of mutual self-interest or common goal."],"lo":0},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Interaction Process Analysis","d":["A technique used to observe, classify, measure interactions within a small group."],"lo":1},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"System for Multiple Level Observation of Groups (SYMLOG)","d":["Updated interaction process analysis technique, using 3 dimensions of interaction.","• Dominance vs Submission","• Friendliness vs Unfriendliness","• Instrumentally Controlled vs Emotionally Expressive"],"lo":1},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Group Conformity","d":["Members of a group usually comply with the group’s goals, even if it goes against their own. Group has power."],"lo":1},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Network","d":["The observable pattern of relationships in an individual or group.","• Network Redundancy – There are overlapping connections in an individual’s network. Your coworker is your wife.","• Immediate Networks – Dense networks with strong ties.","• Distant Networks – Loose networks with weaker ties."],"lo":0},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Organization","d":["Secondary groups characterized by structure, culture, and goal.","• Formal Organization – Organizations (secondary groups) with explicit rules and hierarchy, usually impersonal.","• Characteristic Institution – The fundamental organization of society, changing throughout history. Kin or clan to bureaucracy."],"lo":0},{"ch":9,"sec":"9.1 Elements of Social Interaction","term":"Bureaucracy","d":["Formal organization using administration and rules to run large systems.","• Hierarchical structure","• Division of labor","• Written rules and regulations","• Impersonality","• Merit-based advancement","• Record keeping / written communication","• Iron Law of Oligarchy – Democratic or bureaucratic systems will naturally centralize into an oligarchy.","• McDonaldization – A shift in focus to efficiency, predictability, calculability, and control in society."],"lo":0},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Self-Presentation","d":["Displaying ourselves to society through appearance + actions.","• Authentic Self – Who a person actually is.","• Ideal Self – Who a person wants to be.","• Tactical Self – Who a person acts like when deliberately adhere to other’s expectations."],"lo":0},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Models of Emotional Expression","d":["How emotions get expressed and shaped.","• Basic Model of Emotional Expression – Darwin; emotional expression depends on facial expression + behavior + posture + vocal change + physiological change.","• Appraisal Model – Our emotions depend on how we interpret (appraise) what’s happening.","• Social Construction Model of Emotional Expression – No biological basis for emotion. Social context and experiences determine emotion, and as such differs from culture to culture."],"lo":0},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Display Rules","d":["Cultural expectations of emotion. Rules of emotional display."],"lo":0},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Cultural Syndrome","d":["A set of cultural beliefs organized around a central theme, which can inform display rules of emotion."],"lo":1},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Impression Management","d":["Attempts to manage or influence how others see us.","• Self-disclosure – Impression management strategy; disclosing information to establish an identity or image.","• Managing Appearances – Impression management strategy; managing your appearance to create an image.","• Ingratiation – Impression management strategy; use of flattery or conforming to create an image.","• Aligning Actions – Impression management strategy; justify questionable behavior through excuses.","• Alter-casting – Impression management strategy; forcing or encouraging someone into an identity/role."],"lo":0},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Dramaturgical Approach","d":["Erving Goffman; describes impression management via theatrical performance.","• Front Stage Self – Goffman; persona someone presents to an audience.","• Back Stage Self – Goffman; authentic persona when not concerned about upholding a specific image."],"lo":0},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Mead: I and Me","d":["Two parts of the self (George Herbert Mead).","• I – George Herbert Mead; impulsive, spontaneous part of the self shaped by the interpretation of societal expectations, Me.","• Me – George Herbert Mead; part of the self shaped by societal interaction.","• Generalized Other – George Herbert Mead; the group or community whose expectations become part of one’s self."],"lo":0},{"ch":9,"sec":"9.2 Self-Presentation and Interacting with Others","term":"Communication","d":["Conveying of information.","• Verbal Communication – Conveying of information via speech.","• Nonverbal Communication – Conveying of information without words. Body language, facial expression, tone of voice, etc.","• Animal Communication – Any behavior of one animal that affects the behavior of another. Facial expressions are more conserved across species than body language. Dog growling, pheromones, baring teeth, etc."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Interpersonal Attraction","d":["Individuals liking each other.","• Golden Ratio – 1.618:1, affects attraction.","• Reciprocal Liking – People like other people better when they believe it's mutual.","• Proximity – People like each other more when they’re in proximity.","• Mere Exposure Effect / Familiarity Effect – People prefer stimuli they’ve been exposed to more frequently."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Aggression","d":["Behavior intended to cause harm or increase social dominance."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Amygdala","d":["Processes the environment and stimuli + Signals to the cortex. Fear (aggressive + defensive), facial expressions.","• Prefrontal cortex can control the amygdala, and thus impulsiveness, aggression, etc."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Cognitive Neoassociation Model","d":["People are more aggressive when they feel negative emotions. Hangry, etc."],"lo":1},{"ch":10,"sec":"10.1 Social Behavior","term":"Attachment","d":["Emotional bond between caregiver and child.","• Secure Attachment – Child has a consistent caregiver and base, so child explores more. Upset when caregiver leaves, comforted when returns. Vital part of standard development.","• Insecure Attachment – Child doesn’t have a consistent caregiver. Avoidant, Ambivalent, Disorganized.","• Avoidant Attachment – Caregiver has very little or no response to the child, so child doesn’t care much for them.","• Anxious-Ambivalent / Ambivalent Attachment – Caregiver has an inconsistent response to the child. Upset when caregiver leaves, conflicted when returns. Child is anxious about caregiver reliability.","• Disorganized Attachment – Child shows an inconsistent mix of behavior towards caregiver. Often sign of abuse."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Social Support","d":["Care provided by a social network.","• Emotional Support – Social support; emotional expression that makes someone feel supported.","• Esteem Support – Social support; bolstering someone’s confidence.","• Material / Tangible Support – Social support; financial or material support.","• Informational Support – Social support; giving someone information to support them.","• Network Support – Social support; making someone feel a sense of belonging."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Foraging","d":["Seeking out and eating food. Observational learning, cognitive-related."],"lo":1},{"ch":10,"sec":"10.1 Social Behavior","term":"Hypothalamus and Hunger","d":["Hypothalamus controls hunger."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Mating System","d":["Pattern of a group’s sexual behavior.","• Monogamy – Exclusive mating.","• Polygamy – Multiple mates.","◦ Polygyny – Polygamy with many females.","◦ Polyandry – Polygamy with many males.","• Promiscuity – Multiple sexual partners without commitment."],"lo":1},{"ch":10,"sec":"10.1 Social Behavior","term":"Mate Choice / Intersexual Selection","d":["Selection of a mate based on attraction.","• Phenotypic Benefits – Mate choice; observable, phenotypic traits that make one more attractive.","• Sensory Bias – Mate choice; a preference for certain traits because they match preexisting sensory preferences.","• Fisherian / Runaway Selection – Mate choice; preference for a trait reinforces itself, leading to more and more exaggeration of that trait.","• Indicator Traits – Mate choice; traits that indicate good health or fitness. May or may not be genetic.","• Genetic Compatibility – Mate choice; how compatible 2 genotypes are in creating viable offspring."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Mate Bias","d":["A preference for certain traits in potential mates.","• Direct Benefits – Mate provides material advantage, protection, emotional support, etc.","• Indirect Benefits – Mate provides better fitness in offspring."],"lo":1},{"ch":10,"sec":"10.1 Social Behavior","term":"Altruism","d":["Behavior that helps someone, but costs you."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Empathy","d":["Ability to vicariously experience emotions. Big part in helping behavior."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Empathy-Altruism Hypothesis","d":["One helps someone regardless of the cost when they feel empathy."],"lo":0},{"ch":10,"sec":"10.1 Social Behavior","term":"Game Theory","d":["Mathematical study of decision making behavior.","• Evolutionary Stable Strategy (ESS) – A behavioral strategy that gives the highest evolutionary fitness when common in a population, and thus cannot be replaced.","• Hawk-Dove Game – Game theory model of competition between individuals. Hawk strategy is aggressive, dove strategy is nonaggressive.","◦ Altruism – Donor benefits recipient at the donor’s cost.","◦ Cooperation – Donor and recipient both benefit via cooperation.","◦ Spite – Donor and recipient both harmed.","◦ Selfishness – Donor benefits at the recipient’s cost."],"lo":1},{"ch":10,"sec":"10.1 Social Behavior","term":"Inclusive Fitness","d":["Total reproductive success of an organism’s genes due reproduction of itself + reproduction of related, gene-sharing organisms.","• Promotes altruism, especially towards relatives because it increases fitness."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Attributions","d":["Explanations for the cause of an outcome, or someone’s actions/behavior. Informs social perception."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Social Perception / Social Cognition","d":["How people make judgements and impressions of others. 3 components.","• Perceiver – Social Perception; the person making the judgement or impression.","• Target – Social Perception; the person being judged.","• Situation – Social Perception; the context or environment influencing social perception."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Primary Effect","d":["First impressions are more important to social perception, impression."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Recency Effect","d":["Recent information is more important to social perception, impression."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Reliance on Central Traits","d":["Perceiver centers their perception of the target around the traits most relevant to them."],"lo":1},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Implicit Personality Theory","d":["People assume certain personality traits come together.
