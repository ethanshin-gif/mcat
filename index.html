e up of self-selected equals (peers), usually with something in common."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Family Group", "d": ["A group determined by birth, adoption, or marriage."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Reference Group", "d": ["A group one uses as a standard to evaluate themselves."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Primary Group", "d": ["A group made up of close, tightly-knit members with personal bonds."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Secondary Group", "d": ["An often temporary, impersonal group made up of members centered around a goal or purpose."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Gemeinschaft und Gesellschaft", "d": ["Ferdinand Tonnies’ 2 major group types."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Gemeinschaft / Community", "d": ["Groups unified by a sense of “togetherness”, shared beliefs, ancestries, geography."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Gesellschaft / Society", "d": ["Groups formed out of mutual self-interest or common goal."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Interaction Process Analysis", "d": ["A technique used to observe, classify, measure interactions within a small group."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "System for Multiple Level Observation of Groups (SYMLOG)", "d": ["Updated interaction process analysis technique, using 3 dimensions of interaction.", "• Dominance vs Submission", "• Friendliness vs Unfriendliness", "• Instrumentally Controlled vs Emotionally Expressive"]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Group Conformity", "d": ["Members of a group usually comply with the group’s goals, even if it goes against their own. Group has power."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Network", "d": ["The observable pattern of relationships in an individual or group."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Network Redundancy", "d": ["There are overlapping connections in an individual’s network. Your coworker is your wife."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Immediate Networks", "d": ["Dense networks with strong ties."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Distant Networks", "d": ["Loose networks with weaker ties."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Organization", "d": ["Secondary groups characterized by structure, culture, and goal."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Formal Organization", "d": ["Organizations (secondary groups) with explicit rules and hierarchy, usually impersonal."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Characteristic Institution", "d": ["The fundamental organization of society, changing throughout history. Kin or clan to bureaucracy."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Bureaucracy", "d": ["Formal organization using administration and rules to run large systems.", "• Hierarchical structure", "• Division of labor", "• Written rules and regulations", "• Impersonality", "• Merit-based advancement", "• Record keeping / written communication"]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "Iron Law of Oligarchy", "d": ["Democratic or bureaucratic systems will naturally centralize into an oligarchy."]}, {"ch": 9, "sec": "9.1 Elements of Social Interaction", "term": "McDonaldization", "d": ["A shift in focus to efficiency, predictability, calculability, and control in society."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Self-Presentation", "d": ["Displaying ourselves to society through appearance + actions."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Basic Model of Emotional Expression", "d": ["Darwin; emotional expression depends on facial expression + behavior + posture + vocal change + physiological change."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Appraisal Model", "d": ["Our emotions depend on how we interpret (appraise) what’s happening."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Social Construction Model of Emotional Expression", "d": ["No biological basis for emotion. Social context and experiences determine emotion, and as such differs from culture to culture."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Display Rules", "d": ["Cultural expectations of emotion. Rules of emotional display."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Cultural Syndrome", "d": ["A set of cultural beliefs organized around a central theme, which can inform display rules of emotion."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Authentic Self", "d": ["Who a person actually is."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Ideal Self", "d": ["Who a person wants to be."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Tactical Self", "d": ["Who a person acts like when deliberately adhere to other’s expectations."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Impression Management", "d": ["Attempts to manage or influence how others see us."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Self-disclosure", "d": ["Impression management strategy; disclosing information to establish an identity or image."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Managing Appearances", "d": ["Impression management strategy; managing your appearance to create an image."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Ingratiation", "d": ["Impression management strategy; use of flattery or conforming to create an image."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Aligning Actions", "d": ["Impression management strategy; justify questionable behavior through excuses."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Alter-casting", "d": ["Impression management strategy; forcing or encouraging someone into an identity/role."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Dramaturgical Approach", "d": ["Erving Goffman; describes impression management via theatrical performance."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Front Stage Self", "d": ["Goffman; persona someone presents to an audience."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Back Stage Self", "d": ["Goffman; authentic persona when not concerned about upholding a specific image."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Me", "d": ["George Herbert Mead; part of the self shaped by societal interaction."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Generalized Other", "d": ["George Herbert Mead; the group or community whose expectations become part of one’s self."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "I", "d": ["George Herbert Mead; impulsive, spontaneous part of the self shaped by the interpretation of societal expectations, Me."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Communication", "d": ["Conveying of information."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Verbal Communication", "d": ["Conveying of information via speech."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Nonverbal Communication", "d": ["Conveying of information without words. Body language, facial expression, tone of voice, etc."]}, {"ch": 9, "sec": "9.2 Self-Presentation and Interacting with Others", "term": "Animal Communication", "d": ["Any behavior of one animal that affects the behavior of another. Facial expressions are more conserved across species than body language. Dog growling, pheromones, baring teeth, etc."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Interpersonal Attraction", "d": ["Individuals liking each other."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Golden Ratio", "d": ["1.618:1, affects attraction."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Reciprocal Liking", "d": ["People like other people better when they believe it's mutual."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Proximity", "d": ["People like each other more when they’re in proximity."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Mere Exposure Effect / Familiarity Effect", "d": ["People prefer stimuli they’ve been exposed to more frequently."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Aggression", "d": ["Behavior intended to cause harm or increase social dominance."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Amygdala", "d": ["Processes the environment and stimuli + Signals to the cortex. Fear (aggressive + defensive), facial expressions.", "• Prefrontal cortex can control the amygdala, and thus impulsiveness, aggression, etc."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Cognitive Neoassociation Model", "d": ["People are more aggressive when they feel negative emotions. Hangry, etc."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Attachment", "d": ["Emotional bond between caregiver and child."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Secure Attachment", "d": ["Child has a consistent caregiver and base, so child explores more. Upset when caregiver leaves, comforted when returns. Vital part of standard development."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Insecure Attachment", "d": ["Child doesn’t have a consistent caregiver. Avoidant, Ambivalent, Disorganized."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Avoidant Attachment", "d": ["Caregiver has very little or no response to the child, so child doesn’t care much for them."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Anxious-Ambivalent / Ambivalent Attachment", "d": ["Caregiver has an inconsistent response to the child. Upset when caregiver leaves, conflicted when returns. Child is anxious about caregiver reliability."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Disorganized Attachment", "d": ["Child shows an inconsistent mix of behavior towards caregiver. Often sign of abuse."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Social Support", "d": ["Care provided by a social network."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Emotional Support", "d": ["Social support; emotional expression that makes someone feel supported."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Esteem Support", "d": ["Social support; bolstering someone’s confidence."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Material / Tangible Support", "d": ["Social support; financial or material support."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Informational Support", "d": ["Social support; giving someone information to support them."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Network Support", "d": ["Social support; making someone feel a sense of belonging."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Foraging", "d": ["Seeking out and eating food. Observational learning, cognitive-related."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Hypothalamus and Hunger", "d": ["Hypothalamus controls hunger."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Mating System", "d": ["Pattern of a group’s sexual behavior."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Monogamy", "d": ["Exclusive mating."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Polygamy", "d": ["Multiple mates."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Polygyny", "d": ["Polygamy with many females."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Polyandry", "d": ["Polygamy with many males."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Promiscuity", "d": ["Multiple sexual partners without commitment."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Mate Choice / Intersexual Selection", "d": ["Selection of a mate based on attraction."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Phenotypic Benefits", "d": ["Mate choice; observable, phenotypic traits that make one more attractive."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Sensory Bias", "d": ["Mate choice; a preference for certain traits because they match preexisting sensory preferences."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Fisherian / Runaway Selection", "d": ["Mate choice; preference for a trait reinforces itself, leading to more and more exaggeration of that trait."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Indicator Traits", "d": ["Mate choice; traits that indicate good health or fitness. May or may not be genetic."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Genetic Compatibility", "d": ["Mate choice; how compatible 2 genotypes are in creating viable offspring."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Mate Bias", "d": ["A preference for certain traits in potential mates."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Direct Benefits", "d": ["Mate provides material advantage, protection, emotional support, etc."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Indirect Benefits", "d": ["Mate provides better fitness in offspring."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Altruism", "d": ["Behavior that helps someone, but costs you."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Empathy", "d": ["Ability to vicariously experience emotions. Big part in helping behavior."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Empathy-Altruism Hypothesis", "d": ["One helps someone regardless of the cost when they feel empathy."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Game Theory", "d": ["Mathematical study of decision making behavior."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Evolutionary Stable Strategy (ESS)", "d": ["A behavioral strategy that gives the highest evolutionary fitness when common in a population, and thus cannot be replaced."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Hawk-Dove Game", "d": ["Game theory model of competition between individuals. Hawk strategy is aggressive, dove strategy is nonaggressive."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Altruism", "d": ["Donor benefits recipient at the donor’s cost."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Cooperation", "d": ["Donor and recipient both benefit via cooperation."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Spite", "d": ["Donor and recipient both harmed."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Selfishness", "d": ["Donor benefits at the recipient’s cost."]}, {"ch": 10, "sec": "10.1 Social Behavior", "term": "Inclusive Fitness", "d": ["Total reproductive success of an organism’s genes due reproduction of itself + reproduction of related, gene-sharing organisms.", "• Promotes altruism, especially towards relatives because it increases fitness."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Attributions", "d": ["Explanations for the cause of an outcome, or someone’s actions/behavior. Informs social perception."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Social Perception / Social Cognition", "d": ["How people make judgements and impressions of others. 3 components."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Perceiver", "d": ["Social Perception; the person making the judgement or impression."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Target", "d": ["Social Perception; the person being judged."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Situation", "d": ["Social Perception; the context or environment influencing social perception."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Primary Effect", "d": ["First impressions are more important to social perception, impression."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Recency Effect", "d": ["Recent information is more important to social perception, impression."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Reliance on Central Traits", "d": ["Perceiver centers their perception of the target around the traits most relevant to them."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Implicit Personality Theory", "d": ["People assume certain personality traits come together. Friendly and honest."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Halo Effect", "d": ["One positive trait makes you assume one has other positive traits."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Just-World Hypothesis", "d": ["Belief that good things happen to good people, bad things happen to bad people. Karma. Possible victim-blaming."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Self-Serving (Attributional) Bias", "d": ["Good things happen due to internal factors, bad things happen due to external factors."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Self-Enhancement Bias", "d": ["You want to see yourself more positively."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Self-Verification Bias", "d": ["You want to confirm your own views about yourself. Confirmation bias applied to self-concept."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "In-Group Bias", "d": ["You tend to see people inside of your group favorably."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Out-Group Bias", "d": ["You tend to see people outside of your group harshly."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Attribution Theory", "d": ["Fritz Heider; how people explain the cause of behavior/events."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Dispositional / Internal Attributions", "d": ["Explaining behaviors/events as being caused by the person."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Situational / External Attributions", "d": ["Explaining behaviors/events as being caused by the environment or circumstances."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Consistency Cues", "d": ["Cues related to a person’s behavior over time."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Consensus Cues", "d": ["Cues related to how much someone’s behavior differs from others."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Distinctiveness Cues", "d": ["Information about if a behavior is limited to a single situation or occurs across many scenarios."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Correspondent Inference Theory", "d": ["People tend to infer someone’s traits from behavior, especially when it's unexpected."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Fundamental Attribution Error", "d": ["When judging others, people are more likely to make dispositional attributions."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Attribute Substitution", "d": ["In complex situations, people unconsciously make simpler judgements to estimate."]}, {"ch": 10, "sec": "10.2 Social Perception and Behavior", "term": "Cultural Attribution", "d": ["The culture of a person has an impact on the kinds of attributions they make."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Stereotypes", "d": ["Expectations, impressions, opinions about members of a group and/or their characteristics."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Stereotype Content Model", "d": ["Classifies stereotypes into 2 dimensions: warmth, competence."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Warmth", "d": ["Stereotype Content Model; is someone friendly?"]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Competence", "d": ["Stereotype Content Model; is someone capable?"]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Paternalistic Stereotype", "d": ["Stereotype Content Model; stereotypes that see a group with high warmth + low competence. Pity."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Contemptuous Stereotype", "d": ["Stereotype Content Model; stereotypes see a group as low warmth + low competence. Contempt."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Envious Stereotype", "d": ["Stereotype Content Mode; stereotypes see a group as low warmth + high competence."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Admiration Stereotype", "d": ["Stereotype Content Model; stereotypes see a group as high warmth + high competence."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Self-Fulfilling Prophecy", "d": ["Your expectations create conditions that fulfill those expectations."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Stereotype Threat", "d": ["Someone stresses they might confirm a negative stereotype, which ends up hurting their performance. Self-fulfilling prophecy."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Prejudice", "d": ["Irrational positive or negative attitude towards something, without actual experience."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Propaganda", "d": ["Biased or misleading information used to influence people, usually for a goal."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Power", "d": ["Ability to achieve a goal despite obstacles."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Prestige", "d": ["Level of respect shown to a person by others."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Class", "d": ["Socioeconomic status."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Ethnocentrism", "d": ["Judging another culture based on the standards of your own culture."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Cultural Relativism", "d": ["Cultures should be studied by their own terms, to avoid ethnocentrism."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Discrimination", "d": ["Prejudice causes individuals of a group to be treated differently. Behavior to prejudice attitude."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Individual Discrimination", "d": ["An individual discriminates against a person/group."]}, {"ch": 10, "sec": "10.3 Stereotypes, Prejudice, Discrimination", "term": "Institutional Discrimination", "d": ["An institution or group discriminates against a person/group."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Sociology", "d": ["Study of society and its creation, interactions, changes, norms, etc."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Micro", "d": ["Sociology level; family groups and communities."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Meso", "d": ["Sociology level; organizations and institutions."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Macro", "d": ["Sociology level; national and international systems."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Theoretical Approaches to Society", "d": ["Frameworks used by sociologists to explain how society works + human behavior within society."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Symbolic Interactionism", "d": ["George Herbert Mead; model that studies human interaction via symbols used to communicate. Micro."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Symbol", "d": ["Anything that carries meaning."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Social Constructionism", "d": ["Model that studies human interaction via social constructs. Micro, Meso."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Social Construct", "d": ["An idea created and accepted by people in society."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Rational Choice / Social Exchange Theory", "d": ["Model that studies human interaction via individual decision-making. Micro."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Conflict Theory", "d": ["Karl Marx; model that studies society by examining conflicts between its groups. Bourgeoisie vs Proletariat. Macro."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Capitalism", "d": ["Individuals and corporations control the means of production."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Capitalist / Bourgeoisie Class", "d": ["Small, wealthy class that controls the means of production."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Worker / Proletariat Class", "d": ["Rest of society that performs manual labor. According to Marx, power disparity will lead to the proletariat overthrowing the capitalist class."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Interest Groups", "d": ["Organized group that pursues a goal, usually policy or societal change."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Structural-Functionalism Theory", "d": ["Emile Durkheim; model that views society as stable, cooperative parts working together to maintain balance. Macro."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Function", "d": ["Structural-Functionalism; contribution made by a group to a system."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Manifest Function", "d": ["Structural-Functionalism; the intended beneficial consequence of a group’s action."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Latent Function", "d": ["Structural-Functionalism; the unintended, beneficial consequence of a group's action."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Dysfunction", "d": ["Structural-Functionalism; Negative consequences of a group’s action, intended or unintended."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Feminist Theory", "d": ["Critiques institutions that disadvantage women due to society being inherently patriarchal. Offshoot of conflict theory."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Patriarchy", "d": ["Society is dominated by men, who seek to preserve their positions of power."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Glass Ceiling", "d": ["Feminist; an invisible social barrier that limits a woman’s social ceiling."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Glass Escalator", "d": ["Feminist; an invisible social force that pushes men to higher positions, over women."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Social Institutions", "d": ["Established social structures that fulfill some societal part or need."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Family", "d": ["Social institution; differs from culture to culture.", "• Child Abuse –"]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Patterns of Kinship", "d": ["Cultural variations about what is considered family."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Domestic Violence", "d": ["#1 cause of injury to American women. Drug abuse, alcoholism."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Elder Abuse", "d": ["Most often abusive caretaker."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Mandated Reporter", "d": ["Someone legally required to report suspected cases of elder or child abuse, but not general domestic violence."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Education", "d": ["Social institution; provide an individual or group with a useful set of skills."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Hidden Curriculum", "d": ["Unspoken or implicit lessons about social norms, attitude, beliefs learned by students."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Teacher Expectancy", "d": ["Teachers get what they expect from students. Self-fulfilling prophecy."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Religion", "d": ["Social institution.", "• Denomination / Sect –", "• Church –", "• Cult –", "• Fundamentalism – Emphasizes strict adherence to religion, and rejects secularism."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Religiosity", "d": ["How religious one considers themselves. Includes strength of beliefs, practices, attitudes."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Secularize", "d": ["To move away from religion and towards rational or scientific thinking."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Government", "d": ["Social institution; maintain social order, enforce laws."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Democracy", "d": ["Every citizen votes."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Monarchies", "d": ["There is a royal monarch."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Dictatorship", "d": ["One person has power, and usually suppresses the power of others."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Theocracy", "d": ["Religious leaders hold power."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Charismatic Authority", "d": ["Authority based on personal appeal or charisma."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Economy", "d": ["Social institution; organize money, goods, services."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Capitalist", "d": ["Economic system emphasizing free market, consumerism, and competition for profit."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Division of Labor", "d": ["Components of a larger task or assigned to specialists. Common in capitalist economies."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Socialist", "d": ["Economic system emphasizing collective ownership, government control of resources, equitable distribution of resources."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Medicine", "d": ["Social institution."]}, {"ch": 11, "sec": "11.1 Sociology: Theories and Institutions", "term": "Healthcare", "d": ["Social institutio const KEY='ps-flash-v1', CHKEY='ps-flash-ch', MODEKEY='ps-flash-mode';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const cards=DATA.cards.map((c,i)=>({...c,id:c.ch+'|'+c.sec+'|'+c.term}));
let status=load(KEY,{});            // id -> 'yes' | 'no'
let chosen=new Set(load(CHKEY,DATA.chapters.map(c=>c.ch)));
const $=id=>document.getElementById(id);
$('mode').value=load(MODEKEY,'todo');
let queue=[], idx=0, history=[], pile='no';

function pileOf(c){return status[c.id]||'new'}
function inScope(){return cards.filter(c=>chosen.has(c.ch))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  const m=$('mode').value;
  queue=shuffle(inScope().filter(c=>{const p=pileOf(c);return m==='all'||(m==='todo'?p!=='yes':p===m)}));
  idx=0; history=[]; render();
}
function esc(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))}
function defHTML(c){return c.d.map(x=>'<p>'+esc(x)+'</p>').join('')}
function stats(){
  const s={new:0,no:0,yes:0}; inScope().forEach(c=>s[pileOf(c)]++);
  $('sNew').textContent=s.new;$('sNo').textContent=s.no;$('sYes').textContent=s.yes;
}
function render(){
  stats();
  const card=$('card'); card.classList.remove('flipped');
  if(idx>=queue.length){
    card.innerHTML='<div class="done"><b style="font-size:20px;color:var(--ink)">Done with this set.</b><br><br>Hit Shuffle to go again, or switch the mode.</div>';
    $('actions').classList.add('hidden'); return;
  }
  $('actions').classList.remove('hidden');
  if(!$('term')) card.innerHTML='<div class="meta"><span id="where"></span><span id="pos"></span></div><div class="term" id="term"></div><div class="def" id="def"></div><div class="hint">Tap to flip</div>';
  const c=queue[idx], p=pileOf(c);
  $('where').innerHTML='Ch '+c.ch+(c.sec?' · '+esc(c.sec.replace(/^\d+\.\d+\s*/,'')):'')+(p!=='new'?' <span class="tag '+p+'">'+(p==='yes'?'got it':"don't get it")+'</span>':'');
  $('pos').textContent=(idx+1)+' / '+queue.length;
  $('term').textContent=c.term; $('def').innerHTML=defHTML(c);
}
function mark(v){
  if(idx>=queue.length) return;
  const c=queue[idx]; history.push([idx,c.id,status[c.id]]);
  status[c.id]=v; save(KEY,status); idx++; render();
}
$('card').onclick=()=>{if(idx<queue.length)$('card').classList.toggle('flipped')};
$('bNo').onclick=()=>mark('no'); $('bYes').onclick=()=>mark('yes');
$('undo').onclick=()=>{const h=history.pop(); if(!h) return; const [i,id,prev]=h; if(prev) status[id]=prev; else delete status[id]; save(KEY,status); idx=i; render();};
$('shuffle').onclick=build;
$('mode').onchange=()=>{save(MODEKEY,$('mode').value);build()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key===' '){e.preventDefault();$('card').click()}
  else if(e.key==='ArrowLeft') mark('no');
  else if(e.key==='ArrowRight') mark('yes');
});

// chapters
function drawChips(){
  $('chips').innerHTML=DATA.chapters.map(c=>'<button class="chip'+(chosen.has(c.ch)?' on':'')+'" data-ch="'+c.ch+'">'+c.ch+'. '+esc(c.title)+'</button>').join('');
}
$('chips').onclick=e=>{const b=e.target.closest('[data-ch]'); if(!b) return; const n=+b.dataset.ch; chosen.has(n)?chosen.delete(n):chosen.add(n); save(CHKEY,[...chosen]); drawChips(); build(); drawList();};
$('all').onclick=()=>{chosen=new Set(DATA.chapters.map(c=>c.ch));save(CHKEY,[...chosen]);drawChips();build();drawList()};
$('none').onclick=()=>{chosen=new Set();save(CHKEY,[]);drawChips();build();drawList()};
$('toggleSetup').onclick=()=>$('setup').classList.toggle('hidden');

// piles
function drawList(){
  const items=inScope().filter(c=>pileOf(c)===pile);
  $('list').innerHTML=items.length?items.map(c=>'<details class="item"><summary><span>'+esc(c.term)+'</span><span class="small">Ch '+c.ch+'</span></summary><div class="def">'+defHTML(c)+'</div></details>').join(''):'<p class="small" style="text-align:center">Nothing here.</p>';
  document.querySelectorAll('[data-pile]').forEach(b=>b.classList.toggle('on',b.dataset.pile===pile));
}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-pile]'); if(!b) return; pile=b.dataset.pile; drawList();};
$('toggleList').onclick=()=>{const show=$('listView').classList.contains('hidden'); $('listView').classList.toggle('hidden',!show); $('study').classList.toggle('hidden',show); $('toggleList').textContent=show?'Study':'Piles'; if(show) drawList(); else build();};
$('reset').onclick=()=>{if(!confirm('Move every card in the selected chapters back to New?'))return;inScope().forEach(c=>delete status[c.id]); save(KEY,status); drawList(); stats();};

// save / load progress file
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
$('saveBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'ps-flash',v:1,saved:new Date().toISOString(),status,chapters:[...chosen],mode:$('mode').value})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ps-progress.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress saved');
};
function loadFile(f){
  if(!f) return;
  f.text().then(txt=>{
    const o=JSON.parse(txt);
    if(!o||typeof o.status!=='object') throw 0;
    status=o.status; save(KEY,status);
    if(Array.isArray(o.chapters)){chosen=new Set(o.chapters);save(CHKEY,o.chapters)}
    if(o.mode){$('mode').value=o.mode;save(MODEKEY,o.mode)}
    drawChips(); build(); if(!$('listView').classList.contains('hidden')) drawList();
    const n=Object.values(status), no=n.filter(x=>x==='no').length, yes=n.filter(x=>x==='yes').length;
    toast('Loaded: '+no+" don't get it, "+yes+' got it');
  }).catch(()=>toast("That file isn't a progress file"));
}
$('loadBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(--dragN<=0){dragN=0;document.body.classList.remove('dragging')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('dragging');loadFile(e.dataTransfer.files[0])});

drawChips(); build();
</script>
</body>
</html>
