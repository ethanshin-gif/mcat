<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P/S Flashcards</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--no:#c2410c;--no-bg:#fdeee6;--yes:#15803d;--yes-bg:#e7f5ec;--accent:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececee;--muted:#9a9aa2;--line:#2e2e33;--no:#fb923c;--no-bg:#3a2216;--yes:#4ade80;--yes-bg:#16301f;--accent:#8ea2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:18px;margin:0;white-space:nowrap}
header .row{gap:2px;flex-wrap:nowrap}
@media (max-width:420px){header .link{font-size:14px;padding:4px 3px}h1{font-size:16px}}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.98)}
.link{background:none;border:none;color:var(--accent);padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:6px 10px;border-radius:999px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters #chSel,.filters #shuffle{grid-column:1/-1}
.filters select,.filters button{width:100%;min-width:0}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.stat.no b{color:var(--no)}.stat.yes b{color:var(--yes)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:300px;padding:24px 20px;display:flex;flex-direction:column;cursor:pointer;user-select:none}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.term{font-size:26px;font-weight:650;text-align:center;margin:auto 0;padding:16px 0}
.card.flipped .term{font-size:19px;margin:12px 0 8px;padding:0;text-align:left}
.def{display:none;font-size:17px}
.def p{margin:0 0 8px}
.def p.sub,.gd p.sub,.mapinfo p.sub{margin-left:18px;font-size:.93em;opacity:.9}
.card.flipped .def{display:block}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:auto}
.card.flipped .hint{display:none}
.tag{font-size:11px;padding:2px 8px;border-radius:999px}
.tag.lo{background:var(--line);color:var(--muted)}
.tag.no{background:var(--no-bg);color:var(--no)}.tag.yes{background:var(--yes-bg);color:var(--yes)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{padding:16px;font-size:17px;font-weight:600;border-radius:14px}
.bno{background:var(--no-bg);color:var(--no);border-color:transparent}
.byes{background:var(--yes-bg);color:var(--yes);border-color:transparent}
.done{text-align:center;padding:48px 16px;color:var(--muted)}
.list{margin-top:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.item summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.item .def{display:block;font-size:15px;margin-top:6px}
.tabs{display:flex;gap:6px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.nav button{border:none;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drillbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:10px;font-weight:600;font-size:14px}
.mapbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mapbar select,.mapbar input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.mapwrap{position:relative;height:calc(100vh - 210px);min-height:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
#map{display:block;width:100%;height:100%;cursor:grab}
#map.dragging{cursor:grabbing}
.mapempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
.mapzoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.mapzoom button{width:36px;height:36px;padding:0;font-size:18px;border-radius:10px}
.mapinfo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:15px}
.mapinfo h3{margin:0 0 6px;font-size:17px}
.mapinfo p{margin:0 0 4px}
.mapinfo .nb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gtitle{font-size:22px;margin:4px 0 2px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.danger{color:var(--no)}
.topic{margin:20px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:10px 0}
.g.editing{border-color:var(--accent)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.gh h3{margin:0;font-size:17px}
.gh .link{font-size:14px;font-weight:600}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.tt{font-size:15px;padding:6px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tt.lo{color:var(--muted)}
.tt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tt.plain{cursor:default;border-style:dashed}
.gd{font-size:15px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.gd b{display:block;margin-bottom:4px}
.gd p{margin:0 0 4px}
.ef{display:grid;gap:8px;margin-bottom:10px}
.ef label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.g input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.eitems{margin-bottom:8px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:none}
.ib{padding:4px 9px;border-radius:8px;font-size:14px}
.ib.x{color:var(--no)}
.results{margin-top:4px}
.res{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;margin-top:4px;border-radius:10px}
.ebar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.drop{position:fixed;inset:0;background:rgba(59,91,219,.12);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--accent);z-index:9;pointer-events:none}
body.dragging .drop{display:flex}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="drop">Drop progress file to load</div>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header>
    <h1>P/S Flashcards</h1>
    <div class="row">
      <button class="link" id="saveBtn">Save</button>
      <button class="link" id="loadBtn">Load</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </header>

  <nav class="nav">
    <button class="on" data-tab="study">Study</button>
    <button data-tab="listView">Piles</button>
    <button data-tab="guideView">Guides</button>
    <button data-tab="mapView">Map</button>
  </nav>

  <div id="drillBar" class="drillbar hidden"><span id="drillName"></span><button class="link" id="drillExit">Exit</button></div>

  <div id="controls">

  <div class="filters">
    <select id="chSel"></select>
    <select id="yield">
      <option value="all">All yield</option>
      <option value="hi">High yield only</option>
      <option value="lo">Low yield only</option>
    </select>
    <select id="mode">
      <option value="todo">New + Don't get it</option>
      <option value="no">Don't get it only</option>
      <option value="new">New only</option>
      <option value="all">Everything</option>
    </select>
    <button id="shuffle">Shuffle</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sNew">0</b>New</div>
    <div class="stat no"><b id="sNo">0</b>Don't get it</div>
    <div class="stat yes"><b id="sYes">0</b>Got it</div>
  </div>
  </div>

  <section id="study">
    <div class="card" id="card">
      <div class="meta"><span id="where"></span><span id="pos"></span></div>
      <div class="term" id="term"></div>
      <div class="def" id="def"></div>
      <div class="hint">Tap to flip</div>
    </div>
    <div class="actions" id="actions">
      <button class="bno" id="bNo">✗ Don't get it</button>
      <button class="byes" id="bYes">✓ Got it</button>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <button class="link" id="undo">Undo</button>
      <span class="small">Space flip · ← no · → yes</span>
    </div>
  </section>

  <section id="listView" class="hidden">
    <div class="tabs">
      <button class="chip on" data-pile="no">Don't get it</button>
      <button class="chip" data-pile="yes">Got it</button>
      <button class="chip" data-pile="new">New</button>
    </div>
    <div class="list" id="list"></div>
    <p class="row" style="justify-content:center"><button id="reset">Reset this selection</button></p>
  </section>
  <section id="guideView" class="hidden">
    <div class="ghead">
      <h2 class="gtitle">Study Guide</h2>
      <button id="newGroup" class="primary">+ New group</button>
    </div>
    <p class="small">Tap a term to see your definition. Gray = low yield.</p>
    <div id="guideBody"></div>
  </section>

  <section id="mapView" class="hidden">
    <div class="mapbar">
      <select id="mapTopic"></select>
      <input id="mapFind" placeholder="Find a term…" autocomplete="off" list="mapNames">
      <datalist id="mapNames"></datalist>
    </div>
    <div class="mapwrap" id="mapWrap">
      <canvas id="map"></canvas>
      <div class="mapempty hidden" id="mapEmpty">Make some groups in <b>Guides</b> and they'll show up here.</div>
      <div class="mapzoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit">⤢</button></div>
    </div>
    <div class="mapinfo hidden" id="mapInfo"></div>
  </section>
</div>

<script>
const DATA = {"chapters":[{"ch":1,"title":"Biology and Behavior"},{"ch":2,"title":"Sensation and Perception"},{"ch":3,"title":"Learning and Memory"},{"ch":4,"title":"Cognition Consciousness and Language"},{"ch":5,"title":"Motivation Emotion Stress"},{"ch":6,"title":"Identity and Personality"},{"ch":7,"title":"Psychological Disorders"},{"ch":8,"title":"Social Processes Attitudes Behavior"},{"ch":9,"title":"Social Interaction"},{"ch":10,"title":"Social Thinking"},{"ch":11,"title":"Social Structure and Demographics"},{"ch":12,"title":"Social Stratification"}],"cards":[{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Franz Gall","d":["Phrenology, wrong, bulge."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Phrenology","d":["Developing a trait makes the corresponding brain section bigger."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Pierre Flourens","d":["Studied functions of major brain regions via extirpation / ablation."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Extirpation / Ablation","d":["Remove part of the brain to see the result."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"William James","d":["American psychology founder. Functionalism."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"John Dewey","d":["Article about Functionalism. Study the whole instead of parts."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Functionalism","d":["How mental processes help people adapt to the environment. Their function."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Paul Broca","d":["Studied behavior deficiencies of people with brain damage; Matched function with brain region. Speech deficiency, left brain."],"lo":0},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Hermann von Helmholtz","d":["Studied nerve impulse speed; Bridged psychology + physiology."],"lo":1},{"ch":1,"sec":"1.1 A Brief History of Neuropsychology","term":"Sir Charles Sherrington","d":["Theorized synapses. Incorrectly thought they were electrical instead of chemical."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"3 Nerve Cells","d":["Sensory neurons, Motor neurons, Interneurons","• Sensory / Afferent Neurons – Receptors to CNS.","• Motor / Efferent Neurons – CNS to muscles + glands.","• Interneurons – In CNS, connect neurons to each other. Most numerous. Reflexive behavior."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Reflex Arcs","d":["Neural circuit controlling reflexive behavior. Bypass conscious processing."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Central Nervous System (CNS)","d":["Brain + Spinal Cord."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Peripheral Nervous System (PNS)","d":["Nerves outside the CNS."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Spinal Nerves","d":["31 pairs of nerves exiting the spinal cord."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Cranial Nerves","d":["12 pairs of nerves exiting the brain."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Olfactory Nerve","d":["Cranial nerve 1. PNS."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Optic Nerve","d":["Cranial nerve 2. PNS."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Somatic Nervous System","d":["Sensory + Motor neurons in the skin, joints, muscles."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Motor Impulse","d":["CNS to skeletal muscle via efferent neurons."],"lo":1},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Autonomic Nervous System (ANS)","d":["Heartbeat, respiration, digestion, gland secretions, sweating. Involuntary muscles."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Parasympathetic Nervous System","d":["Resting and digestion, acetylcholine (ACh). Decreases HR. Constricts pupils, bronchi. Inhibits release of glucose, epinephrine. Stimulates saliva, bile, peristalsis."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Peristalsis","d":["Muscle contraction that moves stuff through your digestive tract."],"lo":0},{"ch":1,"sec":"1.2 Organization of the Human Nervous System","term":"Sympathetic Nervous System","d":["Fight or flight, stress. Increases HR. Dilates pupils, bronchi. Stimulates release of glucose, epinephrine. Decreases digestion, peristalsis."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Meninges","d":["3 layer sheath of tissue covering the brain. Reabsorb CSF.","• Dura Mater – Outermost layer of meninges; Connected to skull.","• Arachnoid Mater – Middle, web-like layer of meninges.","• Pia Mater – Innermost layer of meninges; Connected to brain."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Cerebrospinal Fluid","d":["Nourishes and cushions CNS. Produced by cells lining the ventricles of the brain."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Hindbrain / Rhombencephalon","d":["Lower brain, regulates basic survival. Divides into myelencephalon + metencephalon."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Myelencephalon","d":["Becomes medulla oblongata."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Metencephalon","d":["Becomes pons + cerebellum."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Medulla Oblongata","d":["Hindbrain structure regulating breathing, HR, digestion."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Pons","d":["Hindbrain structure regulating breathing; Connects brain regions."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Cerebellum","d":["Hindbrain structure maintaining posture, balance, coordination. Drunk."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Reticular Formation","d":["Brain structure for alertness and arousal."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Midbrain / Mesencephalon","d":["Middle brain, sight/hearing reflexes. Receives and sends this reflexive info."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Colliculi","d":["Prominent part of midbrain. Super + Inferior.","• Superior Colliculus – Receives visual input. Sight reflexes.","• Inferior Colliculus – Receives audio input. Hearing reflexes."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Forebrain / Prosencephalon","d":["Upper brain, complex functions. Divides into telencephalon + diencephalon."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Telencephalon","d":["Becomes cerebral cortex + basal ganglia + limbic system."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Diencephalon","d":["Becomes thalamus + hypothalamus + posterior pituitary gland + pineal gland."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Brainstem","d":["Hindbrain + Midbrain."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Limbic System","d":["Forebrain structures involved in emotion + memory."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Cerebral cortex","d":["Recent, outermost forebrain structures involved in complex processes, including language + problem solving + impulse control + long term planning."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Neuropsychology","d":["The study of brain structure + function relationship."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Cortical Maps","d":["Brain cortex maps connecting structure and function."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Electroencephalogram (EEG)","d":["Test that measures brain electrical activity using electrodes."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Regional Cerebral Blood Flow (rCBF)","d":["Test that measures neural activity based on blood flow."],"lo":1},{"ch":1,"sec":"1.3 Organization of the brain","term":"Computed Tomography (CT) / Computed Axial Tomography (CAT)","d":["X-rays at different angles to create cross-sections of structure."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Positron Emission Tomography (PET)","d":["Radioactive sugar is injected, dispersed, and tracked. Activity."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Magnetic Resonance Imaging (MRI)","d":["Magnets to map brain structures."],"lo":0},{"ch":1,"sec":"1.3 Organization of the brain","term":"Functional MRI","d":["Magnets to track blood flow changes and activity."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Thalamus","d":["Forebrain structure that relays signals from the rest of the body. No smell."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Hypothalamus","d":["Forebrain structure for homeostasis (metabolism, temperature, water) and high arousal emotions. Signals hormone release.","• Lateral Hypothalamus (LH) – Triggers hunger + thirst.","• Ventromedial Hypothalamus (VMH) – Triggers fullness / satiety. Lesions lead to obesity.","• Anterior Hypothalamus – Triggers sexual arousal."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Posterior Pituitary","d":["Forebrain structure connected to hypothalamus; Site of release for hypothalamus hormones ADH + Oxytocin."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Pineal Gland","d":["Forebrain structure for biological rhythms. Secrete melatonin to control circadian rhythms.","• Melatonin – Hormone released by the pineal gland to control circadian rhythms."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Basal Ganglia","d":["Group of forebrain structures that coordinate muscle movement.","• Extrapyramidal System – Basal ganglia, gathers and sends signals to CNS. No motor neurons.","• Parkinson’s Disease – Shaky tremors due to lost basal ganglia dopamine neurons."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Limbic System","d":["Forebrain structures involved in emotion + memory."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Septal Nuclei","d":["Limbic system, pleasure."],"lo":1},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Amygdala","d":["Limbic system, defensive + aggressive behavior."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Hippocampus","d":["Limbic system, learning + memory."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Fornix","d":["Projection connecting hippocampus to (rest of) Limbic system."],"lo":1},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Anterior Cingulate Cortex","d":["Limbic system, impulse control + decision making. Involved in general Limbic system functions too."],"lo":1},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Cerebral Cortex / Neocortex","d":["Outer forebrain structure with bumps called gyri and sulci for more surface area. Most recent evolution; Divided into lobes.","• Frontal Lobe","• Parietal Lobe","• Occipital Lobe","• Temporal Lobe"],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Frontal Lobe","d":["Cerebral cortex lobe. Higher order thinking, voluntary movement."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Prefrontal Cortex","d":["Frontal lobe, supervises other brain regions. Decision-making and impulse control. Association area."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Primary Motor Cortex","d":["Frontal lobe, initiates voluntary movements; Neurons are organized by body part. On the precentral gyrus, in front of central sulcus. Projection area."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Broca’s Area","d":["Frontal lobe, speech production. Found in the dominant hemisphere."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Parietal Lobe","d":["Cerebral cortex lobe. Somatosensation, spatial processing."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Somatosensory Cortex","d":["Parietal lobe, receives and processes sensory signals for touch, pressure, temperature, pain; Neurons are organized by body part. On the postcentral gyrus, behind the central sulcus. Projection area."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Central Parietal Lobe","d":["Spatial processing, manipulation, orientation."],"lo":1},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Occipital Lobe","d":["Cerebral cortex lobe. Visual processing."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Visual / Striate Cortex","d":["Occipital lobe, visual processing."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Temporal Lobe","d":["Cerebral cortex lobe. Audio processing."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Auditory Cortex","d":["Temporal lobe, audio processing."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Wernicke’s Area","d":["Temporal lobe, speech processing."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Association Area","d":["Brain area that integrates inputs from multiple regions for complex tasks."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Projection Area","d":["Brain area involved in simpler, motor tasks."],"lo":1},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Cerebrum","d":["Large upper part of the forebrain, divided into left and right hemisphere. Includes cerebral cortex."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Anterograde Amnesia","d":["Inability to make new long term memories."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Retrograde Amnesia","d":["Inability to remember old memories."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Contralaterally","d":["Right brain communicates with left body. Usually the case."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Ipsilaterally","d":["Right brain communicates with right body."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Dominant Hemisphere","d":["Cerebrum hemisphere more stimulated during language. Analytical, logic, math, language (Broca/Wernicke’s Area). Usually left."],"lo":0},{"ch":1,"sec":"1.4 Parts of the Forebrain","term":"Nondominant Hemisphere","d":["Cerebrum hemisphere associated with intuition, creativity, music, spatial processing, holistic images. Interprets the emotional tone of language."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Neurotransmitter","d":["Chemical used by neurons, to send signals to other neurons."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Agonist","d":["Drug that mimics (and thus amplifies) neurotransmitter effects."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Antagonists","d":["Drug that blocks neurotransmitter effects."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Acetylcholine (ACh)","d":["Neurotransmitter. (PNS) Muscle contraction, Parasympathetic nervous system, (CNS) Attention and arousal, Alzheimers."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Catecholamine","d":["Type of monoamine neurotransmitter, involved in emotion."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Monoamine / Biogenic Amine","d":["Neurotransmitter type."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Epinephrine (Adrenaline)","d":["Catecholamine neurotransmitter; Alertness + Sympathetic nervous system. More widespread, hormone-like."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Norepinephrine (Noradrenaline)","d":["Catecholamine neurotransmitter; Alertness + Sympathetic nervous system. More local in scope. (Low) Depression, (High) Anxiety."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Dopamine","d":["Catecholamine neurotransmitter; Movement via basal ganglia, schizophrenia, Parkinson’s.","• Dopamine Theory of Schizophrenia – Too much or too sensitive to dopamine in the brain."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Serotonin","d":["Monoamine neurotransmitter; Regulates mood, eating/drinking, sleeping. (Low) Depression, (High) Anxiety."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Gamma-Aminobutyric Acid (GABA)","d":["Neurotransmitter that inhibits/stabilizes neural activity. Hyperpolarizes membranes."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Glycine","d":["Neurotransmitter and Amino Acid that inhibits/stabilizes neural activity. Hyperpolarizes membranes via Cl– influx into neurons."],"lo":1},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Glutamate","d":["Neurotransmitter and Amino Acid; excitatory via depolarization of membranes."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Neuromodulator / Neuropeptide","d":["Peptides involved in neurotransmission. Slower + longer."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Endorphins","d":["Neuromodulator painkillers, opioid-like effects."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Enkephalins","d":["Neuromodulator painkillers, opioid-like effects."],"lo":1},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Endocrine System","d":["Body system that uses hormones, which are slower + longer than neurotransmitters."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Hypophyseal Portal System","d":["Connects hypothalamus + pituitary gland, allowing for quick and direct hormonal control."],"lo":1},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Posterior Pituitary","d":["Forebrain structure connected to hypothalamus; Site of release for hypothalamus hormones ADH + Oxytocin."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Anterior Pituitary","d":["Master gland, releases hormones that regulate other endocrine glands."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Adrenal Gland","d":["On top of kidneys. Adrenal Medulla + Cortex.","• Adrenal Medulla – Adrenal gland, releases epinephrine/norepinephrine, sympathetic nervous system.","• Adrenal Cortex – Adrenal gland, releases corticosteroids (cortisol) and sex hormones (testosterone, estrogen)."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Gonads","d":["Sex glands, ovaries + testes. Release sex hormones at high concentrations, inducing libido or aggressive behavior in the case of testosterone."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Libido","d":["Lust."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Innate Behavior","d":["Genetically programmed behavior."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Learned Behaviors","d":["Behavior from experience/environment."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Adaptive Value","d":["How much a trait benefits a species by adaptation."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Nature vs Nurture","d":["Is behavior more influenced by genetics or environment?"],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Family Studies","d":["Study genetically related individuals, nature vs nurture."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Twin Studies","d":["Study twins, nature vs nurture.","• Monogzygotic (MZ) – Identical twins, 100% DNA.","• Dizygotic (DZ) – Fraternal twins, 50% DNA.","• Concordance Rate – Rate of twins having the same trait."],"lo":0},{"ch":1,"sec":"1.5 Influences on Behavior","term":"Adoption Studies","d":["Study adopted individuals, nature vs nurture."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Critical Periods","d":["Children are particularly susceptible to the environment."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Neurulation","d":["3-4 weeks. Embryonic process forming nervous system.","• Ectoderm furrows into a neural groove surrounded by 2 neural folds, which are edged by a neural crest.","• The neural groove closes into the neural tube, with alar plate + basal plate.","• Neural tube folds on itself to become 3 swellings (prosencephalon, mesencephalon, rhombencephalon).","• Neural tube folds on itself to become 5 swellings (telencephalon, diencephalon, MESencephalon, METencephalon, MYElencephalon)."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Neural Crest","d":["Embryonic structure that forms PNS structures."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Neural Tube","d":["Embryonic structure that forms CNS."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Alar Plate","d":["Embryonic structure that becomes sensory neurons."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Basal Plate","d":["Embryonic structure that forms motor neurons."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Umbilical Cord","d":["Connects fetus to placenta + uterine wall."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Placenta","d":["Gives food, oxygen, water to the fetus. Takes water, waste away."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Thalidomide","d":["Drug that led to limb defects."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Antiepileptic Medication","d":["Drug that leads to neural tube defects, spina bifida + anencephaly."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Reflex","d":["Behavior in response to stimuli, without higher cognitive process."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Primitive Reflex","d":["Baby reflex that disappears with age.","• Rooting Reflex – When their cheek is touched, a baby turns their head in that direction.","• Moro Reflex – When their head undergoes abrupt movement, a baby sticks out their arms + cries and slowly retracts their arms.","• Babinski Reflex – When their foot sole is touched, a baby spreads their toes.","• Grasping Reflex – When an object is placed in their hand, a baby grasps it."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Gross Motor Skills","d":["Motor skills involving large muscle groups and body."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Fine Motor Skills","d":["Motor skills involving smaller muscles, dexterity."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Stranger Anxiety","d":["Fear of strangers."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Separation Anxiety","d":["Fear of separation."],"lo":0},{"ch":1,"sec":"1.6 Development","term":"Parallel Play","d":["Children play near each other, but independently."],"lo":1},{"ch":1,"sec":"1.6 Development","term":"Developmental Milestones","d":["Skills expected to emerge at a certain stage in life. Motor skills progress head → toe and inside → outside. Social skills progress from parents → self → others.","• Newborn – Reflexes","• 3 Months – Lifts Head, Cooing","• 6 Months – Sits, Babbling, Stranger Anxiety","• 1 Year – Walks, First Words, Separation Anxiety, Object Permanence","• 2 Years – Independent Movement, Parallel Play","• 3 Years – Complete Sentences, Gender-stereotyped Play","• 4 Years – Cooperative Play"],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Sensation / Transduction","d":["External stimuli converted to electrical signals."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Perception","d":["Processing the newly-transduced electrical signals to make sense of it. Begins in the projection area, then association area."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Sensory Receptor","d":["Neurons that respond to stimuli, by sending electrical signals to the CNS.","• Photoreceptor – Light.","• Mechanoreceptors – Pressure, Movement.","• Nociceptors – Pain (Somatosensation)","• Thermoreceptors – Temperature (Thermosensation)","• Osmoreceptors – Blood Osmolarity (Homeostasis)","• Olfactor Receptors – Smell"],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Distal Stimuli","d":["Stimuli outside the body."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Proximal Stimuli","d":["Sensory-stimulating, typically produced by distal stimuli."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Psychophysics","d":["Relationship between physical stimuli + invoked sensation/perception."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Ganglia","d":["Clusters of neuron cell bodies outside CNS."],"lo":1},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Threshold","d":["Minimum stimulus amount that creates a difference in perception.","• Absolute Threshold – Minimum stimulus amount to activate a sensory system. Sensation threshold.","• Threshold of Conscious Perception – Minimum stimulus amount for conscious perception by the brain. Perception threshold.","◦ Subliminal Perception – Perception that occurs when stimulus amount does not reach threshold of conscious perception.","• Difference Threshold / Just Noticeable Difference (JND) – Minimum change in stimulus amount for the perception of stimuli difference."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Discrimination Testing","d":["Test if an observer can detect difference between stimuli."],"lo":1},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Weber’s Law","d":["JND is proportional to initial stimulus intensity, not constant.","ΔI = JND, I = Initial Intensity of Stimulus, k = Constant, aka Weber’s Fraction"],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Signal Detection Theory","d":["At what point can we detect a signal when uncertainty is involved?","• Hit – A true positive. Yes when there is a signal.","• False Alarm – A false positive. Yes when there is no signal.","• Correct Rejection – A true negative. No when there is no signal.","• Miss – A false negative. No where there is a signal."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Response Bias","d":["Someone tends to answer a certain way, regardless of evidence."],"lo":0},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Noise Trials","d":["Signal detection test, yes signal."],"lo":1},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Catch Trials","d":["Signal detection test, no signal."],"lo":1},{"ch":2,"sec":"2.1 Sensation vs Perception","term":"Adaptations","d":["Change in our ability to detect a stimulus. Sensory / physiological component (pupil dilation) + Perceptual / psychological component."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Sclera","d":["White part of eye"],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Choroid","d":["Vascular layer between retina + sclera. Continuous with iris.","• Choroidal Vessels – Blood vessels supplying the eye, between sclera + retina."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Retina","d":["Innermost eye layer, with photoreceptors transducing light into electrical signals (sensation). Part of CNS.","• Retinal Vessels – Blood vessels supplying the eye, on the retina."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Cornea","d":["Dome-like window in front of the eye; main focusing of light."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Anterior Chamber","d":["Front eye chamber, in front of the iris."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Posterior Chamber","d":["Front eye chamber, between iris + lens."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Iris","d":["Colored part of the eye.","• Dilator Pupillae – Dilates pupils under sympathetic conditions.","• Constrictor Pupillae – Constricts pupils under parasympathetic conditions."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Ciliary Body","d":["Produces aqueous humor, which bathes front eye + drains into Canal of Schlemm. Continuous with iris."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Aqueous Humor","d":["Front eye liquid, drains into the Canal of Schlemm."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Canal of Schlemm","d":["Drains aqueous humor."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Lens","d":["Behind the iris, refracts incoming light for fine-tuning."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Ciliary Muscle","d":["Muscle that bends lens via suspensory ligaments. Under parasympathetic control."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Suspensory Ligaments","d":["Connect ciliary muscle to lens, facilitating accommodation."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Accommodation","d":["Lens shape is changed by ciliary muscle + suspensory ligaments to focus on an image, as distance varies."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Vitreous Humor","d":["Eyeball jelly, supporting eye shape + retina."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Duplexity / Duplicity Theory of Vision","d":["Retina has 2 kinds of photoreceptors, 1 for light and dark, 1 for color detection.","• Cones – Photoreceptors used for color + fine details in bright light. 3 kinds of cones (Short/blue, Medium/green, Long/red) stimulated by a corresponding light wavelength. Less sensitive to light, due to wavelength specificity. Less convergence, so more accuracy.","• Rods – Photoreceptors used for dark vision + raw vision. 1 kind, all with rhodopsin and stimulated by any light wavelength. More sensitive to light, but less detail oriented."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Rhodopsin","d":["Pigment in rods."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Macula","d":["Central part of the retina. High concentration of cones."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Fovea","d":["Central part of the macula. Only cones."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Peripheral Retina","d":["Outer part of the retina. High concentration of rods."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Blind Spot","d":["Part of the retina where the optic nerve is. No photoreceptors."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Bipolar Cells","d":["Neurons, receive signals from photoreceptors, send to ganglion cells."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Ganglion Cells","d":["Neurons that receive signals from bipolar cells, send to brain. Axons form optic nerve."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Optic Nerve","d":["Axons of ganglion cells."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Amacrine Cell","d":["Retina interneurons connecting bipolar cells + ganglion cells laterally."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Horizontal Cell","d":["Retina interneurons connecting photoreceptors laterally. Sharpen edges via comparison."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Visual Pathway","d":["Anatomical connection between eyes and brain + flow of visual information along this connection.","• Left half of retinas receives light from the right half of the visual field, and sends signals to the left half of the brain."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Temporal Fiber","d":["Optic nerve fibers from the temporal (outer) side of each retina. Do not cross."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Nasal Retina Fiber","d":["Optic nerve fibers from the nasal (inner) side of each retina. Cross at the optic chiasm."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Temporal Visual Field","d":["Outer visual field. Hits the nasal retinal fibers."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Nasal Visual Field","d":["Inner visual field. Hits the temporal retinal fibers."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Optic Chiasm","d":["Where nasal retinal fibers cross."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Optic Tracts","d":["Reorganized visual pathway after the optic chiasm. From here, signals go to (1) Thalamus, LGN → visual cortex (2) Superior colliculi."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Visual Radiation","d":["Nerve pathways connecting thalamus → visual cortex."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Lateral Geniculate Nucleus (LGN)","d":["Part of the thalamus that receives signals from retinal fibers. Sends signals to the visual cortex for conscious processing.","• LGN Pathway – Retina → optic nerve → optic chiasm → optic tract → LGN (thalamus) → visual cortex."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Parallel Processing","d":["Brain analyzes multiple pieces of information simultaneously. Speed."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Serial Processing","d":["Brain analyzes information sequentially. Accuracy."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"(1) Color","d":["4 aspects of vision. Cones."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"(2) Form","d":["4 aspects of vision. Shape and distinctiveness from the background."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Parvocellular Cells","d":["Neurons in the LGN pathway, with high spatial (form) resolution, low temporal resolution."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Spatial Resolution","d":["Ability to distinguish fine details."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"Temporal Resolution","d":["Ability to detect change, often movement."],"lo":1},{"ch":2,"sec":"2.2 Vision","term":"(3) Motion","d":["4 aspects of vision."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Magnocellular Cells","d":["Neurons in the LGN pathway, with high temporal resolution, low spatial resolution."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"(4) Depth Perception","d":["4 aspects of vision. 3-dimensional shape and distances."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Binocular Neurons","d":["Visual cortex neurons that compare right/left brain hemisphere input differences to process 3D."],"lo":0},{"ch":2,"sec":"2.2 Vision","term":"Feature Detectors","d":["Visual cortex neurons that fire in response to a specific visual feature. Can be packaged into complete perception of an object.","Photoreceptors → Bipolar Cells → Ganglion Cells (Optic Nerve) → Brain"],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Vestibular Sense","d":["Ability to (1) Detect rotational / linear acceleration (2) Process it to inform balance and spatial orientation."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Pinna / Auricle","d":["Cartilaginous outer ear."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"External Auditory Canal","d":["Outer ear; receives sound waves from pinna, sends to tympanic membrane."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Tympanic Membrane / Eardrum","d":["Outer ear; vibrates in response to soundwave intensity. Divides outer ear from middle ear.","• Intensity – Refers to the power of a wave, related to amplitude (wave height)."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Ossicles","d":["3 smallest bones, middle ear. Transmits soundwaves from tympanic membrane → inner ear.","• Malleus / Hammer – Ossicle attached to tympanic membrane, transmits vibration from eardrum → incus.","• Incus / Anvil – Ossicle between malleus + stapes.","• Stapes / Stirrup – Ossicle attached to oval window, transmits vibrations from incus → oval window (inner ear)."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Eustachian Tube","d":["Connects middle ear + nasal cavity; pressure equalization."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Bony Labyrinth","d":["Inner ear; hollow region of temple bone containing inner ear.","• Perilymph – Fluid suspending membranous labyrinth in bony labyrinth. Transmits vibrations + cushions inner ear."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Membranous Labyrinth","d":["Inner ear; membranous tube collection filled with endolymph. Suspended in the bony labyrinth via perilymph.","• Endolymph – Potassium-rich fluid inside membranous labyrinth."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Oval Window","d":["Inner ear; membrane transmitting vibrations from stapes → cochlea. Bony labyrinth window."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Cochlea","d":["Inner ear; spiral-shaped, bony labyrinth organ cavity with hearing receptors. Divided into 3 scalae.","• Scalae – Subdivision of the cochlea, part of the bony labyrinth."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Organ of Corti","d":["Inner ear; thousands of hair cells resting on the basilar membrane, with the tectorial membrane above it. Suspended in endolymph, in the middle scala. Transduces physical movement of hair cells to electrical signal.","• Basilar Membrane – Membranous labyrinth, underneath the organ of Corti.","• Tectorial Membrane – Membranous labyrinth, above the organ of Corti."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Round Window","d":["Inner ear; membrane that stretches to allow perilymph movement in the cochlea. Bony labyrinth window."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Auditory / Vestibulocochlear Nerve","d":["Bundle of neuron axons, carry electrical signals transduced by the organ of Corti’s hair cells → CNS. From here, signals go to (1) Thalamus, MGN → auditory cortex (2) Inferior colliculi (3) Superior Olive."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Vestibule","d":["Bony labyrinth part with utricle + saccule, involved linear acceleration related balance."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Utricle","d":["Vestibule structure with otolith-covered hair. Linear acceleration related balance."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Saccule","d":["Vestibule structure with otolith-covered hair. Linear acceleration related balance."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Otoliths","d":["Cover utricle/saccule hair cells and resists linear acceleration, signaling to the brain."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Semicircular Canals","d":["Bony labyrinth part; 3 semicircular canals/ducts arranged perpendicularly + ending in ampulla. Involved in rotational acceleration related balance."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Ampulla","d":["Swelling at the end of the 3 semicircular ducts, containing hair cells. Endolymph resists rotational acceleration, bending hair cells and signaling to the brain."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Medial Geniculate Nucleus (MGN)","d":["Part of the thalamus that receives signals from auditory / vestibulocochlear nerves. Sends them to the auditory cortex for conscious processing."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"MGN Pathway","d":["Cochlea / Organ of Corti → auditory nerve → brainstem → MGN (thalamus) → auditory cortex."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Superior Olive","d":["Brainstem structure involved in sound localization."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Vestibulo-Ocular Reflex","d":["Eyes remain on target when your head moves."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Hair Cells","d":["Inner ear; sensory receptors that convert physical movement into electrical signal."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Stereocilia","d":["Tiny projections on hair cells. Open ion channels and depolarize when bent."],"lo":1},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Place Theory","d":["Because of the varying thickness of the basilar membrane, pitch is determined by where the basilar membrane vibrates the most."],"lo":0},{"ch":2,"sec":"2.3 Hearing and Vestibular Sense","term":"Tonotopic Organization","d":["Hair cells are arranged on the basilar membrane, such that hair cell location matches pitch responsiveness. Cochlea base hair cells respond to high pitch, cochlea tip hair cells respond to low pitch."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Nerve","d":["Bundle of many neuron axons."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Chemoreceptor","d":["Receptors that detect stimuli by binding chemicals."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Olfactory Chemoreceptor","d":["Smell receptors."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Olfactory Nerves","d":["Nerves that transmit signals from the olfactory chemoreceptors → brain."],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Pheromones","d":["Secreted chemicals that compel an animal to behave in a certain way."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Olfactory Pathway","d":["Nasal passage → Olfactory Epithelium, Olfactory nerves → Olfactory bulb → Olfactory Tract → Brain"],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Taste Buds","d":["Taste chemoreceptors, dissolved compounds."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Papillae","d":["A group of taste buds on the tongue; bump."],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Taste Pathway","d":["Taste buds → Brainstem → Taste center → Brain"],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Taste Center","d":["Part of thalamus that relays taste information."],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Somatosensation","d":["Essentially touch. Includes pressure, vibration, pain, temperature. Processed by somatosensory cortex, parietal lobe.","• Pacinian Corpuscles – Somatosensation receptor, deep pressure + vibration.","• Meissner Corpuscles – Somatosensation receptor, light touch.","• Merkel Cells / Discs – Somatosensation receptor, deep pressure + texture.","• Ruffining Endings – Somatosensation receptor, stretch.","• Free Nerve Endings – Somatosensation receptor, pain + temperature."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Somatosensory Cortex","d":["Parietal lobe, receives and processes sensory signals for touch, pressure, temperature, pain; Neurons are organized by body part. On the postcentral gyrus, behind the central sulcus. Projection area."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"2 Point Threshold","d":["Minimum distance between 2 stimulation points on skin to be perceived as 2 distinct stimuli. Depends on nerve density."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Physiological Zero","d":["The normal temperature of skin, to which other temperatures are compared."],"lo":1},{"ch":2,"sec":"2.4 Other Senses","term":"Gate Theory of Pain","d":["Pain signals can be blocked or reduced in the spinal cord before reaching the brain, like a gate. Rubbing a wound may reduce pain signals by replacing them with rubbing signals."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Kinesthetic Sense / Proprioception","d":["The ability to discern the body’s spatial position. Important for hand-eye coordination, balance, mobility."],"lo":0},{"ch":2,"sec":"2.4 Other Senses","term":"Proprioceptors","d":["Proprioception receptors, found in muscles or joints."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Bottom-up / Data-driven Processing","d":["Object recognition via parallel processing + feature detection. Combine individual components. New things."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Top-down / Conceptually-driven Processing","d":["Object recognition via memories + expectations. Familiar things."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Perceptual Organization","d":["Ability to create a complete idea by combining bottom-up, top-down, other senses."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Monocular Cues","d":["Visual cues that only need 1 eye.","• Relative Size – Objects appear bigger when closer.","• Relative Height – Objects appear higher when further .","• Motion Parallax – Objects appear to move faster when closer.","• Interposition – When objects overlap, the one in front is closer.","• Shading & Contour – Light and shadows estimate object form and depth.","• Linear Perspective – Parallel lines appear to converge with distance.","• Accommodation – Eye lens change shape; closer = curve, farther = flat.","• Texture Gradient – Object texture appears smoother or less detailed with distance."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Binocular Cues","d":["Visual cues that require 2 eyes.","• Retinal Disparity – Images seen by left and right eyes have differences. Depth perception.","• Convergence – Eyes turn inward to focus on an object. The inward turning angle estimates distance. Depth perception."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Perceptual Constancy","d":["Perceiving objects as unchanged even when the sensory input changes.","• Size Constancy – Despite relative size changes, the object is the same size.","• Shape Constancy – Despite orientation changes, the object is the same shape.","• Color Constancy – Despite lighting changes, the object is the same color."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Gestalt Principles","d":["Describe the brain’s tendencies to group and organize sensory information.","• Law of Pragnanz – Your brain picks the simplest perceptual organization/interpretation of a visual form.","• Law of Similarity – Similar objects are grouped together by your brain.","• Law of Proximity – Objects close together are grouped together by your brain.","• Law of Continuity / Good Continuation – Lines are organized to follow the smoothest path by your brain.","• Law of Closure – Incomplete objects are completed by the brain.","• Subjective Contours – Edges or shapes can be perceived despite not being drawn. Negative space.","• Law of Common Fate – Objects that move together are grouped together by your brain.","• Law of Past Experience – Your past experiences influence your current perception.","• Symmetry – The brain tends to look for symmetry and center points."],"lo":0},{"ch":2,"sec":"2.5 Object Recognition","term":"Contextual Effects","d":["Context and environment affect your perception."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Learning","d":["The way we acquire new behavior."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Stimulus","d":["Anything an organism can respond to."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Habituation","d":["A decrease in response due to repeated exposure to a stimulus."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Subthreshold Stimulus","d":["Stimulus too weak to get a response."],"lo":1},{"ch":3,"sec":"3.1 Learning","term":"Dishabituation","d":["Recovery in stimulus response, after habituation."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Associative Learning","d":["Forming associations between stimuli, or stimuli and response."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Classical Conditioning","d":["Form of associative learning that creates associations between unconditioned stimuli + neutral stimuli, creating conditioned stimuli.","• Unconditioned Stimulus – A stimulus that brings about a reflexive response.","• Unconditioned Response – A reflexive response to an unconditioned stimulus.","• Neutral Stimuli – Stimuli that do not bring about a reflexive response.","• Conditioned Stimulus – A neutral stimulus that brings about a reflexive (conditioned) response due to classical conditioning.","• Conditioned Response – A reflexive response to a conditioned (neutral) stimulus, due to classical conditioning."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Acquisition","d":["Process of using unconditioned stimulus to turn neutral stimulus → conditioned stimulus."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Appetitive Conditioning","d":["Classical conditioning involving a pleasant unconditioned stimulus."],"lo":1},{"ch":3,"sec":"3.1 Learning","term":"Appetitive Stimulus","d":["A pleasant unconditioned stimulus."],"lo":1},{"ch":3,"sec":"3.1 Learning","term":"Extinction","d":["Loss of a conditioned response."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Spontaneous Recovery","d":["Recovery of a conditioned response after extinction."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Generalization","d":["Process where stimuli similar to the conditioned stimulus produce the conditioned response."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Discrimination","d":["Organism learns to discriminate between similar stimuli."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Operant Conditioning","d":["Associative learning where behaviors have consequences, thus changing the frequency of that behavior."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Law of Effect","d":["Behaviors with good consequences will be repeated."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Behaviorism","d":["Idea that all behaviors are conditioned."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Reinforcement","d":["Operant conditioning that increases frequency of a behavior.","• Positive Reinforcement – Increase frequency of a behavior by adding something good.","• Negative Reinforcement – Increase frequency of a behavior by removing something bad.","◦ Escape Learning – Negative reinforcement; You experience something bad, so you exhibit the desired behavior to escape the bad stimulus.","◦ Avoidance Learning – Negative reinforcement; You anticipate something bad, so you exhibit the desired behavior to escape the bad stimulus."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Primary Reinforcer","d":["Naturally rewarding stimulus that can encourage a behavior."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Secondary / Conditioned Reinforcer","d":["A stimulus that can become rewarding through association with a primary reinforcer."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Discriminative Stimulus","d":["A stimulus that indicates the possibility of reward."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Delayed Reinforcement","d":["A reward is given some time after the desired behavior. Less effective than immediate reinforcement."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Punishment","d":["Operant conditioning that decreases frequency of a behavior.","• Positive Punishment – Decrease frequency of a behavior by adding something bad.","• Aversive Conditioning – Positive punishment.","• Negative Punishment – Decrease frequency of a behavior by removing something good."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Reinforcement Schedule","d":["A pattern that specifies when/how often reinforcement occurs.","• Fixed-ratio (FR) Schedule – Reinforcement schedule; reinforce a behavior after a specific number of times that behavior is performed.","• Variable-ratio (VR) Schedule – Reinforcement schedule; reinforce a behavior after a varying number of times that behavior is performed. Average. Fastest and most resistant to extinction.","• Fixed-interval (FI) Schedule – Reinforcement schedule; reinforce a behavior after a specific amount of time has passed.","• Variable-interval (VI) Schedule – Reinforcement schedule; reinforce a behavior after a variable amount of time has passed."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Shaping","d":["Process of rewarding behaviors that are more and more similar to the desired behavior. Baby steps."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Latent Learning","d":["Learning that occurs without reward; behavior is hidden until a reward is introduced."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Preparedness","d":["Some animals have a higher biological predisposition to learn associations."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Instinctive Drift","d":["An animal drifts back to its instinctual behavior after learning something new/similar."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Observational Learning","d":["Learn a new behavior by watching others. Bobo the clown."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Mirror Neurons","d":["Frontal, parietal lobe neurons that fire when another being’s visible action matches an action your own brain knows how to perform."],"lo":0},{"ch":3,"sec":"3.1 Learning","term":"Modeling","d":["Observational learning; you see someone do something, and imitate it."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Encoding","d":["Memorize new information.","• Visual Encoding – Encode visuals.","• Acoustic Encoding – Encode sounds.","• Elaborative Encoding – Encode something by contextualizing it with what you know.","• Semantic Encoding – Encode something by understanding its meaning. Strongest."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Automatic Processing","d":["Information gained without effort."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Controlled / Effortful Processing","d":["Information gained with effort. Studying."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Rehearsal","d":["Strengthen encoded information.","• Maintenance Rehearsal – Repeating information helps keep it in working memory.","• Elaborative Rehearsal – Consolidate information into long-term memory by connecting it to things you already know."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Self-Reference Effect","d":["Encoding is more effective when you connect it to yourself."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Encoding Specificity","d":["When current conditions match the conditions in which you learned something, you can recall it better."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Mnemonics","d":["A memory aid that helps you remember things.","• Method of Loci – Mnemonic; associate a list item with a location in a building you know.","• Peg-Word System – Mnemonic; associate a list item with a peg word, a word permanently linked to a number. Peg word is tree/3, pour milk over a tree.","• Chunking / Clustering – Mnemonic; group individual list items into related groups."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Sensory Memory","d":["Brief storage of raw, sensory information.","• Iconic Memory – Brief visual sensory information / memory.","• Echoic Memory – Brief auditory sensory information / memory."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Whole-Report","d":["Remember all items from a briefly shown display."],"lo":1},{"ch":3,"sec":"3.2 Memory","term":"Partial Report","d":["Remember some items from a briefly shown display."],"lo":1},{"ch":3,"sec":"3.2 Memory","term":"Short-Term Memory","d":["Temporary conscious memory."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Memory Capacity","d":["Short-term memory can hold ~7±2"],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Hippocampus and Memory","d":["Hippocampus turns Short-term memory → Long-term memory. Super long-term memory is moved to the cerebral cortex."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Working Memory","d":["Active “workspace” memory where you hold and use information from short-term and long-term memory."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Long-Term Memory","d":["Permanent conscious memory, near limitless."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Implicit / Nondeclarative Memory","d":["Long-term memory; skills, habits, conditioned responses. Things we can’t put into words, more unconscious.","• Procedural Memory – Implicit memory; used for skills like bikes.","• Priming – Implicit memory; exposure to 1 stimulus makes you recall/respond differently to another stimulus.","• Positive Priming – Implicit memory; exposure to 1 stimulus makes you recall/respond faster to another stimulus.","• Negative Priming – Implicit memory; exposure to 1 stimulus makes you recall/respond slower to another stimulus."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Explicit / Declarative Memory","d":["Long-term memory; Memories you can put into words, and consciously recall.","• Episodic Memory – Explicit memory; memories of life experiences.","• Semantic Memory – Explicit memory; concepts, ideas, general facts we know.","• Autobiographical Memory – Refers to explicit memories about ourselves, and concepts related to ourselves."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Retrieval","d":["Retrieve stored information out of memory. Usually involves priming + retrieval cues.","• Recall – Retrieval without hints.","• Recognition – Retrieval with hints, usually easier."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Relearning","d":["Learning something you’ve already learned, usually faster."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Spacing Effect","d":["Learning works better when it’s spread out. Why cramming is bad."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Semantic Network","d":["Mental network that organizes related concepts from semantic memory."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Spreading Activation","d":["Activating 1 node of a semantic network unconsciously activates other nodes around it."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Recall / Retrieval Cue","d":["Cue that helps trigger retrieval.","• Context Effect – Retrieval cue; you can retrieve things better in the location you originally learned it.","• State-dependent Memory / Effect – Retrieval cue; you can retrieve things better when you’re in the same mental state as when you originally learned it."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Source Monitoring","d":["During retrieval, you remember a memory’s origin."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Serial-Position Effect","d":["Items at the beginning or end of a list are easier to retrieve.","• Primacy Effect – Items at the beginning of a list are easier to retrieve.","• Recency Effect – Items at the end of a list are easier to retrieve."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Amnesia","d":["Significant loss of memorized information."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Source Amnesia","d":["You forget where you learned something."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Alzheimer’s Disease","d":["Theorized to involve loss of ACh in hippocampus neurons.","• Neurofibrillary Tangles – Alzheimer’s; protein tangles.","• Beta-Amyloid Plaques – Alzheimer’s; protein plaques.","• Sundowning – Increase in Alzheimer’s related dysfunction later in the day."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Dementia","d":["Loss cognitive function."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Korsakoff’s Syndrome","d":["Memory loss from thiamine (B1) disease, involving both anterograde + retrograde amnesia.","• Confabulation – Create vivid, fake memories."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Agnosia","d":["Loss of ability to recognize people + objects + sounds."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Decay","d":["Natural loss of short-term memories over time."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Retention Function","d":["Curve of forgetting, L-shaped. You forget a lot initially, then less."],"lo":1},{"ch":3,"sec":"3.2 Memory","term":"Interference","d":["Retrieval of information is inhibited by similar information.","• Proactive Interference – Old information interferes with new learning.","• Retroactive Interference – New information interferes with retrieval of old information."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Aging and Memory","d":["Age doesn’t inherently lead to significant memory loss."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Prospective Memory","d":["Remembering to do something later. Time-based prospective memory declines with age."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Reproductive Memory","d":["Reproduce an event exactly how it happened. Doesn’t happen."],"lo":1},{"ch":3,"sec":"3.2 Memory","term":"Reconstructive Memory","d":["Reconstruct an event using imagination, semantic memory, etc."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"False Memory","d":["Memory inaccurately reconstructed."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Recovered Memories","d":["Repressed memories brought back into the conscious."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Misinformation Effect","d":["Your memory becomes less accurate when exposed to misinformation."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Intrusion Errors","d":["Your other memories intrude on one of your memories, making a false memory."],"lo":0},{"ch":3,"sec":"3.2 Memory","term":"Source-monitoring Error","d":["You incorrectly identify the source of a memory."],"lo":0},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Neuroplasticity","d":["The brain’s ability to change and reorganize itself, best in kids."],"lo":0},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Synaptic Cleft","d":["Space between a neuron and target cell."],"lo":1},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Synaptic Pruning","d":["The brain removes weak neural connections."],"lo":0},{"ch":3,"sec":"3.3 Neurobiology of Learning and Memory","term":"Long-term Potentiation","d":["The brain strengthens neural connections. Responsible for short-term → long-term memory.","Sensory Memory (Visual Cortex, etc.) → Short-term, Long-term Memory (Hippocampus) → Long-term Memory (Cerebral Cortex)"],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Cognition","d":["Study of how our brains process and react to information."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Dual-Coding Theory","d":["Paivio, both verbal association + visual images process and store information."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Information Processing Model","d":["• Thinking requires sensation + encoding + storage of stimuli.","• Stimuli must be analyzed by the brain for decision making.","• Decisions made in 1 situation can be used + modified to help new problems.","• Problem solving depends on a problem’s context + complexity, not just cognition."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Cognitive Development","d":["Development of your ability to think + solve problems."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Jean Piaget","d":["Stages of cognitive development.","• Sensorimotor Stage – 0–2 years. Manipulate environment, coordinate sensory + motor. Ends with object permanence.","• Preoperational Stage – 2–7 years. Symbolic thinking, egocentrism, no conservation.","• Concrete Operational Stage – 7–11 years. Conservation, basic logic, no egocentrism, no abstract.","• Formal Operational Stage – 11 years. Abstract thought, hypothetical reasoning."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Schema","d":["Mental framework used to organize information. Ranges from objects, behaviors, sequences, etc."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Adaptation","d":["Processing of new information.","• Assimilation – Process of classifying new info into a schema.","• Accommodation – Process of changing a schema to accommodate new information."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Circular Reactions","d":["• Primary Circular Reactions – Sensoriomotor stage; repetitions of actions focused on the baby’s body, pleasurable or interesting. First occurred by chance.","• Secondary Circular Reactions – Sensoriomotor stage; Repetitions of actions focused on the environment, produce an interesting effect."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Object Permanence","d":["Things exist even when not in view. Ends sensorimotor stage."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Representational Thought","d":["Baby begins to make mental representations of real things."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Symbolic Thinking","d":["Ability to pretend, make-believe, imagination."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Egocentrism","d":["Inability to imagine what someone else thinks or feels."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Conservation","d":["An amount is the same regardless of shape or appearance."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Centration","d":["Tendency to hyperfocus on one aspect of something."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Hypothetical Reasoning","d":["Ability to think of what if’s, not just what’s directly available."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Lev Vygotsky","d":["Cognitive development is influenced by culture + social interaction."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Zone of Proximal Development","d":["Vygotsky; what a child can do with help, but not alone."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Scaffolding","d":["Vygotsky; temporary support that helps a child learn."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Fluid Intelligence","d":["Ability to solve new or unfamiliar problems. Declines with age."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Crystallized Intelligence","d":["Ability to solve familiar problems using acquired knowledge."],"lo":0},{"ch":4,"sec":"4.1 Cognition","term":"Activities of Daily Living","d":["Eating, bathing, etc."],"lo":1},{"ch":4,"sec":"4.1 Cognition","term":"Delirium","d":["Temporary, reversible change in cognitive function, usually caused by medical problems."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Mental Set","d":["Tendency to approach similar problems in the same way."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Functional Fixedness","d":["Inability to consider using an object in a non-traditional way."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Trial-and-Error","d":["Try many solutions until one works."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Algorithm","d":["Formula used to solve a problem."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Deductive / Top-down Reasoning","d":["Use general rules and apply it to a specific example."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Inductive / Bottom-up Reasoning","d":["Use specific examples to build a general rule."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Heuristics","d":["Simplified rules used to make decisions. Rule of thumb.","• Availability Heuristic – Judge the likelihood of an event, by how easily we can recall instances of that event.","• Representativeness Heuristic – Judge the likelihood of an event, by comparing it to a generalization. Essentially stereotyping."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Base Rate Fallacy","d":["Using generalizations instead of actual numerical information."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Disconfirmation Principle","d":["If evidence does not support a solution/hypothesis, it is disconfirmed, and therefore should be discarded."],"lo":1},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Confirmation Bias","d":["Tendency to focus more on information that supports one’s beliefs."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Belief Perseverance","d":["Inability to reject a belief, despite clear evidence against it."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Hindsight Bias","d":["Tendency to underestimate something once you know its solution or fate."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Intuition","d":["Quick judgement through unconscious pattern recognition rather than conscious reasoning."],"lo":1},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Recognition-primed Decision Model","d":["Use of experience + unconscious pattern recognition to make decisions. Under this model, intuition is a component in familiar situations."],"lo":1},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Emotion","d":["Subjective experience during a specific situation."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Multiple Intelligence Theory","d":["Intelligence is defined not as one ability, but many unique abilities. Howard Gardner.","• Linguistic Intelligence","• Logical-Mathematical Intelligence","• Visual-Spatial Intelligence","• Bodily-Kinesthetic Intelligence","• Interpersonal Intelligence – Ability to detect + navigate moods of others.","• Intrapersonal Intelligence – Ability to detect + navigate your own mood.","• Naturalist Intelligence – Nature intelligence."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Triarchic Theory of Human Intelligence","d":["3 kinds of intelligence. Robert Sternberg.","• Analytical Intelligence – Ability to analyze and reason.","• Creative Intelligence – Unfamiliar problem solving ability, creativity.","• Practical Intelligence – Familiar, everyday problem solving ability."],"lo":0},{"ch":4,"sec":"4.2 Problem Solving, Decision Making","term":"Theory of Emotional Intelli
