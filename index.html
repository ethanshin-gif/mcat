 Friendly and honest."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Halo Effect","d":["One positive trait makes you assume one has other positive traits."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Just-World Hypothesis","d":["Belief that good things happen to good people, bad things happen to bad people. Karma. Possible victim-blaming."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Self-Serving (Attributional) Bias","d":["Good things happen due to internal factors, bad things happen due to external factors."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Self-Enhancement Bias","d":["You want to see yourself more positively."],"lo":1},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Self-Verification Bias","d":["You want to confirm your own views about yourself. Confirmation bias applied to self-concept."],"lo":1},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"In-Group Bias","d":["You tend to see people inside of your group favorably."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Out-Group Bias","d":["You tend to see people outside of your group harshly."],"lo":1},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Attribution Theory","d":["Fritz Heider; how people explain the cause of behavior/events.","• Dispositional / Internal Attributions – Explaining behaviors/events as being caused by the person.","• Situational / External Attributions – Explaining behaviors/events as being caused by the environment or circumstances.","• Consistency Cues – Cues related to a person’s behavior over time.","• Consensus Cues – Cues related to how much someone’s behavior differs from others.","• Distinctiveness Cues – Information about if a behavior is limited to a single situation or occurs across many scenarios."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Correspondent Inference Theory","d":["People tend to infer someone’s traits from behavior, especially when it's unexpected."],"lo":1},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Fundamental Attribution Error","d":["When judging others, people are more likely to make dispositional attributions."],"lo":0},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Attribute Substitution","d":["In complex situations, people unconsciously make simpler judgements to estimate."],"lo":1},{"ch":10,"sec":"10.2 Social Perception and Behavior","term":"Cultural Attribution","d":["The culture of a person has an impact on the kinds of attributions they make."],"lo":0},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Stereotypes","d":["Expectations, impressions, opinions about members of a group and/or their characteristics."],"lo":0},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Stereotype Content Model","d":["Classifies stereotypes into 2 dimensions: warmth, competence.","• Warmth – Stereotype Content Model; is someone friendly?","• Competence – Stereotype Content Model; is someone capable?","• Paternalistic Stereotype – Stereotype Content Model; stereotypes that see a group with high warmth + low competence. Pity.","• Contemptuous Stereotype – Stereotype Content Model; stereotypes see a group as low warmth + low competence. Contempt.","• Envious Stereotype – Stereotype Content Mode; stereotypes see a group as low warmth + high competence.","• Admiration Stereotype – Stereotype Content Model; stereotypes see a group as high warmth + high competence."],"lo":1},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Self-Fulfilling Prophecy","d":["Your expectations create conditions that fulfill those expectations."],"lo":0},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Stereotype Threat","d":["Someone stresses they might confirm a negative stereotype, which ends up hurting their performance. Self-fulfilling prophecy."],"lo":0},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Prejudice","d":["Irrational positive or negative attitude towards something, without actual experience.","• Power – Ability to achieve a goal despite obstacles.","• Prestige – Level of respect shown to a person by others.","• Class – Socioeconomic status."],"lo":0},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Propaganda","d":["Biased or misleading information used to influence people, usually for a goal."],"lo":1},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Ethnocentrism","d":["Judging another culture based on the standards of your own culture."],"lo":0},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Cultural Relativism","d":["Cultures should be studied by their own terms, to avoid ethnocentrism."],"lo":0},{"ch":10,"sec":"10.3 Stereotypes, Prejudice, Discrimination","term":"Discrimination","d":["Prejudice causes individuals of a group to be treated differently. Behavior to prejudice attitude.","• Individual Discrimination – An individual discriminates against a person/group.","• Institutional Discrimination – An institution or group discriminates against a person/group."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Sociology","d":["Study of society and its creation, interactions, changes, norms, etc.","• Micro – Sociology level; family groups and communities.","• Meso – Sociology level; organizations and institutions.","• Macro – Sociology level; national and international systems."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Theoretical Approaches to Society","d":["Frameworks used by sociologists to explain how society works + human behavior within society.","• Symbolic Interactionism","• Social Constructionism","• Rational Choice / Social Exchange Theory","• Conflict Theory","• Structural-Functionalism Theory","• Feminist Theory"],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Symbolic Interactionism","d":["George Herbert Mead; model that studies human interaction via symbols used to communicate. Micro.","• Symbol – Anything that carries meaning."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Social Constructionism","d":["Model that studies human interaction via social constructs. Micro, Meso.","• Social Construct – An idea created and accepted by people in society."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Rational Choice / Social Exchange Theory","d":["Model that studies human interaction via individual decision-making. Micro."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Conflict Theory","d":["Karl Marx; model that studies society by examining conflicts between its groups. Bourgeoisie vs Proletariat. Macro.","• Capitalism – Individuals and corporations control the means of production.","• Capitalist / Bourgeoisie Class – Small, wealthy class that controls the means of production.","• Worker / Proletariat Class – Rest of society that performs manual labor. According to Marx, power disparity will lead to the proletariat overthrowing the capitalist class.","• Interest Groups – Organized group that pursues a goal, usually policy or societal change."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Structural-Functionalism Theory","d":["Emile Durkheim; model that views society as stable, cooperative parts working together to maintain balance. Macro.","• Function – Structural-Functionalism; contribution made by a group to a system.","• Manifest Function – Structural-Functionalism; the intended beneficial consequence of a group’s action.","• Latent Function – Structural-Functionalism; the unintended, beneficial consequence of a group's action.","• Dysfunction – Structural-Functionalism; Negative consequences of a group’s action, intended or unintended."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Feminist Theory","d":["Critiques institutions that disadvantage women due to society being inherently patriarchal. Offshoot of conflict theory.","• Patriarchy – Society is dominated by men, who seek to preserve their positions of power.","• Glass Ceiling – Feminist; an invisible social barrier that limits a woman’s social ceiling.","• Glass Escalator – Feminist; an invisible social force that pushes men to higher positions, over women."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Social Institutions","d":["Established social structures that fulfill some societal part or need.","• Family","• Education","• Religion","• Government","• Economy","• Medicine","• Healthcare"],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Family","d":["Social institution; differs from culture to culture.","• Child Abuse –","• Patterns of Kinship – Cultural variations about what is considered family.","• Domestic Violence – #1 cause of injury to American women. Drug abuse, alcoholism.","• Elder Abuse – Most often abusive caretaker.","• Mandated Reporter – Someone legally required to report suspected cases of elder or child abuse, but not general domestic violence."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Education","d":["Social institution; provide an individual or group with a useful set of skills.","• Hidden Curriculum – Unspoken or implicit lessons about social norms, attitude, beliefs learned by students.","• Teacher Expectancy – Teachers get what they expect from students. Self-fulfilling prophecy."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Religion","d":["Social institution.","• Denomination / Sect –","• Church –","• Cult –","• Fundamentalism – Emphasizes strict adherence to religion, and rejects secularism.","• Religiosity – How religious one considers themselves. Includes strength of beliefs, practices, attitudes.","• Secularize – To move away from religion and towards rational or scientific thinking."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Government","d":["Social institution; maintain social order, enforce laws.","• Democracy – Every citizen votes.","• Monarchies – There is a royal monarch.","• Dictatorship – One person has power, and usually suppresses the power of others.","• Theocracy – Religious leaders hold power.","• Charismatic Authority – Authority based on personal appeal or charisma."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Economy","d":["Social institution; organize money, goods, services.","• Capitalist – Economic system emphasizing free market, consumerism, and competition for profit.","• Division of Labor – Components of a larger task or assigned to specialists. Common in capitalist economies.","• Socialist – Economic system emphasizing collective ownership, government control of resources, equitable distribution of resources."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Medicine","d":["Social institution."],"lo":1},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"Healthcare","d":["Social institution. Goals include more access to healthcare, prevention, education, decreased paternalism, life course approach.","• Life Course Approach to Health – A comprehensive, holistic view of a patient beyond just the symptoms.","• Sick Role – Socially expected behavior (role) of one who is sick.","• Medicalized – To be defined and treated as a medical condition.","• Illness Experience – How someone understands, feels, and deals with being sick.","• Social Epidemiology – Study of effects of institutions, social structures, relationships on health."],"lo":0},{"ch":11,"sec":"11.1 Sociology: Theories and Institutions","term":"4 Key Tenets of Medical Ethics","d":["• Beneficence – Physicians must act in the pt’s best interest.","• Nonmaleficence – Physicians must avoid treatments that might do more harm than good. Do no harm.","• Respect of Patient Autonomy – Physicians must respect pt choices about their health.","• Justice – Physicians must not treat patients unequally."],"lo":0},{"ch":11,"sec":"11.2 Culture","term":"Material Culture","d":["Physical objects associated with a group. Whitehouse, mascots."],"lo":0},{"ch":11,"sec":"11.2 Culture","term":"Artifacts","d":["Material items someone values."],"lo":1},{"ch":11,"sec":"11.2 Culture","term":"Ethnography","d":["Study of cultures and customs.","• Ethnographic Methods – Methods used to study ethnicity or culture of a group."],"lo":1},{"ch":11,"sec":"11.2 Culture","term":"Symbolic / Nonmaterial Culture","d":["Ideas or concepts associated with a group. Liberty, stories, music."],"lo":0},{"ch":11,"sec":"11.2 Culture","term":"Culture Lag","d":["Material culture changes faster than symbolic culture, creating a lag."],"lo":0},{"ch":11,"sec":"11.2 Culture","term":"Values","d":["Concepts (non-material) or ideas someone deems important, influencing principles and behavior."],"lo":0},{"ch":11,"sec":"11.2 Culture","term":"Belief","d":["Something someone accepts to be truth."],"lo":0},{"ch":11,"sec":"11.2 Culture","term":"Cultural Barriers","d":["Arises when a cultural difference interferes with interaction."],"lo":1},{"ch":11,"sec":"11.2 Culture","term":"Ritual","d":["Formal ceremony involving objects, concepts, etc. Thanksgiving meal, wedding, etc."],"lo":1},{"ch":11,"sec":"11.3 Demographics","term":"Demographics","d":["Statistics of populations. The mathematical application of sociology."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Ageism","d":["Discrimination based on someone’s age."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Age Cohorts","d":["Groups of people based on age. Helps analyze age-related differences.","• In USA, baby boomers, a very big generation, are getting old. So the overall population ratio is getting much older."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Dependency Ratio","d":["Ratio of (# of people not in the workforce) / (# of people in the workforce). If this ratio is big, more strain on the workforce.","• Youth Ratio – Ratio of (# of people under 15) / (# of people 15-65)","• Age Dependency Ratio – Ratio of (# of people over 65) / (# of people 15-65)"],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Stable Population","d":["Population when fertility rate and mortality rate is ~constant over a long time."],"lo":1},{"ch":11,"sec":"11.3 Demographics","term":"Sex","d":["Biological male or female."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Gender","d":["Social construct; male or female.","• Gender Inequality –","• Gender Roles – Social construct; expected behavior for a gender.","• Gender Identity – Social construct; the gender someone wishes to portray.","• Gender Segregation – Separation of people based on gender. Bathrooms.","• Gender Stratification – Gender inequality as it pertains to social resources."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Racialization","d":["Process of assigning attributes or characteristics to a race."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Race","d":["Social construct; groups of people based on phenotypic, or physical characteristics."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Ethnicity","d":["Social construct; groups of people based on cultural (language, traditions, ancestry) characteristics."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Symbolic Ethnicity","d":["A weaker, optional ethnic identity; claimed when convenient rather than a lifestyle."],"lo":1},{"ch":11,"sec":"11.3 Demographics","term":"Sexual Orientation","d":["Do you like boys, girls or something else?","• Heterosexual – Attracted to different sex.","• Bisexual / Pansexual – Attracted to multiple sexes.","• Homosexual – Attracted to the same sex.","• Kinsey Scale – Alfred Kinsey; 0-6 scale measuring sexual orientation. Not many people are or 0 or 6.","• LGBTQ – Health disparities including HIV/AIDS, mental health, etc."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Generational Status","d":["Refers to how many generations a family has lived in a country since immigration. 1st generation, you were born somewhere else and immigrated."],"lo":1},{"ch":11,"sec":"11.3 Demographics","term":"Intersectionality","d":["Idea that a person’s multiple identities combine to create a unique experience."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Demographic Shifts","d":["Changes in a population's makeup over time."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Population Density","d":["People per km2 of land."],"lo":1},{"ch":11,"sec":"11.3 Demographics","term":"Population Pyramids","d":["Graphs showing age and sex of a population."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Fertility Rate","d":["Average # of children born to each woman in a population. 2 children born for every 1 woman."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Mortality Rate","d":["Number of deaths in a population per unit time. 100 people dead every month. Crude Rate – Total number of births or deaths divided by the total population, per unit time. For every 200 people, 100 people are born (or dead)."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Migration","d":["Movement of people in or out a population.","• Immigration – Movement of people into a place or population.","• Emigration – Movement of people out of a place or population.","• Pull Factors – Positive factor that pulls people towards a place.","• Push Factors – Negative factor that pushes people away from a place."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Demographic Transition","d":["Change in a population from high birth and death rates to low birth and death rates as a society becomes more economically developed."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Industrialization","d":["Shift from an agriculture-based society to one based on industry, manufacturing, and mechanized production."],"lo":1},{"ch":11,"sec":"11.3 Demographics","term":"US Population Trend","d":["US population is getting bigger, older, and diverse."],"lo":1},{"ch":11,"sec":"11.3 Demographics","term":"Demographic Transition Theory","d":["Describes demographic transition by linking it to industrialization. Sigmoidal population.","• Stage 1 – Preindustrial; birth rates + death rates are high, stable population.","• Stage 2 – Economic progress; death rates decrease, population increases.","• Stage 3 – Shift to industrial; birth rates decrease, population levels off.","• Stage 4 – Industrial; birth rates + death rates are low, stable population."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Malthusian Theory","d":["Population grows exponentially, food grows linearly. Therefore population growth might lead to social conflict."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Social Movement","d":["Movements to promote or resist social change.","• Relative Deprivation – Feeling of being less well off relative to others. Not necessarily poor.","• Proactive – Social movements that promote social change.","• Reactive – Social movements that resist social change.","• Resource Mobilization – Social movements succeed when they obtain and use resources effectively."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Globalization","d":["The increasing economic, political, and cultural interconnectedness between societies around the world. Leads to cultural diffusion + cultural homogenization."],"lo":0},{"ch":11,"sec":"11.3 Demographics","term":"Urbanization","d":["Migration of people into urban centers."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social Class","d":["Group of people who share a similar socioeconomic status."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social Cohesion","d":["Sense of connectedness among the different social classes."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social Stratification","d":["Ranking of people in society, based on numerous factors including wealth, education, race, etc."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Socioeconomic Status (SES)","d":["Social and economic status in society. Drives social stratification."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Ascribed Status","d":["Status involuntarily given or assigned."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Achieved Status","d":["Status gained as a result of choice, effort."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Educational Attainment","d":["Highest level of education one has completed."],"lo":1},{"ch":12,"sec":"12.1 Social Class","term":"Socioeconomic Gradient","d":["As socioeconomic status goes up, healthcare increases."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Prestige","d":["How much positive regard society gives something."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Class Consciousness","d":["Awareness of social class, and shared class interests. May lead to revolt.","• False Consciousness – Failure to recognize true social class and interests, often accepting beliefs that benefit the upper class."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Anomie","d":["Lack of social norms, leading to breakdown of society."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Strain Theory","d":["People commit crimes when they can’t achieve society’s goals through legitimate means."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social Solidarity","d":["Sense of cohesion or social unity that holds society together."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social Capital","d":["Benefits and resources obtained from social networks or relationships.","• Strong Ties – Peer or kin connections. Few but powerful.","• Weak Ties – Casual acquaintances. More numerous, less deep, but great for new opportunities + social capital."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social Integration","d":["How well people are connected and accepted into society."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Privilege","d":["Unequal opportunity."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Cultural Capital","d":["Benefits obtained from knowledge, abilities, or skills (cultural assets)."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social / Structural Mobility","d":["Any movement within or out of different social classes in society’s structure.","• Intragenerational Mobility – Changes in social status that happen within a lifetime (generation).","• Intergenerational Mobility – Change in social status that happens across multiple generations.","• Vertical Mobility – Movement from 1 social class to another.","◦ Upward Mobility – Positive vertical mobility, higher class.","◦ Downward Mobility – Negative vertical mobility, lower class.","• Horizontal Mobility – Change in occupation or lifestyle that keeps one in the same social class."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Meritocracy","d":["Social structure where merits allow for social mobility."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Plutocracy","d":["Rule by the upper class."],"lo":1},{"ch":12,"sec":"12.1 Social Class","term":"Poverty","d":["Low socioeconomic status + lack of possessions, financial resources.","• Structural Poverty – Society is more responsible for poverty than any one individual is.","• Absolute Poverty – Not having enough resources to meet basic survival needs.","• Relative Poverty – Being poor compared to the rest of society.","• Poverty Line – Official income level set by gov’t to determine who is in poverty.","• Social Exclusion – People are blocked from fully participating in society, due to poverty or other disadvantages."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Social Reproduction","d":["Social inequality is passed down from generation to generation."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Spatial Inequality","d":["Uneven distribution of resources across neighborhoods or regions (geographical space), often due to factors like race, class, etc. Components include residential, environmental, global.","• Residential Segregation – Separation of different racial or economic groups into different residential neighborhoods.","• Suburbanization – Middle class tends to move to suburbs, often due to concentration of poor individuals in urban centers.","• Urban Decay – Parts of cities decay, possibly due to suburbanization.","• Urban Renewal – Declining urban areas are redeveloped and improved.","• Gentrification – Upper or middle class populations purchase + renovate poor areas, and displace the lower class."],"lo":0},{"ch":12,"sec":"12.1 Social Class","term":"Environmental Justice","d":["Pollution, toxic sites, or environmental hazards are more common in poor regions."],"lo":1},{"ch":12,"sec":"12.1 Social Class","term":"World System Theory","d":["The global economy is divided in core, peripheral, semi-peripheral nations.","• Core Nations – Wealthy, powerful, developed countries that dominate and exploit peripheral nations.","• Peripheral Nations – Poor, underdeveloped countries that are exploited by core nations for cheap labor or raw resources.","• Semi-peripheral Nations – Middle income countries between core, peripheral nations."],"lo":0},{"ch":12,"sec":"12.2 Epidemiology and Disparities","term":"Social Epidemiology","d":["Epidemiology branch that studies how social factors influence health outcomes.","• Incidence – New cases / population at risk / time. 12 new cases of diabetes per 1,000 people, per year.","• Prevalence – Total cases / total population / time. 85 total cases of diabetes per 1,000 people, per year.","• Morbidity – Rate of disease or illness in a population.","• Mortality – Rate of death caused by a disease in a population."],"lo":0},{"ch":12,"sec":"12.2 Epidemiology and Disparities","term":"Social Determinants of Health","d":["Non-medical factors that influence health outcomes, such as culture, social class, etc."],"lo":0},{"ch":12,"sec":"12.2 Epidemiology and Disparities","term":"Welfare State","d":["Systems of gov’t that protect the health/welfare of citizens."],"lo":1},{"ch":12,"sec":"12.2 Epidemiology and Disparities","term":"Second Sickness","d":["Howard Waitzkin; social injustice can exacerbate health outcomes, get sicker.","• Low-income leads to worse health outcomes, including newborn babies.","• Asians have overall better health profiles than whites.","• Blacks have overall worse health profiles than whites.","• Women have overall better health profiles than men."],"lo":1},{"ch":12,"sec":"12.2 Epidemiology and Disparities","term":"Medicare","d":["65+, end-stage renal disease, amyotrophic lateral sclerosis (ALS)."],"lo":1},{"ch":12,"sec":"12.2 Epidemiology and Disparities","term":"Medicaid","d":["Aids patients in financial need.","• Medicare, Medicaid doesn’t always work due to accessibility and insurance acceptance issues."],"lo":1}],"alias":{"1|1.2 Organization of the Human Nervous System|Sensory / Afferent Neurons":"1|1.2 Organization of the Human Nervous System|3 Nerve Cells","1|1.2 Organization of the Human Nervous System|Motor / Efferent Neurons":"1|1.2 Organization of the Human Nervous System|3 Nerve Cells","1|1.2 Organization of the Human Nervous System|Interneurons":"1|1.2 Organization of the Human Nervous System|3 Nerve Cells","1|1.3 Organization of the brain|Dura Mater":"1|1.3 Organization of the brain|Meninges","1|1.3 Organization of the brain|Arachnoid Mater":"1|1.3 Organization of the brain|Meninges","1|1.3 Organization of the brain|Pia Mater":"1|1.3 Organization of the brain|Meninges","1|1.3 Organization of the brain|Superior Colliculus":"1|1.3 Organization of the brain|Colliculi","1|1.3 Organization of the brain|Inferior Colliculus":"1|1.3 Organization of the brain|Colliculi","1|1.4 Parts of the Forebrain|Lateral Hypothalamus (LH)":"1|1.4 Parts of the Forebrain|Hypothalamus","1|1.4 Par const KEY='ps-flash-v1', CHKEY='ps-flash-ch1', MODEKEY='ps-flash-mode', YKEY='ps-flash-yield';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const cards=DATA.cards.map((c,i)=>({...c,id:c.ch+'|'+c.sec+'|'+c.term}));
let status=load(KEY,{});            // id -> 'yes' | 'no'
let chSel=String(load(CHKEY,'all'));
const $=id=>document.getElementById(id);
$('chSel').innerHTML='<option value="all">All chapters</option>'+DATA.chapters.map(c=>'<option value="'+c.ch+'">Ch '+c.ch+' · '+c.title+'</option>').join('');
$('chSel').value=chSel;
$('mode').value=load(MODEKEY,'todo');
$('yield').value=load(YKEY,'all');
let queue=[], idx=0, history=[], pile='no', drill=null;
const GKEY='ps-flash-guides';
const byId=new Map(cards.map((c,i)=>[c.id,i]));
Object.entries(DATA.alias||{}).forEach(([a,p])=>{if(byId.has(p)&&!byId.has(a))byId.set(a,byId.get(p))});
let guides=load(GKEY,null);
if(!Array.isArray(guides)) guides=[];
function saveGuides(){save(GKEY,guides)}

function pileOf(c){return status[c.id]||'new'}
function inScope(){if(drill)return drill.i.map(i=>cards[i]);const y=$('yield').value;return cards.filter(c=>(chSel==='all'||c.ch==+chSel)&&(y==='all'||(y==='lo'?c.lo:!c.lo)))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  const m=drill?'all':$('mode').value;
  queue=shuffle(inScope().filter(c=>{const p=pileOf(c);return m==='all'||(m==='todo'?p!=='yes':p===m)}));
  idx=0; history=[]; render();
}
function esc(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))}
function lineHTML(x){const m=x.match(/^([•◦] )(.+?)( – [\s\S]*)?$/);if(!m)return esc(x);return esc(m[1])+'<b>'+esc(m[2])+'</b>'+(m[3]?esc(m[3]):'')}
function defHTML(c){return c.d.map(x=>x.startsWith('◦ ')?'<p class="sub">'+lineHTML(x)+'</p>':'<p>'+lineHTML(x)+'</p>').join('')}
function stats(){
  const s={new:0,no:0,yes:0}; inScope().forEach(c=>s[pileOf(c)]++);
  $('sNew').textContent=s.new;$('sNo').textContent=s.no;$('sYes').textContent=s.yes;
}
function render(){
  stats();
  const card=$('card'); card.classList.remove('flipped');
  if(idx>=queue.length){
    card.innerHTML='<div class="done"><b style="font-size:20px;color:var(--ink)">Done with this set.</b><br><br>'+(drill?'Hit Shuffle to drill again, or Exit above.':'Hit Shuffle to go again, or switch the mode.')+'</div>';
    $('actions').classList.add('hidden'); return;
  }
  $('actions').classList.remove('hidden');
  if(!$('term')) card.innerHTML='<div class="meta"><span id="where"></span><span id="pos"></span></div><div class="term" id="term"></div><div class="def" id="def"></div><div class="hint">Tap to flip</div>';
  const c=queue[idx], p=pileOf(c);
  $('where').innerHTML='Ch '+c.ch+(c.sec?' · '+esc(c.sec.replace(/^\d+\.\d+\s*/,'')):'')+(c.lo?' <span class="tag lo">low yield</span>':'')+(p!=='new'?' <span class="tag '+p+'">'+(p==='yes'?'got it':"don't get it")+'</span>':'');
  $('pos').textContent=(idx+1)+' / '+queue.length;
  $('term').textContent=c.term; $('def').innerHTML=defHTML(c);
}
function mark(v){
  if(idx>=queue.length) return;
  const c=queue[idx]; history.push([idx,c.id,status[c.id]]);
  status[c.id]=v; save(KEY,status); idx++; render();
}
$('card').onclick=()=>{if(idx<queue.length)$('card').classList.toggle('flipped')};
$('bNo').onclick=()=>mark('no'); $('bYes').onclick=()=>mark('yes');
$('undo').onclick=()=>{const h=history.pop(); if(!h) return; const [i,id,prev]=h; if(prev) status[id]=prev; else delete status[id]; save(KEY,status); idx=i; render();};
$('shuffle').onclick=build;
$('mode').onchange=()=>{save(MODEKEY,$('mode').value);build()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key===' '){e.preventDefault();$('card').click()}
  else if(e.key==='ArrowLeft') mark('no');
  else if(e.key==='ArrowRight') mark('yes');
});

// filters
function refilter(){build();if(tab==='listView')drawList()}
$('chSel').onchange=()=>{chSel=$('chSel').value;save(CHKEY,chSel);refilter()};
$('yield').onchange=()=>{save(YKEY,$('yield').value);refilter()};

// piles
function drawList(){
  const items=inScope().filter(c=>pileOf(c)===pile);
  $('list').innerHTML=items.length?items.map(c=>'<details class="item"><summary><span>'+esc(c.term)+'</span><span class="small">'+(c.lo?'low · ':'')+'Ch '+c.ch+'</span></summary><div class="def">'+defHTML(c)+'</div></details>').join(''):'<p class="small" style="text-align:center">Nothing here.</p>';
  document.querySelectorAll('[data-pile]').forEach(b=>b.classList.toggle('on',b.dataset.pile===pile));
}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-pile]'); if(!b) return; pile=b.dataset.pile; drawList();};
let tab='study';
function showTab(t){
  tab=t;
  ['study','listView','guideView','mapView'].forEach(x=>$(x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('controls').classList.toggle('hidden',t==='guideView'||t==='mapView');
  $('drillBar').classList.toggle('hidden',!drill||t==='guideView'||t==='mapView');
  if(t==='listView') drawList();
  if(t==='mapView') MAP.open(); else MAP.close();
  window.scrollTo(0,0);
}
document.querySelector('.nav').onclick=e=>{const b=e.target.closest('[data-tab]'); if(b) showTab(b.dataset.tab)};
function setDrill(g){
  drill=g||null;
  $('drillName').textContent=drill?'Drilling: '+drill.n+' ('+drill.i.length+')':'';
  ['chSel','yield','mode'].forEach(x=>$(x).classList.toggle('hidden',!!drill));
  build(); showTab('study');
}
let editing=null, openTerm={};
const gIdx=id=>guides.findIndex(g=>g.id===id);
function itemLabel(it){if(it.t!=null)return it.t;const i=byId.get(it.c);return i==null?'(missing term)':cards[i].term}
function groupCards(g){return g.items.map(it=>byId.get(it.c)).filter(i=>i!=null)}
function viewHTML(g){
  const n=groupCards(g).length, ot=openTerm[g.id];
  let def='';
  if(ot!=null){const it=g.items[ot]; const i=it&&byId.get(it.c); if(i!=null) def='<div class="gd"><b>'+esc(cards[i].term)+'</b>'+defHTML(cards[i])+'<span class="small">Ch '+cards[i].ch+'</span></div>';}
  return '<div class="g" data-id="'+g.id+'"><div class="gh"><h3>'+esc(g.name||'Untitled')+'</h3><div class="row" style="gap:2px">'+
    (n?'<button class="link" data-act="drill">Drill '+n+'</button>':'')+'<button class="link" data-act="edit">Edit</button></div></div>'+
    (g.items.length?'<div class="terms">'+g.items.map((it,k)=>{const i=byId.get(it.c);const cls=it.t!=null?'tt plain':'tt'+(i!=null&&cards[i].lo?' lo':'')+(ot===k?' on':'');return '<button class="'+cls+'" data-k="'+k+'">'+esc(itemLabel(it))+'</button>'}).join('')+'</div>':'<p class="small">No terms yet. Tap Edit to add some.</p>')+def+'</div>';
}
function editHTML(g){
  const topics=[...new Set(guides.map(x=>x.topic).filter(Boolean))];
  return '<div class="g editing" data-id="'+g.id+'">'+
   '<div class="ef"><label>Group name<input data-f="name" value="'+esc(g.name||'').replace(/"/g,'&quot;')+'" placeholder="e.g. Frontal Lobe"></label>'+
   '<label>Topic <span class="small">(optional heading)</span><input data-f="topic" list="topicList" value="'+esc(g.topic||'').replace(/"/g,'&quot;')+'" placeholder="e.g. Brain"></label></div>'+
   '<datalist id="topicList">'+topics.map(t=>'<option value="'+esc(t).replace(/"/g,'&quot;')+'">').join('')+'</datalist>'+
   '<div class="eitems">'+(g.items.length?g.items.map((it,k)=>'<div class="erow"><span>'+esc(itemLabel(it))+'</span><span class="row" style="gap:2px;flex-wrap:nowrap"><button class="ib" data-act="iup" data-k="'+k+'" aria-label="Move up">↑</button><button class="ib" data-act="idown" data-k="'+k+'" aria-label="Move down">↓</button><button class="ib x" data-act="idel" data-k="'+k+'" aria-label="Remove">×</button></span></div>').join(''):'<p class="small">No terms yet.</p>')+'</div>'+
   '<input class="search" data-f="search" placeholder="Search your terms to add…" autocomplete="off"><div class="results"></div>'+
   '<div class="ebar"><button data-act="gup">↑ Move group</button><button data-act="gdown">↓ Move group</button><button class="danger" data-act="gdel">Delete</button><button class="primary" data-act="done">Done</button></div></div>';
}
function drawGuides(){
  let html='', last=undefined;
  guides.forEach(g=>{
    const t=g.topic||'';
    if(t!==last){html+=t?'<h4 class="topic">'+esc(t)+'</h4>':(last!==undefined?'<h4 class="topic">Other</h4>':'');last=t}
    html+=editing===g.id?editHTML(g):viewHTML(g);
  });
  $('guideBody').innerHTML=html||'<p class="small" style="text-align:center;padding:24px 0">No groups yet. Hit "+ New group".</p>';
  if(editing){const el=document.querySelector('.editing [data-f=search]');}
}
function results(q){
  q=q.trim().toLowerCase(); if(!q) return '';
  const hits=[]; for(let i=0;i<cards.length&&hits.length<8;i++){if(cards[i].term.toLowerCase().includes(q))hits.push(i)}
  return hits.map(i=>'<button class="res" data-act="add" data-i="'+i+'"><span>'+esc(cards[i].term)+'</span><span class="small">'+(cards[i].lo?'low · ':'')+'Ch '+cards[i].ch+'</span></button>').join('')+
    '<button class="res" data-act="addtext"><span>Add "'+esc(q)+'" as plain text</span><span class="small">no definition</span></button>';
}
$('newGroup').onclick=()=>{
  const g={id:'g'+Date.now(),topic:guides.length?guides[guides.length-1].topic:'',name:'',items:[]};
  guides.push(g); saveGuides(); editing=g.id; drawGuides();
  const el=document.querySelector('.editing [data-f=name]'); el.scrollIntoView({block:'center'}); el.focus();
};
$('guideBody').addEventListener('input',e=>{
  const box=e.target.closest('.g'); if(!box) return; const g=guides[gIdx(box.dataset.id)]; const f=e.target.dataset.f;
  if(f==='search'){box.querySelector('.results').innerHTML=results(e.target.value);return}
  if(f==='name'||f==='topic'){g[f]=e.target.value;saveGuides()}
});
$('guideBody').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset.f==='search'){e.preventDefault();const b=e.target.parentElement.querySelector('.res');if(b)b.click()}
});
$('guideBody').addEventListener('click',e=>{
  const box=e.target.closest('.g'); if(!box) return;
  const gi=gIdx(box.dataset.id), g=guides[gi];
  const tt=e.target.closest('.tt');
  if(tt&&!tt.classList.contains('plain')){const k=+tt.dataset.k; openTerm[g.id]=openTerm[g.id]===k?null:k; drawGuides(); return}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, k=+b.dataset.k;
  const refocus=()=>{const s=document.querySelector('.editing [data-f=search]'); if(s) s.focus()};
  if(a==='drill'){const ix=groupCards(g);setDrill({n:g.name||'Untitled',i:[...new Set(ix)]});return}
  if(a==='edit'){editing=g.id;drawGuides();return}
  if(a==='done'){editing=null;drawGuides();box.scrollIntoView&&document.querySelector('[data-id="'+g.id+'"]').scrollIntoView({block:'nearest'});return}
  if(a==='add'){const id=cards[+b.dataset.i].id; if(!g.items.some(x=>x.c===id)) g.items.push({c:id}); saveGuides(); drawGuides(); refocus(); return}
  if(a==='addtext'){const v=box.querySelector('[data-f=search]').value.trim(); if(v) g.items.push({t:v}); saveGuides(); drawGuides(); refocus(); return}
  if(a==='idel'){g.items.splice(k,1)}
  else if(a==='iup'&&k>0){[g.items[k-1],g.items[k]]=[g.items[k],g.items[k-1]]}
  else if(a==='idown'&&k<g.items.length-1){[g.items[k+1],g.items[k]]=[g.items[k],g.items[k+1]]}
  else if(a==='gup'&&gi>0){[guides[gi-1],guides[gi]]=[guides[gi],guides[gi-1]]}
  else if(a==='gdown'&&gi<guides.length-1){[guides[gi+1],guides[gi]]=[guides[gi],guides[gi+1]]}
  else if(a==='gdel'){if(!confirm('Delete "'+(g.name||'Untitled')+'"?'))return; guides.splice(gi,1); editing=null}
  else return;
  saveGuides(); drawGuides();
  if(a==='gup'||a==='gdown'){const el=document.querySelector('[data-id="'+g.id+'"]'); if(el) el.scrollIntoView({block:'center'})}
});
drawGuides();
$('drillExit').onclick=()=>setDrill(null);
$('reset').onclick=()=>{if(drill){if(!confirm('Move every card in this drill group back to New?'))return;inScope().forEach(c=>delete status[c.id]);save(KEY,status);drawList();stats();return;}if(!confirm('Move every card in the current chapter/yield selection back to New?'))return;inScope().forEach(c=>delete status[c.id]); save(KEY,status); drawList(); stats();};

// save / load progress file
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
$('saveBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'ps-flash',v:1,saved:new Date().toISOString(),status,guides,chapter:chSel,yield:$('yield').value,mode:$('mode').value})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ps-progress.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress saved');
};
function loadFile(f){
  if(!f) return;
  f.text().then(txt=>{
    const o=JSON.parse(txt);
    if(!o||typeof o.status!=='object') throw 0;
    status=o.status; save(KEY,status);
    if(o.chapter){chSel=String(o.chapter);$('chSel').value=chSel;save(CHKEY,chSel)}
    if(o.yield){$('yield').value=o.yield;save(YKEY,o.yield)}
    if(Array.isArray(o.guides)){guides=o.guides;saveGuides();editing=null;drawGuides()}
    if(o.mode){$('mode').value=o.mode;save(MODEKEY,o.mode)}
    build(); if(tab==='listView') drawList();
    const n=Object.values(status), no=n.filter(x=>x==='no').length, yes=n.filter(x=>x==='yes').length;
    toast('Loaded: '+no+" don't get it, "+yes+' got it');
  }).catch(()=>toast("That file isn't a progress file"));
}
$('loadBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(--dragN<=0){dragN=0;document.body.classList.remove('dragging')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('dragging');loadFile(e.dataTransfer.files[0])});

// ---- concept map ----
const MAP=(()=>{
  const cv=$('map'), ctx=cv.getContext('2d');
  let nodes=[], links=[], nbr=new Map(), W=0, H=0, dpr=1;
  let cam={x:0,y:0,k:1}, alpha=0, raf=0, active=false, sel=null, hover=null, sig='';
  const norm=x=>String(x).toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
  const cardByName=new Map();
  cards.forEach((c,i)=>{
    const full=norm(c.term); if(!cardByName.has(full)) cardByName.set(full,i);
    c.term.split(/\s*\/\s*/).forEach(p=>{const a=norm(p.replace(/\s*\(.*?\)\s*/g,' ')); if(a&&!cardByName.has(a)) cardByName.set(a,i)});
    const np=norm(c.term.replace(/\s*\(.*?\)\s*/g,' ')); if(!cardByName.has(np)) cardByName.set(np,i);
  });
  const colorsFor=()=>{const cs=getComputedStyle(document.documentElement);const g=v=>cs.getPropertyValue(v).trim();return{ink:g('--ink'),muted:g('--muted'),line:g('--line'),accent:g('--accent'),card:g('--card'),bg:g('--bg')}};
  const PAL=['#3b5bdb','#c2410c','#15803d','#9333ea','#0e7490','#b45309','#be185d','#4d7c0f'];
  function build(){
    const topic=$('mapTopic').value||'__all';
    const gs=guides.filter(g=>topic==='__all'||(g.topic||'')===topic);
    const topics=[...new Set(guides.map(g=>g.topic||''))];
    const old=new Map(nodes.map(n=>[n.key,n]));
    const N=new Map(); links=[]; nbr=new Map();
    const groupKey=new Map();
    gs.forEach(g=>{const nm=norm(g.name||'Untitled');const ci=cardByName.get(nm);groupKey.set(g.id,ci!=null?'c'+ci:'g:'+nm)});
    const groupByName=new Map(gs.map(g=>[norm(g.name||'Untitled'),groupKey.get(g.id)]));
    const add=(key,label,kind,ci,topic)=>{
      let n=N.get(key);
      if(!n){const o=old.get(key);n={key,label,kind,ci,topic,x:o?o.x:(Math.random()-.5)*300,y:o?o.y:(Math.random()-.5)*300,vx:0,vy:0,deg:0,fixed:false};N.set(key,n)}
      if(kind==='group'){n.kind='group';n.label=label;n.topic=topic}
      if(ci!=null&&n.ci==null) n.ci=ci;
      return n;
    };
    gs.forEach(g=>{
      const gk=groupKey.get(g.id), ci=gk[0]==='c'?+gk.slice(1):null;
      const gn=add(gk,g.name||'Untitled','group',ci,g.topic||'');
      g.items.forEach(it=>{
        let key,label,ci2=null;
        if(it.t!=null){const nm=norm(it.t);key=groupByName.get(nm);if(!key){const c=cardByName.get(nm);key=c!=null?'c'+c:'t:'+nm;ci2=c??null}label=it.t}
        else{const i=byId.get(it.c);if(i==null)return;key='c'+i;ci2=i;label=cards[i].term}
        if(key===gk) return;
        const tn=add(key,label,'term',ci2,g.topic||'');
        if(!links.some(l=>(l.s===gn&&l.t===tn)||(l.s===tn&&l.t===gn))) links.push({s:gn,t:tn});
      });
    });
    nodes=[...N.values()];
    nodes.forEach(n=>{n.deg=0;nbr.set(n,new Set())});
    links.forEach(l=>{l.s.deg++;l.t.deg++;nbr.get(l.s).add(l.t);nbr.get(l.t).add(l.s)});
    nodes.forEach(n=>{n.r=(n.kind==='group'?7:4)+Math.sqrt(n.deg)*2.2;n.col=PAL[Math.max(0,topics.indexOf(n.topic))%PAL.length]});
    $('mapEmpty').classList.toggle('hidden',nodes.length>0);
    $('mapNames').innerHTML=nodes.map(n=>'<option value="'+esc(n.label).replace(/"/g,'&quot;')+'">').join('');
    if(sel&&!N.has(sel.key)) sel=null; else if(sel) sel=N.get(sel.key);
    info();
  }
  function step(){
    const n=nodes.length; if(!n) return;
    const rep=7000, len=95, kS=.05;
    for(let i=0;i<n;i++){const a=nodes[i];for(let j=i+1;j<n;j++){const b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;if(d2>250000)continue;const f=rep/d2*alpha,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
    links.forEach(l=>{const dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;const L=len+(l.s.r+l.t.r);const f=(d-L)*kS*alpha;const fx=dx/d*f,fy=dy/d*f;l.s.vx+=fx;l.s.vy+=fy;l.t.vx-=fx;l.t.vy-=fy});
    nodes.forEach(a=>{a.vx-=a.x*.004*alpha;a.vy-=a.y*.004*alpha;if(a.fixed){a.vx=a.vy=0;return}a.vx*=.6;a.vy*=.6;a.x+=a.vx;a.y+=a.vy});
    alpha*=.985; if(alpha<.02) alpha=0;
  }
  function draw(){
    const C=colorsFor();
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    ctx.translate(W/2+cam.x,H/2+cam.y);ctx.scale(cam.k,cam.k);
    const focus=sel||hover, near=focus?nbr.get(focus):null;
    const dim=n=>focus&&n!==focus&&!near.has(n);
    ctx.lineWidth=1/cam.k;
    links.forEach(l=>{const on=focus&&(l.s===focus||l.t===focus);ctx.strokeStyle=on?C.accent:C.line;ctx.globalAlpha=focus&&!on?.25:1;ctx.lineWidth=(on?2:1.2)/cam.k;ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke()});
    nodes.forEach(n=>{
      ctx.globalAlpha=dim(n)?.2:1;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);
      ctx.fillStyle=n.kind==='group'?n.col:(n.ci!=null&&cards[n.ci].lo?C.line:C.muted);ctx.fill();
      if(n===sel){ctx.lineWidth=3/cam.k;ctx.strokeStyle=C.ink;ctx.stroke()}
    });
    ctx.textAlign='center';ctx.textBaseline='top';
    nodes.forEach(n=>{
      const show=n===focus||(near&&near.has(n))||(!focus&&(n.kind==='group'?true:cam.k>.9));
      if(!show) return;
      ctx.globalAlpha=dim(n)?.25:1;
      const fs=(n.kind==='group'?13:11.5)/Math.max(cam.k,.6)*Math.min(cam.k,1.6)/Math.min(cam.k,1.6);
      const px=(n.kind==='group'?12:11)/Math.min(cam.k,1.4);
      ctx.font=(n.kind==='group'?'600 ':'')+px+'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      const lab=n.label.length>34?n.label.slice(0,32)+'…':n.label;
      ctx.lineWidth=3/cam.k;ctx.strokeStyle=C.card;ctx.strokeText(lab,n.x,n.y+n.r+3/cam.k);
      ctx.fillStyle=n.kind==='group'?C.ink:C.muted;ctx.fillText(lab,n.x,n.y+n.r+3/cam.k);
    });
    ctx.globalAlpha=1;
  }
  function loop(){raf=0;if(!active)return;if(alpha>0)step();draw();if(alpha>0||dragN)raf=requestAnimationFrame(loop)}
  function kick(a){alpha=Math.max(alpha,a||.6);if(!raf&&active)raf=requestAnimationFrame(loop)}
  function redraw(){if(!raf&&active)raf=requestAnimationFrame(loop)}
  function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;redraw()}
  function fit(){if(!nodes.length)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;nodes.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)});const k=Math.min(W/(x1-x0+120),H/(y1-y0+120),2.2);cam.k=Math.max(.15,k);cam.x=-(x0+x1)/2*cam.k;cam.y=-(y0+y1)/2*cam.k;redraw()}
  const toWorld=(px,py)=>({x:(px-W/2-cam.x)/cam.k,y:(py-H/2-cam.y)/cam.k});
  function hit(px,py){const p=toWorld(px,py);let best=null,bd=1e9;nodes.forEach(n=>{const d=Math.hypot(n.x-p.x,n.y-p.y);const R=Math.max(n.r,12/cam.k);if(d<R&&d<bd){bd=d;best=n}});return best}
  function zoomAt(px,py,f){const p=toWorld(px,py);cam.k=Math.min(5,Math.max(.12,cam.k*f));cam.x=px-W/2-p.x*cam.k;cam.y=py-H/2-p.y*cam.k;redraw()}
  function info(){
    const el=$('mapInfo');
    if(!sel){el.classList.add('hidden');return}
    const c=sel.ci!=null?cards[sel.ci]:null;
    const ns=[...nbr.get(sel)||[]].sort((a,b)=>(b.kind==='group')-(a.kind==='group')||a.label.localeCompare(b.label));
    el.innerHTML='<h3>'+esc(sel.label)+'</h3>'+(c?defHTML(c)+'<span class="small">'+(c.lo?'Low yield · ':'')+'Ch '+c.ch+'</span>':'<p class="small">No definition (plain text or group name).</p>')+
      (ns.length?'<div class="nb">'+ns.map(n=>'<button class="tt'+(n.kind==='group'?' on':'')+'" data-key="'+esc(n.key).replace(/"/g,'&quot;')+'">'+esc(n.label)+'</button>').join('')+'</div>':'');
    el.classList.remove('hidden');
  }
  function select(n,center){sel=n;info();if(n&&center){cam.x=-n.x*cam.k;cam.y=-n.y*cam.k}redraw()}
  $('mapInfo').onclick=e=>{const b=e.target.closest('[data-key]');if(!b)return;const n=nodes.find(x=>x.key===b.dataset.key);if(n)select(n,true)};
  // pointer handling
  const pts=new Map(); let dragN=null, panning=false, moved=0, pinch=null, downAt=null;
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
    pts.set(e.pointerId,{x:px,y:py});moved=0;downAt={x:px,y:py};
    if(pts.size===2){dragN=null;panning=false;const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:cam.k};return}
    const n=hit(px,py);
    if(n){dragN=n;n.fixed=true;kick(.3)}else{panning=true}
    cv.classList.add('dragging');
  });
  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
    if(!pts.has(e.pointerId)){const h=hit(px,py);if(h!==hover){hover=h;redraw()}return}
    const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:px,y:py});
    moved+=Math.abs(px-prev.x)+Math.abs(py-prev.y);
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const f=(pinch.k*d/pinch.d)/cam.k;zoomAt((a.x+b.x)/2,(a.y+b.y)/2,f);return}
    if(dragN){const p=toWorld(px,py);dragN.x=p.x;dragN.y=p.y;kick(.3);redraw()}
    else if(panning){cam.x+=px-prev.x;cam.y+=py-prev.y;redraw()}
  });
  const up=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(moved<6&&pts.size===0){const n=dragN||hit(downAt.x,downAt.y);select(n&&n!==sel?n:(n===sel?sel:null))}
    if(dragN){dragN.fixed=false;dragN=null}
    panning=false;cv.classList.remove('dragging');redraw();
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{if(hover){hover=null;redraw()}});
  cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015))},{passive:false});
  $('zIn').onclick=()=>zoomAt(W/2,H/2,1.3);$('zOut').onclick=()=>zoomAt(W/2,H/2,1/1.3);$('zFit').onclick=fit;
  $('mapTopic').onchange=()=>{build();kick(.8);setTimeout(fit,700)};
  $('mapFind').onchange=()=>{const q=norm($('mapFind').value);const n=nodes.find(x=>norm(x.label)===q)||nodes.find(x=>norm(x.label).includes(q));if(n){if(cam.k<1)cam.k=1.2;select(n,true)}};
  addEventListener('resize',()=>{if(active)resize()});
  return{
    open(){
      const topics=[...new Set(guides.map(g=>g.topic||''))];
      const cur=$('mapTopic').value;
      $('mapTopic').innerHTML='<option value="__all">All topics</option>'+topics.map(t=>'<option value="'+esc(t).replace(/"/g,'&quot;')+'">'+(t?esc(t):'(No topic)')+'</option>').join('');
      if([...$('mapTopic').options].some(o=>o.value===cur))$('mapTopic').value=cur;
      active=true;resize();
      const ns=JSON.stringify(guides)+$('mapTopic').value;
      if(ns!==sig){const first=!nodes.length;sig=ns;build();if(first){for(let i=0;i<300;i++){alpha=Math.max(alpha,.8);step()}alpha=.3}kick(.3);fit()}
      redraw();
    },
    close(){active=false}
  };
})();

build();
</script>
